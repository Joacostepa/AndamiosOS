  if(k==='cam'){
    const drv=Object.keys(P).filter(id=>canDrive(id)&&free(id)&&!trucksOf(S,id).length&&(S.sin.includes(id)||S.col.dep.p.includes(id)));
    h+=g('Pueden manejar',drv.map(id=>chipP(id,S.sin.includes(id)?'sin asignar':'depósito')).join(''));
    tip='Arrastrá un chofer a un camión · soltá un chofer acá para sacarlo';
  } else {
    h+=g('Sin asignar',S.sin.filter(free).map(id=>chipP(id)).join(''));
    if(k!=='dep'){
      h+=g('Depósito',S.col.dep.p.filter(free).map(id=>chipP(id,'',S.col.dep.lead===id)).join(''));
      h+=g('Contratistas',CONTR.map(c=>{const u=ctOf(S,k)[c.id]||0;return '<div class="chip kc" data-k="kc:'+c.id+'" data-drag="k:'+c.id+'" tabindex="0" role="button" aria-label="Contratista '+esc(c.n)+'. Tocá o arrastrá para sumar 1">'+ic('crew')+'<span class="nm">'+esc(c.n)+'</span>'+(u?'<small>+'+u+' acá</small>':'')+'</div>'}).join(''));
      h+=g('Camiones libres',S.libres.map(t=>'<div class="chip tcs'+(UI.sel==='t:'+t?' is-sel':'')+'" data-k="t:'+t+'" data-drag="t:'+t+'" style="--tk:'+kv(TR[t].k)+'" tabindex="0" role="button" aria-label="'+esc(TR[t].corto)+' libre. Arrastralo a la sección Camión">'+ic('truck')+'<span class="nm">'+esc(TR[t].corto)+'</span><small>'+(S.drv[t]?esc(pn(S.drv[t])):'sin chofer')+'</small></div>').join(''));
    }
    tip='Arrastrá a la tarjeta (o tocá y elegí destino) · soltá acá para sacar a alguien';
  }
  if(!h)h='<div class="empty">Nadie disponible'+(k==='cam'?' · usá «Cambiar chofer»':' · usá «Traer de otra cuadrilla…»')+'</div>';
  return '<div class="rp-strip" data-col="sin" data-zone="t:libres" aria-label="Disponibles"><div class="rp-sw"><div class="rp-sh"><b>Disponibles</b><span>'+tip+'</span></div>'+
    '<div class="rp-row" data-zone="p:sin" data-dir="w">'+h+'</div></div></div>';
}
function traerMenu(anchor,k){
  let h='<h4>Traer a '+(k==='dep'?'el depósito':'la '+COL[k].n)+'</h4>', any=false;
  CREWS.filter(c=>c!==k).forEach(c=>{const col=S.col[c], drs=col.tr.filter(t=>S.drv[t]);
    if(!col.p.length&&!drs.length)return; any=true;
    h+='<div class="tg"><div class="tg-h"><span class="dest" style="--k:'+kv(COL[c].k)+'">'+COL[c].n+'</span>'+esc(COL[c].name)+'<small>'+headcount(S,c)+' de '+COL[c].need+'</small></div>'+
      col.p.map(id=>{const lead=col.lead===id, e=estado(S,id);
        return '<button class="it" data-traer="p:'+id+'">'+ic(lead?'star':'user')+esc(pn(id))+(e==='no'?'<span class="st bad">no vino</span>':'<small>'+(lead?'a cargo':canDrive(id)?'maneja':'')+'</small>')+'</button>'}).join('')+
      drs.map(t=>'<button class="it" data-traer="d:'+t+'">'+ic('wheel')+esc(pn(S.drv[t]))+'<small>chofer del '+esc(TR[t].corto)+'</small></button>').join('')+'</div>';
  });
  if(!any)h+='<p>No hay gente en otras cuadrillas.</p>';
  openPop(anchor,h,'Traer de otra cuadrilla','wide');
}
function personMenu(anchor,c,id){
  openPop(anchor,'<h4>Mandar a '+esc(pn(id))+' a…</h4><div class="dsts">'+CREWS.filter(x=>x!==c).map(x=>'<button data-mandar="'+id+':'+x+'" style="--k:'+kv(COL[x].k)+'" aria-label="'+esc(COL[x].name)+'">'+COL[x].n+'</button>').join('')+'</div>'+
    (c!=='dep'?'<button class="it" data-mandar="'+id+':dep"><span class="dest" style="--k:var(--cd)">D</span>Depósito</button>':'')+
    '<button class="it" data-mandar="'+id+':sin">'+ic('user')+'Sin asignar</button>'+
    '<button class="it" data-mandar="'+id+':nv:'+c+'">'+ic('x')+'No vino</button>','Mandar a otro lado');
}
function trMenu(anchor,t){
  const pl=placeOfTruck(S,t);
  openPop(anchor,'<h4>¿Con qué cuadrilla va el '+esc(TR[t].corto)+'?</h4><div class="dsts">'+CREWS.map(c=>'<button data-trgo="'+t+':'+c+'" style="--k:'+kv(COL[c].k)+'" aria-pressed="'+(pl===c)+'" aria-label="'+esc(COL[c].name)+'">'+COL[c].n+'</button>').join('')+'</div>'+
    (pl!=='libres'?'<button class="it" data-trgo="'+t+':libres">'+ic('back')+'Queda libre</button>':''),'Cuadrilla del camión');
}
function reHtml(cards,k){
  const re=S.rep.re||{}, list=cards.filter(c=>c!==k&&re[c]&&!S.rep.st[c]);
  if(!list.length)return '';
  return '<div class="rp-re" role="status">'+list.map(c=>'<div class="warnline">'+ic('tri')+'<span>'+esc(re[c])+'</span><button data-rpgo="'+cards.indexOf(c)+'">Ir</button></div>').join('')+'</div>';
}
function drawRep(){
  if(!UI.rep)return;
  const cards=repCards(), n=cards.length, i=Math.min(S.rep.i,n), k=cards[i], fin=i>=n, fx=UI.rep.fixing&&!fin;
  const av=computeAvisos(S);
  const anyFix=cards.some(c=>S.rep.st[c]==='fix'||(S.rep.log[c]||[]).length);
  const scroll=$('#rep .rp-stage')?$('#rep .rp-stage').scrollTop:0, sx=$('#rep .rp-row')?$('#rep .rp-row').scrollLeft:0;
  let h='<div class="rp" role="dialog" aria-modal="true" aria-label="Repaso de la mañana">'+
    '<header class="rp-top"><div class="rp-t"><b>Repaso de la mañana</b><small>'+esc(dia().long)+' · antes de que salgan</small></div>'+
    '<div class="rp-prog"><span class="mono" aria-live="polite">'+(fin?'Listo':(i+1)+' / '+n)+'</span><div class="dots">'+
      cards.map((c,j)=>{const re=!S.rep.st[c]&&S.rep.re&&S.rep.re[c];return '<button class="dotb'+(S.rep.st[c]?' '+S.rep.st[c]:re?' re':'')+'" data-rpgo="'+j+'"'+(j===i?' aria-current="step"':'')+' aria-label="'+esc(c==='cam'?'Camiones y choferes':COL[c].name)+(S.rep.st[c]==='ok'?', bien':S.rep.st[c]==='fix'?', con cambios':re?', para revisar':'')+'" title="'+esc(c==='cam'?'Camiones':COL[c].name)+(re?' · para revisar':'')+'"></button>'}).join('')+
      '<button class="dotb end'+(fin?'':'')+'" data-rpgo="'+n+'"'+(fin?' aria-current="step"':'')+' aria-label="Resumen" title="Resumen"></button></div></div>'+
    '<button class="btn rp-undo" data-act="undo" '+(H().length?'':'disabled')+' title="Deshacer (Ctrl+Z)" aria-label="Deshacer">'+ic('undo')+'<span>Deshacer</span></button>'+
    '<button class="btn" data-act="rep-x">'+ic('x')+'Salir <kbd>Esc</kbd></button></header>'+
    '<div class="rp-stage">'+reHtml(cards,k)+(fin?rcSummary():rcCard(k,fx,av))+'</div>'+(fx?rpStrip(k):'')+
    '<footer class="rp-foot"><button class="btn bigb rp-nav" data-act="rep-prev" '+(i>0?'':'disabled')+' aria-label="Anterior">'+ic('prev')+'</button>';
  if(fin)h+=(anyFix&&S.dirty?'<button class="btn bigb pri" data-act="rep-send">'+ic('send')+'Mandar cambios a los afectados</button>':'<button class="btn bigb go" data-act="rep-x">'+ic('check')+'Cerrar</button>')+
    '<button class="btn bigb" data-act="rep-start" style="flex:none">Desde el principio</button>';
  else if(fx)h+='<button class="btn bigb go" data-act="rep-ok">'+ic('check')+'Listo · siguiente</button>';
  else h+='<button class="btn bigb" data-act="rep-fix">'+ic('undo')+'Corregir</button><button class="btn bigb go" data-act="rep-ok">'+ic('check')+'Todo bien</button>';
  h+='<button class="btn bigb rp-nav" data-act="rep-next" '+(i<n?'':'disabled')+' aria-label="Siguiente">'+ic('next')+'</button></footer></div>';
  const ae=document.activeElement, keepAct=ae&&$('#rep').contains(ae)?(ae.dataset.act||null):null;
  $('#rep').innerHTML=h; $('#rep').hidden=false;
  $('#rep .rp-stage').scrollTop=scroll; if($('#rep .rp-row'))$('#rep .rp-row').scrollLeft=sx;
  document.documentElement.style.setProperty('--rpb',(($('#rep .rp-foot')||{}).offsetHeight||0)+(($('#rep .rp-strip')||{}).offsetHeight||0)+'px');
  if(keepAct){const b=$('#rep [data-act="'+keepAct+'"]');if(b)b.focus({preventScroll:true})}
}

syncAll();
save();
render({});
addEventListener('resize',()=>document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px'));
</script>
