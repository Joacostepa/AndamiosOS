<title>Pizarrón del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: pizarrón de obra. Columnas = lugares de trabajo (Cuadrilla 1–5 + Depósito), fichas = personas y camiones,
   bandeja inferior = sin asignar · camiones libres · no vienen; a la derecha, pedidos de hoy y un mini-mapa. */
:root{
  --bg:#E7EAEC; --surface:#FFFFFF; --surface-2:#F3F5F6; --sunk:#DCE1E4; --line:#CBD2D7; --line-2:#A2ADB5;
  --ink:#12181D; --muted:#55616A; --faint:#7F8A92; --on-k:#FFFFFF;
  --accent:#D2470C; --accent-ink:#FFFFFF; --accent-soft:#FCE5D7;
  --warn:#8A5600; --warn-bg:#FFF0CC; --warn-line:#E0A01A;
  --ok:#1F7542; --ok-bg:#DCEFE3;
  --bad:#B42318; --bad-bg:#FDE4E1;
  --c1:#2350A8; --c2:#6B35A0; --c3:#A05A10; --c4:#A3245A; --c5:#1F6D66; --cd:#55616A;
  --t1:#2F8AD6; --t2:#CC4499; --t3:#109C92; --t4:#7E60D8; --t5:#5C9424; --t6:#D47F12;
  --map-land:#F5F7F8; --map-water:#CFE0EA;
  --shadow:0 1px 0 rgba(18,24,29,.06),0 1px 2px rgba(18,24,29,.08);
  --lift:0 14px 28px rgba(18,24,29,.22),0 4px 8px rgba(18,24,29,.14);
  --font-d:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-b:"Archivo","Segoe UI",Roboto,Arial,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1418; --surface:#171E23; --surface-2:#1D252B; --sunk:#252F36; --line:#2E3A43; --line-2:#4B5966;
  --ink:#E5EAED; --muted:#9BA8B2; --faint:#76838D; --on-k:#0D1215;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3B2216;
  --warn:#F3BC4A; --warn-bg:#33280F; --warn-line:#C98F1A;
  --ok:#62C98D; --ok-bg:#163021;
  --bad:#FF7B6E; --bad-bg:#3A1A17;
  --c1:#7398E6; --c2:#B286E0; --c3:#DA9D57; --c4:#E57CA2; --c5:#5CB7AD; --cd:#9AA6B0;
  --t1:#5BAAEB; --t2:#E674BE; --t3:#35C4BA; --t4:#A48DEC; --t5:#8FC34C; --t6:#F0A447;
  --map-land:#1B242A; --map-water:#13252F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.4);
  --lift:0 16px 30px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#171E23; --surface-2:#1D252B; --sunk:#252F36; --line:#2E3A43; --line-2:#4B5966;
  --ink:#E5EAED; --muted:#9BA8B2; --faint:#76838D; --on-k:#0D1215;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#3B2216;
  --warn:#F3BC4A; --warn-bg:#33280F; --warn-line:#C98F1A;
  --ok:#62C98D; --ok-bg:#163021;
  --bad:#FF7B6E; --bad-bg:#3A1A17;
  --c1:#7398E6; --c2:#B286E0; --c3:#DA9D57; --c4:#E57CA2; --c5:#5CB7AD; --cd:#9AA6B0;
  --t1:#5BAAEB; --t2:#E674BE; --t3:#35C4BA; --t4:#A48DEC; --t5:#8FC34C; --t6:#F0A447;
  --map-land:#1B242A; --map-water:#13252F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.4);
  --lift:0 16px 30px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.35 var(--font-b);margin:0;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
.day{font:700 24px/1 var(--font-d);font-stretch:80%;letter-spacing:.005em}
.day small{display:block;font:500 12px/1.2 var(--font-b);font-stretch:100%;color:var(--muted);margin-top:3px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;font-size:13.5px;min-height:38px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12.5px}
.btn.icon{padding:8px 10px}
.count{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;font-size:13.5px;border:1.5px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);min-height:38px}
.count.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.count .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:4px;background:var(--warn);color:var(--surface);font-size:13px;padding:0 5px}
.count.ok .n{background:var(--ok)}

/* ---------- disposición ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px 16px 28px;align-items:start}
.board{min-width:0;display:flex;flex-direction:column;gap:12px}
.cols-wrap{overflow-x:auto;padding-bottom:4px}
.cols{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;min-width:930px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;position:relative;transition:opacity .25s,box-shadow .2s;box-shadow:var(--shadow)}
.col::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:5px;border-radius:8px 8px 0 0;background:var(--k)}
.col.dep::before{background:repeating-linear-gradient(-45deg,var(--cd) 0 6px,transparent 6px 11px)}
.ch{padding:14px 10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px dashed var(--line)}
.ch-top{display:flex;align-items:flex-end;gap:7px}
.cn{font:800 34px/.85 var(--font-d);font-stretch:75%;color:var(--k);min-width:22px;letter-spacing:-.01em}
.ch-txt{min-width:0;flex:1;padding-bottom:2px}
.ch-t{font:700 11px/1 var(--font-d);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.obra{display:flex;align-items:center;gap:4px;font-weight:600;font-size:13.5px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.obra svg{width:11px;height:11px;color:var(--faint)}
.cnt{font:600 12px/1 var(--font-b);color:var(--muted);white-space:nowrap;padding-top:2px}
.cnt b{font:700 15px/1 var(--font-m);color:var(--ink)}
.cnt.short{color:var(--warn);display:inline-flex;align-items:center;gap:3px}.cnt.short svg{width:13px;height:13px}.cnt.short b{color:var(--warn)}
.av{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:5px 6px 5px 7px;color:var(--warn);font-weight:700;font-size:12.5px;line-height:1.2}
.av svg{width:14px;height:14px}
.av span{flex:1;min-width:60px}
.av button{border:0;background:var(--warn);color:var(--surface);border-radius:4px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px;padding:8px;min-height:44px;flex:1}
.list.trucks{flex:none;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 8px 8px;min-height:62px}
.list.wrap{flex-direction:row;flex-wrap:wrap;align-content:flex-start;padding:4px 0 0}
.lbl{font:700 10.5px/1 var(--font-d);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.empty{font-size:12px;color:var(--faint);border:1.5px dashed var(--line);border-radius:6px;padding:9px 8px;text-align:center}
.has-ph>.empty{display:none}

/* ---------- fichas ---------- */
.chip{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;min-height:36px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:grab;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s,background .15s}
.chip:hover{border-color:var(--ink)}
.chip .nm{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .wh{color:var(--muted)}
.star{border:0;background:none;padding:4px;margin-left:-5px;display:grid;place-items:center;color:var(--line-2);border-radius:4px;min-width:26px;min-height:26px}
.star svg{width:16px;height:16px}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.star:not(.on):hover{color:var(--accent)}
.chip.lead{border-color:var(--ink);border-width:1.5px}
.mot{border:1px solid var(--line);background:var(--surface-2);border-radius:4px;font-size:11.5px;font-weight:700;padding:2px 6px;color:var(--muted)}
.chip.is-sel{outline:2.5px solid var(--accent);outline-offset:1px;box-shadow:var(--lift)}
.chip.origin{display:none}
.ph{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:6px;flex:none;opacity:.8}
.list.wrap .chip{min-height:34px}

/* camión */
.tc{flex-direction:column;align-items:stretch;gap:5px;padding:7px 8px 8px 12px;overflow:hidden}
.tc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tk)}
.tc-h{display:flex;align-items:center;gap:6px;min-width:0}
.tc-h .ti{color:var(--tk);width:18px;height:18px}
.tc-h .mk{font-weight:700;font-size:13px}
.pat{font:600 11.5px/1 var(--font-m);letter-spacing:.02em;border:1px solid var(--line-2);border-radius:3px;padding:2px 4px;white-space:nowrap;background:var(--surface-2)}
.tc-name{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;min-width:0}
.drv{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-weight:600;font-size:13px;cursor:grab;min-height:30px}
.drv:hover{border-color:var(--ink)}
.drv.clash{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.slot{display:flex;align-items:center;justify-content:center;gap:5px;border:1.5px dashed var(--warn-line);background:var(--warn-bg);color:var(--warn);border-radius:5px;padding:4px 6px;font-weight:700;font-size:12.5px;min-height:30px;width:100%}
.slot svg{width:13px;height:13px}
.tm-btn{display:flex;align-items:center;gap:5px;border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left;border-radius:3px}
.tm-btn svg{width:13px;height:13px;color:var(--muted)}
.tm-btn>span{display:flex;flex-wrap:wrap;gap:0 8px}.tm-btn b{font-family:var(--font-m);font-weight:600}
.tm-btn:hover{text-decoration:underline;text-underline-offset:2px}
.tc-ped{display:flex;gap:5px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.25}
.tc-ped svg{width:12px;height:12px;margin-top:1px}
.tc-ped.done{text-decoration:line-through;opacity:.7}
.tray .tc{width:212px}
.chip.drop-on{outline:2.5px solid var(--accent);outline-offset:2px;background:var(--accent-soft)}
.chip.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* selector inline del camión */
.pick{display:flex;flex-direction:column;gap:5px;margin-top:2px;cursor:default}
.pick .opt{border:1.5px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 7px;text-align:left;font-size:12.5px;font-weight:700}
.pick .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .opt .row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:3px;font-weight:600}
.tpill{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:3px 6px;font:600 12.5px/1 var(--font-m)}
.tpill:hover{border-color:var(--accent)}
.pick .ok{border:0;background:var(--ink);color:var(--surface);border-radius:5px;padding:6px;font-weight:700;font-size:12.5px}

/* ---------- bandeja inferior ---------- */
.tray{display:grid;gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:opacity .25s}
.box h3{margin:0;display:flex;align-items:center;gap:8px;font:700 12px/1 var(--font-d);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.box h3 .k{font:600 12px/1 var(--font-m);color:var(--faint);letter-spacing:0}
.box.no .chip{background:var(--surface-2);border-style:dashed}
.box.no .chip .nm{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}

/* selección por toque */
.targeting .col.tgt,.targeting .box.tgt{box-shadow:0 0 0 2px var(--accent);cursor:copy}
.targeting .chip.tgt{box-shadow:0 0 0 2px var(--accent)}
.zone-hot{box-shadow:0 0 0 2.5px var(--accent)!important}

/* resaltado de avisos */
.flashing .col:not(.has-av),.flashing .box:not(.has-av){opacity:.4}
.flashing .has-av .av,.flash-one .av{animation:pulse 1.1s ease-in-out 2}
.col.flash-one{box-shadow:0 0 0 3px var(--k)}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--warn-line)}}

/* ---------- lateral: pedidos ---------- */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,74px) + 12px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.card h2{margin:0 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;font:700 17px/1.1 var(--font-d);font-stretch:85%}
.card h2 span{font:500 12px/1 var(--font-b);color:var(--muted)}
.peds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ped{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:8px 8px 8px 6px;background:var(--surface);cursor:grab;user-select:none;-webkit-user-select:none;transition:opacity .2s,border-color .15s;box-shadow:var(--shadow)}
.ped:hover{border-color:var(--line-2)}
.ped.is-sel{outline:2.5px solid var(--accent);outline-offset:1px}
.ped.drag-dim{opacity:.35}
.ctb .list{flex:none}
.ped.done{background:var(--surface-2);box-shadow:none}
.ped.done .pq{text-decoration:line-through;color:var(--muted)}
.ck{grid-row:span 3;width:24px;height:24px;border:1.75px solid var(--line-2);border-radius:5px;background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.ck svg{width:15px;height:15px;opacity:0;stroke-width:2.4}
.ck[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ck[aria-checked="true"] svg{opacity:1}
.pq{font-weight:600;font-size:13.5px;line-height:1.25}
.pd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dest{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:4px;background:var(--k);color:var(--on-k);font:800 12px/1 var(--font-d);padding:0 4px}
.dest.out{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.pb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.byb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;padding:3px 7px;font-weight:700;font-size:12px;color:var(--ink);min-height:26px}
.byb .dot{width:9px;height:9px;border-radius:2px;background:var(--tk)}
.byb.empty{border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.addp{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.addp input{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 9px;width:100%;min-height:38px}
.dsts{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dsts button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:5px;min-width:30px;height:30px;font:800 13px/1 var(--font-d);color:var(--k)}
.dsts button[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:var(--on-k)}

/* mapa */
.map svg{display:block;width:100%;height:auto;border-radius:6px}
.pin{cursor:pointer}
.pin circle{transition:r .15s}
.pin.hot circle.b{r:13}
.map-note{font-size:11.5px;color:var(--faint);margin-top:6px}

/* arrastre */
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;will-change:transform}
.ghost>.chip,.ghost>.ped{transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s;box-shadow:var(--lift);cursor:grabbing;margin:0}
.ghost.up>.chip,.ghost.up>.ped{transform:scale(1.05) rotate(-1.5deg)}
body.dragging,body.dragging *{cursor:grabbing!important}

/* popover, toast, hoja de envío */
.pop{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--lift);padding:6px;min-width:210px;max-width:290px;max-height:min(420px,70vh);overflow:auto}
.pop h4{margin:4px 6px 6px;font:700 11px/1 var(--font-d);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pop .it{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:5px;font-size:13.5px;font-weight:600}
.pop .it:hover,.pop .it:focus-visible{background:var(--surface-2)}
.pop .it small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.pop .it .dot{width:10px;height:10px;border-radius:2px;background:var(--tk);flex:none}
.pop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px}
.pop .grid button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 0;font:600 13px/1 var(--font-m)}
.pop .grid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--surface);border-radius:8px;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:13.5px;box-shadow:var(--lift);max-width:calc(100vw - 32px);width:max-content}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 6px}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}
.hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:65;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 8px 9px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;box-shadow:var(--lift);max-width:calc(100vw - 32px)}
.hint button{border:0;background:rgba(0,0,0,.18);color:inherit;border-radius:999px;padding:4px 10px;font-weight:700}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,14,17,.45);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:10px;box-shadow:var(--lift);width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 18px 16px}
.sheet h2{margin:0;font:700 22px/1.1 var(--font-d);font-stretch:85%}
.sheet p{margin:6px 0 12px;color:var(--muted)}
.rcp{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column}
.rcp li{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.rcp li svg{grid-row:span 2;margin-top:2px;width:18px;height:18px;color:var(--muted)}
.rcp b{font-size:14px}
.rcp span{font-size:13px;color:var(--muted)}
.warnline{display:flex;gap:8px;align-items:center;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:6px;padding:8px 10px;font-weight:700;margin-bottom:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* ---------- días ---------- */
.top.is-today{box-shadow:inset 0 3px 0 var(--ok)}
.tag{display:inline-flex;align-items:center;gap:5px;vertical-align:4px;margin-left:8px;font:700 10.5px/1 var(--font-b);font-stretch:100%;text-transform:uppercase;letter-spacing:.07em;padding:4px 7px;border-radius:4px;white-space:nowrap}
.tag.live{background:var(--ok-bg);color:var(--ok)}
.tag.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{opacity:.25}}
.tag.next{background:var(--accent-soft);color:var(--accent)}
.tag.later{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.days{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dnav{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;padding:0}
.dnav:disabled{opacity:.35;cursor:default}
.dchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;min-height:32px;white-space:nowrap;transition:background .15s,color .15s}
.dchip .r{font-weight:500;color:var(--muted)}
.dchip:hover{background:var(--surface-2)}
.dchip[aria-current="date"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dchip[aria-current="date"] .r{color:inherit;opacity:.75}
a.btn{text-decoration:none;color:inherit}
.blank{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border:1.5px dashed var(--line-2);border-radius:8px;padding:16px 18px}
.blank b{font:700 19px/1.15 var(--font-d);font-stretch:85%;display:block}
.blank span{color:var(--muted);font-size:13px}
.blank .btn{min-height:46px;padding:10px 18px;font-size:15px}
.foot{padding:0 16px 24px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--faint)}
.foot button{border:0;background:none;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:12px}
.foot button.arm{color:var(--accent);font-weight:700}

/* ---------- qué se ejecuta ---------- */
.ots{display:flex;flex-direction:column;gap:6px}
.ot+.ot{border-top:1px dotted var(--line-2);padding-top:6px}
.ot .hr{font:600 11.5px/1 var(--font-m);color:var(--muted);margin-right:2px}
.ow{font-size:12px;line-height:1.3;color:var(--muted);margin-top:2px;font-stretch:90%}
.ow b{color:var(--ink);font-weight:700}
.jor{display:inline-block;white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);border-radius:3px;padding:0 4px;font-weight:600;color:var(--ink);font-stretch:100%}
.nota{display:inline-grid;place-items:center;vertical-align:-3px;width:22px;height:20px;margin-left:3px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0}
.nota svg{width:12px;height:12px}
.pop p{margin:2px 8px 8px;font-size:13.5px;line-height:1.4}

/* ---------- contratistas ---------- */
.cts{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.ct{display:flex;align-items:center;gap:4px;border:1.5px dashed var(--line-2);background:var(--surface-2);border-radius:6px;min-height:36px;padding:2px 3px}
.ct .nm{flex:1;min-width:0;font-weight:600;font-size:13px;line-height:1.15;overflow-wrap:anywhere;text-align:center;padding:2px 0}
.ct .nm b{font:600 15px/1 var(--font-m)}
.ct .nm svg{color:var(--muted)}
.stp{border:1px solid var(--line-2);background:var(--surface);border-radius:4px;width:26px;height:28px;display:grid;place-items:center;padding:0;flex:none}
.stp:hover{border-color:var(--ink)}
.stp svg{width:13px;height:13px}
.chip.kc{border-style:dashed;background:var(--surface-2)}
.chip.kc small{color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.drag-dim{opacity:.35}
.ctb .list{flex:none}
.addct{display:flex;flex-direction:column;gap:6px;padding:2px 6px 6px}
.addct input{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 9px;width:100%;min-height:38px}
.pop .dsts{padding:2px 6px 6px}

/* ---------- pedido a otra dirección ---------- */
.dsts .dirb{--k:var(--accent);display:inline-flex;align-items:center;gap:4px;padding:0 8px;font:700 12.5px/1 var(--font-b)}
.dsts .dirb svg{width:13px;height:13px}
.ndh{display:flex;align-items:flex-start;gap:5px;font-size:12px;color:var(--muted);line-height:1.3}
.ndh svg{width:13px;height:13px;margin-top:1px;color:var(--accent)}
.ndh.ok{color:var(--ok)}.ndh.ok svg{color:var(--ok)}
.dest.dir{background:var(--accent);color:var(--accent-ink)}
.dest.dir svg{width:12px;height:12px}
.map.placing svg{touch-action:none;cursor:crosshair}
.map.placing{box-shadow:0 0 0 2px var(--accent)}
.qpin{cursor:pointer}
.qpin.done{opacity:.45}
.newpin .ring{animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}

/* ---------- cuadrilla con varias obras ---------- */
.many{display:inline-block;margin-left:5px;vertical-align:1px;font:700 10.5px/1 var(--font-b);letter-spacing:.03em;text-transform:none;padding:3px 6px;border-radius:999px;background:var(--k);color:var(--on-k)}
.seq{display:flex;flex-direction:column}
.sq{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 5px;align-items:start}
.sq-h{font:700 12px/1.3 var(--font-m);color:var(--k);padding-top:1px}
.sq .obra{font-size:13px}
.sq-go{display:flex;align-items:center;gap:4px;padding:4px 0 4px 9px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.15}
.sq-go svg{width:13px;height:13px;color:var(--k)}

/* ---------- recorrido del camión ---------- */
.rec-btn{display:flex;align-items:center;gap:5px;border:1px dashed var(--line-2);background:var(--surface);border-radius:5px;padding:4px 6px;font-size:12px;font-weight:600;color:var(--ink);text-align:left;width:100%;min-height:28px;line-height:1.2}
.rec-btn.has{border-style:solid;background:var(--surface-2)}
.rec-btn svg{width:13px;height:13px;color:var(--tk)}
.rec-btn:hover{border-color:var(--ink)}
.sheet.rec{width:min(640px,100%);padding:0;display:flex;flex-direction:column}
.rec-h{display:flex;gap:10px;align-items:flex-start;padding:16px 14px 12px 20px;border-bottom:1px solid var(--line);position:relative}
.rec-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tk);border-radius:10px 0 0 0}
.rec-h>div{flex:1;min-width:0}
.rec-h p{margin:4px 0 0}
.rec-b{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.rec-at{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rec-at button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;min-height:34px}
.rec-at button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rec-at small{flex-basis:100%;color:var(--faint);font-size:12px}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.stop{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:start;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 6px 8px 2px;position:relative;box-shadow:var(--shadow)}
.stop+.stop::before{content:"";position:absolute;left:44px;top:-11px;height:10px;border-left:2px dotted var(--line-2)}
.stop.lift{z-index:5;box-shadow:var(--lift);border-color:var(--accent)}
.stop.lift::before{display:none}
.grip{border:0;background:none;width:30px;min-height:40px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;border-radius:4px;padding:0}
.grip:hover{color:var(--ink);background:var(--surface-2)}
.grip svg{width:16px;height:16px}
.snum{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 13px/1 var(--font-m);margin-top:6px}
.sbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.splace{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;font-weight:700;font-size:14.5px;text-align:left;min-height:38px;width:100%}
.splace .tx{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.splace .tx small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.splace:hover,.spill:hover{border-color:var(--ink)}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px;min-height:32px}
.spill.empty{color:var(--faint);border-style:dashed}
.spill b{font:600 13px/1 var(--font-m)}
.snota{flex:1;min-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px;min-height:32px}
.sdel{border:0;background:none;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:6px;padding:0}
.sdel:hover{background:var(--surface-2);color:var(--ink)}
.rec-sug{display:flex;flex-direction:column;gap:6px;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.rec-sug button{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 8px;font-weight:600;font-size:13px;text-align:left;min-height:34px}
.rec-sug button svg{color:var(--accent)}
.rec-sug button .dv{margin-left:auto;font:600 12px/1 var(--font-m);color:var(--muted);white-space:nowrap}
/* parada que sale de un pedido */
.sped{display:flex;align-items:center;gap:6px;align-self:flex-start;max-width:100%;border:1px solid var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px 3px 7px;font-size:12.5px;font-weight:600;line-height:1.25}
.sped svg{width:13px;height:13px;color:var(--accent)}
.sped .k{font:700 10.5px/1 var(--font-d);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.sped .q{min-width:0;overflow-wrap:anywhere}
.sped b{color:var(--ok);font-size:12px}
.sped.ok{border-color:var(--ok);background:var(--ok-bg)}.sped.ok svg,.sped.ok .k{color:var(--ok)}
.stop.ok .snum{background:var(--ok)}
/* ¿quién pasa cerca? */
.pb{flex-wrap:wrap}
.nearb{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:4px;padding:3px 7px;font-weight:700;font-size:12px;color:var(--ink);min-height:26px}
.nearb svg{width:12px;height:12px;color:var(--accent)}
.nearb:hover{border-color:var(--ink)}
.pb .ps{font:600 11.5px/1 var(--font-m);color:var(--muted)}
.pop.nearp{width:min(360px,calc(100vw - 16px));max-width:none}
.pop .it.near{align-items:flex-start;padding:8px 6px 8px 8px}
.pop .it.near .dot{margin-top:4px}
.near .nb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.near .nb b{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px}
.near .nb>span{font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
.near .nd{flex:none;font:600 12px/1 var(--font-m);padding:4px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.near .nd.best{background:var(--ok-bg);color:var(--ok)}
.rec-f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 10px 10px}
.pop.wide{max-width:min(320px,calc(100vw - 16px));width:300px}
.pop .map{margin:2px 6px 6px}
.pop .map svg{display:block;width:100%;height:auto;border-radius:6px}
.pop .ndh{margin:2px 6px 6px}

/* ---------- repaso de la mañana ---------- */
.btn.rep{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.rep:hover{background:var(--ink);filter:brightness(1.15)}
.rp{position:fixed;inset:0;z-index:75;background:var(--bg);display:flex;flex-direction:column}
.rp-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--ok)}
.rp-t b{display:block;font:700 22px/1 var(--font-d);font-stretch:80%}
.rp-t small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.rp-prog{display:flex;align-items:center;gap:10px;margin-left:auto}
.rp-prog .mono{font-size:15px;font-weight:600;min-width:42px;text-align:right}
.dots{display:flex;gap:7px;align-items:center}
.dotb{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);padding:0;transition:transform .2s,background .2s,border-color .2s}
.dotb.ok{background:var(--ok);border-color:var(--ok)}
.dotb.fix{background:var(--accent);border-color:var(--accent)}
.dotb[aria-current="step"]{transform:scale(1.4);border-color:var(--ink)}
.dotb.end{border-radius:3px}
.rp-stage{flex:1;overflow:auto;padding:18px 16px 24px;display:flex;flex-direction:column;align-items:center}
.rc{width:min(840px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;padding:24px 24px 20px}
.rc::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--k)}
.rc.dep::before{background:repeating-linear-gradient(-45deg,var(--cd) 0 7px,transparent 7px 13px)}
.rc-h{display:flex;gap:14px;align-items:flex-start}
.rc-n{font:800 68px/.8 var(--font-d);font-stretch:75%;color:var(--k);min-width:36px;letter-spacing:-.01em}
.rc-n svg{width:52px;height:52px;stroke-width:1.5}
.rc-ht{flex:1;min-width:0}
.rc-k{font:700 13px/1 var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.rc-k .many{font-size:12px;padding:4px 8px}
.rc-mark{display:inline-flex;align-items:center;gap:5px;margin-left:auto;font:700 12.5px/1 var(--font-b);letter-spacing:0;text-transform:none;padding:5px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.rc-mark.fix{background:var(--accent-soft);color:var(--accent)}
.rc-ob{font:700 28px/1.08 var(--font-d);font-stretch:85%;overflow-wrap:anywhere}
.rc-ow{font-size:16px;color:var(--muted);margin-top:3px;line-height:1.3}
.rc-ow b{color:var(--ink)}
.rc-seq .sq{grid-template-columns:62px minmax(0,1fr);gap:0 10px}
.rc-seq .sq-h{font-size:19px;line-height:1.35}
.rc-seq .rc-ob{font-size:25px}
.rc-seq .sq-go{font-size:14.5px;padding:6px 0 6px 18px}
.rc-seq .sq-go svg{width:18px;height:18px}
.rc-av{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.rc .av{font-size:15.5px;padding:8px 8px 8px 10px;gap:6px 10px}
.rc .av svg{width:18px;height:18px}
.rc .av button{font-size:14.5px;padding:9px 14px;border-radius:6px}
.rc-s{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.rc-s h3{margin:0 0 9px;font:700 12.5px/1 var(--font-d);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.rc-s h3 .mono{letter-spacing:0;color:var(--ink);font-size:14px}
.rc-ppl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px}
.rc-p{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:50px}
.rc-p .nm{font-size:19px;font-weight:700;flex:1 0 auto}
.rc-p.lead{border:1.5px solid var(--ink)}
.rc-p>svg{width:18px;height:18px;color:var(--accent);fill:currentColor}
.rc-p.out{border-style:dashed;background:var(--surface-2)}
.rc-p.out .nm{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.st{display:inline-flex;gap:4px;align-items:center;font-size:13px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.st svg{width:13px;height:13px;stroke-width:2.2}
.st.ok{color:var(--ok);background:var(--ok-bg)}
.st.pend{color:var(--warn);background:var(--warn-bg)}
.st.bad{color:var(--bad);background:var(--bad-bg)}
.rc-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:18px}
.rc-line b{font-weight:700}
.rc-line .muted{color:var(--muted);font-size:15px}
.leads{display:flex;flex-wrap:wrap;gap:6px}
.leads button{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:15px;min-height:42px}
.leads button svg{width:15px;height:15px}
.leads button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.leads button[aria-pressed="true"] svg{fill:currentColor}
.rc-tr{border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px}
.rc-tr+.rc-tr{margin-top:8px}
.rc-tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tk)}
.rc-tr .rc-line svg{color:var(--tk);width:20px;height:20px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;list-style:none;margin:0;padding:0;font-size:15px;line-height:1.3}
.route li{display:inline-flex;align-items:baseline;gap:5px}
.route li+li::before{content:"→";color:var(--faint);margin-right:2px}
.route .mono{font-size:13.5px;color:var(--muted)}
.route small{color:var(--muted);font-size:13px}
.route li.ok>span{color:var(--muted)}
.route li svg.i{width:14px;height:14px;color:var(--ok);stroke-width:2.4;align-self:center}
.rc-peds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:16px}
.rc-peds li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rc-peds li.done{color:var(--muted);text-decoration:line-through}
.rc-peds small{color:var(--muted);font-size:13.5px;text-decoration:none}
.rc-fixnote{display:flex;gap:8px;align-items:center;margin-top:16px;padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.rc-stamp{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 72%,transparent);pointer-events:none;z-index:3}
.rc-stamp span{width:116px;height:116px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;box-shadow:var(--lift)}
.rc-stamp svg{width:64px;height:64px;stroke-width:2.4}
.rc-sum{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}

<script>
'use strict';
/* ================= datos ================= */

per('sack','Sack');per('arrieta','Arrieta');per('godoy','Godoy');per('taboada','Taboada');per('munoz','Muñoz');per('paz','Paz');

};
const CREWS=['c1','c2','c3','c4','c5'], COLS=CREWS.concat(['dep']);
const TR={
  ab831:{mk:'Agrale',pat:'AB 831 LC',corto:'Agrale 831',k:'--t5'},
  ab799:{mk:'Iveco',pat:'AB 799 CA',corto:'Iveco 799',k:'--t1'},

const TRUCKS=Object.keys(TR);
const MOTIVOS=['ART','Avisó','No vino','Enfermo','Vacaciones','Franco'];

/* días: el pizarrón se arma la tarde anterior */
const DIAS=[
  {f:'2026-10-12',rel:'Hoy',short:'lun 12',long:'Lunes 12',full:'12 de octubre'},
  {f:'2026-10-13',rel:'Mañana',short:'mar 13',long:'Martes 13',full:'13 de octubre'},
  {f:'2026-10-14',rel:null,short:'mié 14',long:'Miércoles 14',full:'14 de octubre'}
];
const HOY='2026-10-12', DEF_DIA='2026-10-13';
const diaIdx=f=>DIAS.findIndex(d=>d.f===f);

/* qué se ejecuta en cada obra (viene del tablero, no se cambia acá).
   hasta: hasta qué hora (si después siguen a otra obra); va: cómo llegan a esa obra ('cuenta' | 'camion') */
function o(h,dir,ll,tipo,det,jor,nota,x){return Object.assign({h:h,dir:dir,ll:ll,tipo:tipo,det:det,jor:jor||'',nota:nota||''},x||{})}
const LL={cab:[-34.5672,-58.4490],jur:[-34.5627,-58.4590],riv:[-34.6290,-58.4615],gur:[-34.5890,-58.4282],sj:[-34.6232,-58.4058],
  hue:[-34.6175,-58.3668],cor:[-34.5985,-58.4385],bel:[-34.6131,-58.3935]};
const N_CAB='Entrar por cochera; cliente: Sra. Paz 11 5555-0000';
const N_HUE='Pedir la llave en portería; encargado: Rubén';
const OBRAS={
  '2026-10-12':{
    c1:[o('7:30','Av. Cabildo 1520',LL.cab,'Armado','andamio tubular fachada 12 m','día 3 de 5',N_CAB)],
    c2:[o('7:30','Juramento 2410',LL.jur,'Desarme','andamio tubular fachada','¼ jornada','',{hasta:'10:30'}),
        o('11:15','Ing. Huergo 913',LL.hue,'Mantenimiento','reponer rodapiés','',N_HUE,{va:'cuenta'})],
    c3:[o('7:30','Av. Rivadavia 6890',LL.riv,'Desarme','colgante medianera 8 pisos','día 2 de 3')],
    c4:[o('8:00','Gurruchaga 1650',LL.gur,'Armado','multidireccional en el patio','día 1 de 2','Avisar al portero antes de descargar')],
    c5:[o('7:30','Av. San Juan 2840',LL.sj,'Desarme','andamio tubular fachada','')]
  },
  '2026-10-13':{
    c1:[o('7:30','Av. Cabildo 1520',LL.cab,'Armado','andamio tubular fachada 12 m','día 4 de 5',N_CAB)],
    c2:[o('7:30','Juramento 2410',LL.jur,'Desarme','bajar lo que quedó y cargar','¼ jornada','',{hasta:'9:30'}),
        o('10:30','Ing. Huergo 913',LL.hue,'Mantenimiento','terminar rodapiés y lonas','½ jornada',N_HUE,{va:'cuenta'})],
    c3:[o('7:30','Av. Rivadavia 6890',LL.riv,'Desarme','colgante medianera 8 pisos','día 3 de 3')],
    c4:[o('8:00','Gurruchaga 1650',LL.gur,'Armado','multidireccional en el patio','día 2 de 2','Avisar al portero antes de descargar')],
    c5:[o('7:30','Av. San Juan 2840',LL.sj,'Desarme','terminar y cargar','½ jornada')]
  },
  '2026-10-14':{
    c1:[o('7:30','Av. Cabildo 1520',LL.cab,'Armado','andamio tubular fachada 12 m','día 5 de 5',N_CAB)],
    c2:[o('7:30','Ing. Huergo 913',LL.hue,'Armado','bandeja de protección','día 1 de 3',N_HUE)],
    c3:[o('7:30','Av. Rivadavia 6890',LL.riv,'Retiro','cargar lo desarmado','½ jornada')],
    c4:[o('7:30','Av. Corrientes 5320',LL.cor,'Armado','andamio tubular fachada 9 m','día 1 de 4','Cortan media calzada de 8 a 10; volquete en la puerta')],
    c5:[o('8:00','Av. Belgrano 1840',LL.bel,'Mantenimiento','cambiar lonas rotas','½ jornada')]
  }
};
/* otros lugares adonde va un camión */
const LUG={sanz:{n:'Galvanizados Sanz',dir:'Av. Gral. Mosconi 3150',ll:[-34.5905,-58.5040]}};
const ACC=[['lleva_gente','Lleva gente'],['deja_material','Deja material'],['carga','Carga'],['descarga','Descarga'],['busca_gente','Busca gente'],['compra','Compra'],['espera','Espera']];
const accN=a=>(ACC.find(x=>x[0]===a)||[0,a])[1];
const t2m=h=>{if(!h)return null;const a=String(h).split(':');return (+a[0])*60+(+a[1]||0)};
const m2t=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
function stp(tipo,ref,accion,hora,nota,dir,ll){return {tipo:tipo,ref:ref||null,dir:dir||null,ll:ll||null,accion:accion,hora:hora||null,nota:nota||null}}
/* ejemplo: el Iveco 799 de Nuñez deja a la 2 y sigue a buscar lo desarmado de la 3 */
const REC_NUNEZ=()=>[stp('dep',null,'carga','7:00','gente y material'),stp('obra','c2:0','deja_material','7:30','deja gente y material'),
  stp('obra','c3:0','carga','8:15','lo desarmado'),stp('dep',null,'descarga','9:00',null)];
/* hoy: a las 10:40 Nuñez está cargando en Juramento; después lleva la 2 a Huergo y baja por San Juan a buscar lo de Rivadavia */
const REC_HOY=()=>[stp('dep',null,'carga','7:00','gente y material'),stp('obra','c2:0','deja_material','7:30','deja gente y material'),
  stp('obra','c2:0','carga','10:30','lo desarmado'),stp('obra','c2:1','lleva_gente','11:15','la 2 sigue en Huergo'),
  stp('obra','c3:0','carga','12:30','lo desarmado'),stp('dep',null,'descarga','13:30',null)];

const CONTR0=[{id:'quintana',n:'Quintana'},{id:'ramirez',n:'Ramírez'}];

function baseDay(){
  return {
    col:{
      c1:{p:['sack','arrieta','godoy','taboada','munoz'],lead:'sack',tr:['ab831']},
      c2:{p:['conte','coronel','benitez','ledesma','rios'],lead:'conte',tr:['ab799']},
      c3:{p:['ortega','cabrera','garcia','vargas'],lead:'ortega',tr:['af669']},
      c4:{p:['hepper','perez','molina','dellacorte','paz'],lead:'hepper',tr:[]},
      c5:{p:['minoh','minoj','valj'],lead:'minoh',tr:[]},
      dep:{p:['omar','gongora','lopez','valr','acosta'],lead:'omar',tr:[]}
    },
    contr:{c5:{ramirez:2}},
    sin:['avila','sena'], no:[{id:'medina',m:'ART'}], libres:['ab497','s10','ah410'],
    tm:{ab831:{mode:'todo',ll:'7:00',bu:'17:00'},ab799:{mode:'lleva',ll:'7:00',bu:'17:00'},af669:{mode:'todo',ll:'7:00',bu:'17:00'}},

const pd=(id,que,dest,by,ok,creado,dir,ll)=>({id:id,que:que,dest:dest,dir:dir||null,ll:ll||null,by:by,ok:ok,creado:creado});
function seedDays(){
  const d12=baseDay();
  d12.contr.c3={quintana:1};
  d12.drv.ab497='avila'; d12.sin=['sena'];

    pd('l1','20 tablones y 2 escaleras','c1','ab497',true,7*60+5),
    pd('l2','10 vallas para la vereda','dir','s10',true,7*60+20,'Thames 1820, Palermo',[-34.5878,-58.4290]),

  ];
  d12.rec={ab799:REC_HOY()};
  /* la mañana de hoy: quién confirmó la hoja por Telegram y quién no vino según la asistencia */
  const conf={};COLS.forEach(c=>d12.col[c].p.forEach(id=>{conf[id]=1}));Object.keys(d12.drv).forEach(t=>{conf[d12.drv[t]]=1});

  ];
  d13.rec={ab799:REC_NUNEZ()};
  const d14={col:{},contr:{},sin:Object.keys(P),no:[],libres:TRUCKS.slice(),tm:{},drv:{},rec:{},ped:[],seq:10,sent:null,dirty:false,blank:true};
  COLS.forEach(c=>{d14.col[c]={p:[],lead:null,tr:[]}});
  return {'2026-10-12':d12,'2026-10-13':d13,'2026-10-14':d14};
}

/* ================= guardado (compartido con la pantalla 3D) ================= */
/* v:2 agrega recorridos (rec), la mañana de hoy (man) y el repaso (rep). v:3: un pedido con camión es una parada
   de su recorrido (parada.ped = id del pedido, parada.ok = hecho). Un v:2 se migra (se conservan recorridos y pedidos);
   cualquier otra cosa arranca de cero conservando sólo los contratistas dados de alta. */
const KEY='aba-maqueta-v1', KEY_PED='aba-maqueta-pedidos', KEY_REC='aba-maqueta-recorridos', VER=3;
let DAYS=null, CONTR=null, CUR=DEF_DIA;
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw)return false;
    const db=JSON.parse(raw);
    if(db&&Array.isArray(db.contr))CONTR0.splice(0,CONTR0.length,...db.contr.filter(c=>c&&c.id&&c.n));
    if(!db||(db.v!==VER&&db.v!==2)||!db.days||!DIAS.every(d=>db.days[d.f]&&db.days[d.f].col))return false;
    DAYS=db.days; CONTR=Array.isArray(db.contr)?db.contr:CONTR0.slice();
    DIAS.forEach(d=>{const s=DAYS[d.f];s.contr=s.contr||{};s.ped=s.ped||[];s.rec=s.rec||{}});
    if(db.v===2){ /* el ejemplo de hoy sin tocar pasa al nuevo (Nuñez baja por San Juan; "Retirar lo desarmado" sin camión) */
      const h=DAYS[HOY];
      if(JSON.stringify(h.rec.ab799)===JSON.stringify(REC_NUNEZ()))h.rec.ab799=REC_HOY();
      const l3=h.ped.find(p=>p.id==='l3'); if(l3&&l3.by==='ab497'&&!l3.ok)l3.by=null;
    } /* las paradas de pedido se completan en syncAll(), al final */
    CUR=diaIdx(db.cur)>-1?db.cur:DEF_DIA;
    return true;
  }catch(_){return false}
}
function flatPedidos(){
  const out=[];
  DIAS.forEach(d=>{(DAYS[d.f].ped||[]).forEach(p=>out.push({id:String(p.id),fecha:d.f,que:p.que,dest:p.dest,
    dir:p.dest==='dir'?(p.dir||''):null,ll:p.dest==='dir'&&p.ll?[+p.ll[0],+p.ll[1]]:null,
    by:p.by||null,ok:!!p.ok,creado:p.creado|0}))});
  return out;
}
/* recorridos en orden, para la pantalla 3D: uno por camión que esté con una cuadrilla o tenga paradas */
function flatRecorridos(){
  const out=[];
  DIAS.forEach(d=>{const st=DAYS[d.f];
    TRUCKS.forEach(t=>{
      const stops=getStops(st,t,d.f);
      if(placeOfTruck(st,t)==='libres'&&!stops.length)return;
      out.push({fecha:d.f,truck:t,driver:st.drv[t]||null,stops:stops.map(s=>{const pl=stopPlace(s,d.f), p=s.ped?st.ped.find(q=>q.id===s.ped):null;
        return {tipo:s.tipo,ref:s.tipo==='obra'||s.tipo==='lug'?s.ref:null,dir:pl.dir||null,ll:pl.ll?[+pl.ll[0],+pl.ll[1]]:null,
          accion:s.accion,hora:s.hora||null,nota:s.nota||null,ped:p?String(p.id):null,ok:p?!!p.ok:false}})});
    });
  });
  return out;
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({v:VER,cur:CUR,days:DAYS,contr:CONTR,obras:OBRAS,lugares:LUG,guardado:Date.now()}));
    localStorage.setItem(KEY_PED,JSON.stringify(flatPedidos()));

}

/* ================= consultas ================= */
function obrasOf(c,f){return c==='dep'?[]:((OBRAS[f||CUR]||{})[c]||[])}
function colDir(c){if(c==='dep')return COL.dep.obra;const o=obrasOf(c);return o.length?o.map(x=>x.dir).join(' → '):'Sin obra'}
function ctOf(st,c){return (st.contr&&st.contr[c])||{}}
function ctSum(st,c){const m=ctOf(st,c);let n=0;for(const k in m)n+=m[k];return n}
function headcount(st,c){return st.col[c].p.length+ctSum(st,c)}
function ctUsed(st,id){let n=0;CREWS.forEach(c=>{n+=ctOf(st,c)[id]||0});return n}
function placeOfPerson(st,id){
  for(const c of COLS)if(st.col[c].p.includes(id))return c;
  if(st.sin.includes(id))return 'sin';
  if(st.no.some(x=>x.id===id))return 'no';
  const t=Object.keys(st.drv).find(t=>st.drv[t]===id);
  return t?'truck:'+t:null;
}
function placeOfTruck(st,t){for(const c of CREWS)if(st.col[c].tr.includes(t))return c;return 'libres'}
function trucksOf(st,pid){return Object.keys(st.drv).filter(t=>st.drv[t]===pid)}
function placeLabel(st,id){
  const pl=placeOfPerson(st,id);if(!pl)return '';
  if(pl==='sin')return 'sin asignar';if(pl==='no')return 'no viene';
  if(pl.startsWith('truck:'))return 'en el '+TR[pl.slice(6)].corto;
  if(pl==='dep')return 'en el depósito';
  return (st.col[pl].lead===id?'a cargo de la ':'en la ')+COL[pl].n;
}
function timeText(st,t){const m=st.tm[t];if(!m)return '';return m.mode==='todo'?'Todo el día':'Lleva '+m.ll+' · Busca '+m.bu}

/* recorrido del camión: lista ordenada de paradas. Si no se tocó, sale del atajo (Todo el día / Lleva · Busca) */
function autoStops(st,t,f){
  const m=st.tm[t], c=placeOfTruck(st,t); if(!m||c==='libres')return [];
  const ref=obrasOf(c,f).length?c+':0':null, ll=t2m(m.ll), bu=t2m(m.bu);
  const out=[stp('dep',null,'lleva_gente',m.ll,null)];
  if(m.mode==='todo'){if(ref)out.push(stp('obra',ref,'espera',m2t(ll+30),'se queda con la cuadrilla'))}
  else if(ref){out.push(stp('obra',ref,'deja_material',m2t(ll+30),'baja la gente'));out.push(stp('obra',ref,'busca_gente',m.bu,null))}
  out.push(stp('dep',null,'descarga',m2t(bu+30),'vuelve con la gente'));
  return out;
}
const isCustom=(st,t)=>!!(st.rec&&st.rec[t]);
function getStops(st,t,f){return isCustom(st,t)?st.rec[t]:autoStops(st,t,f)}
function stopPlace(s,f){
  if(s.tipo==='dep')return {n:'Depósito',dir:COL.dep.obra,ll:COL.dep.ll,k:'--cd',tag:'D',sub:COL.dep.obra};
  if(s.tipo==='lug'){const L=LUG[s.ref]||{n:'Lugar',dir:'',ll:null};return {n:L.n,dir:L.dir,ll:L.ll,k:null,tag:null,sub:L.dir}}
  if(s.tipo==='obra'){const a=String(s.ref||'').split(':'), c=a[0], ob=obrasOf(c,f)[+a[1]||0], M=COL[c]||{n:'?',k:'--cd'};
    if(!ob)return {n:'Obra de la '+M.n,dir:'',ll:null,k:M.k,tag:M.n,sub:'sin obra ese día'};
    return {n:ob.dir,dir:ob.dir,ll:ob.ll,k:M.k,tag:M.n,sub:'la '+M.n+' · '+ob.tipo.toLowerCase()}}
  return {n:s.dir||'Otra dirección',dir:s.dir||'',ll:s.ll,k:null,tag:null,sub:'otra dirección'};
}
function recSum(stops){
  if(!stops.length)return '';
  const hs=stops.map(s=>t2m(s.hora)).filter(x=>x!=null);
  return stops.length+(stops.length===1?' parada':' paradas')+(hs.length?' · termina '+m2t(Math.max.apply(null,hs)):'');
}
function recText(stops,f){return stops.map(s=>(s.hora?s.hora+' ':'')+stopPlace(s,f).n+' ('+accN(s.accion).toLowerCase()+(s.nota?': '+s.nota:'')+')').join(' → ')}
/* cómo llega la cuadrilla a su obra i (la segunda, tercera…) */
function trasOf(c,i){
  const ob=obrasOf(c)[i]||{};
  const t=S.col[c].tr.find(t=>isCustom(S,t)?S.rec[t].some(s=>s.tipo==='obra'&&s.ref===c+':'+i):(S.tm[t]&&S.tm[t].mode==='todo'));
  if(t)return 'en el '+TR[t].corto;
  return ob.va==='camion'?'en su camión':'por su cuenta';
}

function estado(st,id){const m=st.man;if(!m)return null;if(m.falta[id])return 'no';return m.conf[id]?'ok':'pend'}
function reemplazo(st,c){return st.sin.find(x=>!(st.man&&st.man.falta[x]))||(c==='dep'?null:st.col.dep.p.find(x=>x!==st.col.dep.lead))}

/* ================= avisos ================= */
let FIX={};
function computeAvisos(st){
  const by={}; let total=0; FIX={};
  if(st.blank)return {by:by,total:0};
  const add=(place,a)=>{(by[place]=by[place]||[]).push(a);total++;FIX[a.id]=a.run};
  CREWS.forEach(c=>{
    const col=st.col[c], n=headcount(st,c), need=COL[c].need;
    if(n<need){
      const cand=st.sin.find(x=>true)||st.col.dep.p.find(x=>x!==st.col.dep.lead);
      add(c,{id:'f-'+c,icon:'tri',text:'Falta '+(need-n),
        btn:cand?'Usar a '+pn(cand):null,
        run:cand?()=>commit('La '+COL[c].n+' suma a '+pn(cand),x=>movePerson(x,cand,c,x.col[c].p.length),{key:'p:'+cand}):null});
    }
    if(col.p.length>0&&!col.lead){
      const cand=col.p[0];
      add(c,{id:'l-'+c,icon:'star',text:'Nadie a cargo',btn:'Poner a '+pn(cand),run:()=>commit(pn(cand)+' queda a cargo de la '+COL[c].n,x=>{x.col[c].lead=cand})});
    }
    col.tr.forEach(t=>{if(!st.drv[t])add(c,{id:'d-'+t,icon:'wheel',text:TR[t].corto+' sin chofer',btn:'Elegir',menu:t})});
  });
  if(st.man)COLS.forEach(c=>{const col=st.col[c];
    col.p.forEach(id=>{if(!st.man.falta[id])return;const cand=reemplazo(st,c);
      add(c,{id:'n-'+id,icon:'tri',text:pn(id)+' no vino (asistencia)',btn:cand?'Usar a '+pn(cand):'Sacarlo',run:()=>noVino(id,c,cand)})});
    const lead=col.lead;
    if(lead&&estado(st,lead)==='pend')add(c,{id:'c-'+lead,icon:'clock',text:pn(lead)+' no confirmó la hoja',btn:'Ya confirmó',
      run:()=>commit(pn(lead)+' confirmó por teléfono',x=>{x.man.conf[lead]=1},{noDirty:true,key:'p:'+lead})});
  });
  st.libres.forEach(t=>{if(!st.drv[t]&&st.ped.some(p=>p.by===t&&!p.ok))add('libres',{id:'d-'+t,icon:'wheel',text:TR[t].corto+' sin chofer',btn:'Elegir',menu:t})});
  const seen={};
  Object.keys(st.drv).forEach(t=>{const pid=st.drv[t];if(seen[pid]){
    const place=placeOfTruck(st,t);
    add(place,{id:'2-'+t,icon:'two',text:pn(pid)+' está en dos camiones',btn:'Sacarlo del '+TR[t].corto,
      run:()=>commit(pn(pid)+' sale del '+TR[t].corto,x=>{delete x.drv[t]})});
  } seen[pid]=1});
  return {by:by,total:total};
}

/* ================= cambios de estado ================= */
function removePerson(st,id){
  COLS.forEach(c=>{const col=st.col[c];const i=col.p.indexOf(id);if(i>-1){col.p.splice(i,1);if(col.lead===id)col.lead=null}});
  st.sin=st.sin.filter(x=>x!==id); st.no=st.no.filter(x=>x.id!==id);
}
function insertPerson(st,id,to,idx){
  if(to==='no'){st.no.splice(idx==null?st.no.length:idx,0,{id:id,m:'Avisó'});return}
  const arr=to==='sin'?st.sin:st.col[to].p;
  arr.splice(idx==null?arr.length:Math.min(idx,arr.length),0,id);
  if(to!=='sin'&&COLS.includes(to)&&!st.col[to].lead&&arr.length===1)st.col[to].lead=id;
}
function movePerson(st,id,to,idx,fromTruck){
  if(fromTruck)delete st.drv[fromTruck];
  removePerson(st,id);
  insertPerson(st,id,to,idx);
}
function setDriver(st,t,id,fromTruck){
  if(fromTruck){delete st.drv[fromTruck]}
  else removePerson(st,id);
  const prev=st.drv[t];
  st.drv[t]=id;
  if(prev&&prev!==id&&!trucksOf(st,prev).length&&!placeOfPerson(st,prev))st.sin.push(prev);
}
function moveTruck(st,t,to,idx){
  CREWS.forEach(c=>{st.col[c].tr=st.col[c].tr.filter(x=>x!==t)});
  st.libres=st.libres.filter(x=>x!==t);
  const arr=to==='libres'?st.libres:st.col[to].tr;
  arr.splice(idx==null?arr.length:Math.min(idx,arr.length),0,t);
  if(to==='libres')delete st.tm[t];
  else if(!st.tm[t])st.tm[t]={mode:'todo',ll:'7:00',bu:'17:00'};
}
function addCt(st,c,id,d){
  st.contr=st.contr||{}; const m=st.contr[c]=st.contr[c]||{};
  m[id]=Math.max(0,(m[id]||0)+d);
  if(!m[id])delete m[id];
  if(!Object.keys(m).length)delete st.contr[c];
}
function copyFromPrev(x){
  const i=diaIdx(CUR); if(i<1)return;
  const p=JSON.parse(JSON.stringify(DAYS[DIAS[i-1].f]));
  ['col','contr','sin','no','libres','tm','drv','rec'].forEach(k=>{x[k]=p[k]||(k==='contr'||k==='rec'?{}:x[k])});
  x.no=x.no.filter(n=>n.m!=='No vino'); /* lo de la asistencia de un día no pasa al otro */
}
/* alguien no vino: sale de su lugar a "No vienen" y, si hay, entra el reemplazo en su lugar */
function noVino(id,c,cand){
  commit(cand?pn(id)+' no vino · entra '+pn(cand):pn(id)+' no vino',x=>{
    const idx=x.col[c].p.indexOf(id);
    if(x.man){x.man.falta[id]=x.man.falta[id]||m2t(nowMin());x.man.de=x.man.de||{};x.man.de[id]=c}
    removePerson(x,id); x.no.push({id:id,m:'No vino'});
    if(cand)movePerson(x,cand,c,idx<0?null:idx);
  },{key:'p:'+(cand||id)});
}

/* ================= historial (por día) ================= */
function commit(msg,fn,opt){
  opt=opt||{};
  const h=H(); h.push(JSON.stringify(S)); if(h.length>60)h.shift();
  const rk=UI.rep&&S.rep?repCards()[S.rep.i]:null;
  const r0=rk?repBefore(S):null;
  fn(S); syncPeds(S,CUR); S.blank=false; if(S.sent&&!opt.noDirty)S.dirty=true;
  const re=rk&&msg?repAfter(S,rk,r0,msg):[];
  if(!opt.keepSel)UI.sel=null;
  save();
  render(opt);
  if(msg)toast(msg+(re.length?' · '+re[0]:''),true);
}
/* repaso: qué tarjetas tocó un cambio. A cada una le queda anotado (para el resumen y "Mandar cambios");
   si ya estaba repasada y quedó peor (falta gente, sin a cargo, camión sin chofer) vuelve a "para revisar". */
function repSnap(st){
  const o={};
  CREWS.forEach(c=>{const col=st.col[c];o[c]=JSON.stringify([col.p,col.lead,col.tr,ctOf(st,c),col.tr.map(t=>st.drv[t]||null)])});
  o.dep=JSON.stringify([st.col.dep.p,st.col.dep.lead]);
  o.cam=JSON.stringify(TRUCKS.map(t=>[st.drv[t]||null,placeOfTruck(st,t)]));
  return o;
}
function repHealth(st,k){
  if(k==='cam')return TRUCKS.filter(t=>placeOfTruck(st,t)!=='libres'&&!st.drv[t]);
  if(k==='dep')return {lead:!!st.col.dep.lead};
  const col=st.col[k];return {n:headcount(st,k),lead:!!col.lead||!col.p.length,sinCh:col.tr.filter(t=>!st.drv[t])};
}
function repWorse(k,a,b){
  if(k==='cam'){const nw=b.filter(t=>!a.includes(t));return nw.length?'El '+TR[nw[0]].corto+' quedó sin chofer: revisá Camiones':null}
  if(k==='dep')return a.lead&&!b.lead?'El depósito quedó sin a cargo: revisalo':null;
  const N=COL[k].n, need=COL[k].need;
  if(b.n<a.n&&b.n<need)return 'La '+N+' quedó con '+b.n+' de '+need+': revisala';
  if(a.lead&&!b.lead)return 'La '+N+' quedó sin a cargo: revisala';
  const nw=b.sinCh.filter(t=>!a.sinCh.includes(t));
  return nw.length?'El '+TR[nw[0]].corto+' de la '+N+' quedó sin chofer: revisala':null;
}
const truckSig=(st,t)=>JSON.stringify([st.drv[t]||null,placeOfTruck(st,t),st.tm[t]||null,(st.rec||{})[t]||null]);
function repBefore(st){const cards=repCards(),h={},sig={};cards.forEach(j=>{h[j]=repHealth(st,j)});TRUCKS.forEach(t=>{sig[t]=truckSig(st,t)});return {cards:cards,snap:repSnap(st),h:h,sig:sig}}
function repAfter(st,rk,r0,msg){
  const R=st.rep, s1=repSnap(st), out=[];
  (R.log[rk]=R.log[rk]||[]).push(msg);
  R.aff=R.aff||{}; R.re=R.re||{};
  TRUCKS.forEach(t=>{if(st.drv[t]&&truckSig(st,t)!==r0.sig[t])R.aff['d:'+st.drv[t]]=1});
  r0.cards.forEach(j=>{
    if(j===rk||r0.snap[j]===s1[j])return;
    (R.log[j]=R.log[j]||[]).push(msg);
    if(!R.st[j])return;
    const why=repWorse(j,r0.h[j],repHealth(st,j));
    if(why){delete R.st[j];R.re[j]=why;out.push(why)}
  });
  return out;
}
function undo(){
  const h=H(); if(!h.length)return;
  const keepI=UI.rep&&S.rep?S.rep.i:null;
  S=DAYS[CUR]=JSON.parse(h.pop()); UI.sel=null; UI.picker=null; closePop();
  if(keepI!=null&&S.rep)S.rep.i=keepI;
  save(); render({}); toast('Deshecho',false);
}
function goDay(f){
  if(f===CUR||diaIdx(f)<0)return;
  const dir=diaIdx(f)>diaIdx(CUR)?1:-1;
  CUR=f; S=DAYS[CUR]; UI.sel=null; UI.picker=null; closePop(); $('#toast').hidden=true;
  save(); render({noFlip:true});
  if(!RM.matches)['#board','#side'].forEach(s=>$(s).animate([{opacity:0,transform:'translateX('+(dir*18)+'px)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'}));
}

/* ================= render ================= */
const $=s=>document.querySelector(s);
function render(opt){
  opt=opt||{};
  const before=RM.matches||opt.noFlip?null:rects();
  const av=computeAvisos(S);
  drawTop(av); drawBoard(av); drawSide(); drawFoot();
  drawHint();
  if(UI.rep)drawRep();
  if(UI.recT&&!opt.keepRec)drawRec();
  document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px');
  if(before)playFlip(before,opt.skip);
  if(opt.key&&opt.from)landing(opt.key,opt.from); else if(opt.key)bounce(opt.key);
}
const scopeEl=()=>UI.rep?$('#rep'):document;
function rects(){const m=new Map();scopeEl().querySelectorAll('[data-k]').forEach(el=>m.set(el.dataset.k,el.getBoundingClientRect()));return m}
function playFlip(before,skip){
  scopeEl().querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k; if(k===skip)return;
    const r0=before.get(k); const r1=el.getBoundingClientRect();
    if(!r0){ if(r1.width)el.animate([{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:180,easing:'ease-out'});return}
    const dx=r0.left-r1.left, dy=r0.top-r1.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function landing(key,from){
  const el=scopeEl().querySelector('[data-k="'+key+'"]'); if(!el)return;
  if(RM.matches)return;
  const r=el.getBoundingClientRect();
  const dx=from.left-r.left, dy=from.top-r.top;
  el.animate([{transform:'translate('+dx+'px,'+dy+'px) scale(1.05) rotate(-1.5deg)',boxShadow:'var(--lift)'},
              {transform:'translate(0,0) scale(.96)',offset:.72},
              {transform:'scale(1.015)',offset:.88},{transform:'none'}],{duration:340,easing:'cubic-bezier(.3,.7,.3,1)'});
}
function bounce(key){
  const el=scopeEl().querySelector('[data-k="'+key+'"]'); if(!el||RM.matches)return;
  el.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(.98)'},{transform:'none'}],{duration:320,easing:'ease-out'});
}

function selTargets(){

/* ================= aplicar destino (arrastre o toque) ================= */
function applyDrop(src,dst,from){
  const [k,id]=src.split(':');
  const opt={key:null,from:from,skip:null};
  if(k==='p'||k==='d'){
    const pid=k==='p'?id:S.drv[id], fromT=k==='d'?id:null;
    opt.key='p:'+pid; opt.skip=opt.key;
    if(dst.kind==='driver'){
      if(!canDrive(pid)){nope(dst.truck,pn(pid)+' no maneja');return false}
      if(dst.truck===fromT)return false;
      commit(pn(pid)+' maneja el '+TR[dst.truck].corto,x=>setDriver(x,dst.truck,pid,fromT),opt);return true;
    }
    if(dst.kind==='list'){
      if(k==='p'&&dst.idx==null&&placeOfPerson(S,pid)===dst.zone)return false;
      const where=dst.zone==='sin'?'queda sin asignar':dst.zone==='no'?'no viene':dst.zone==='dep'?'va al depósito':'va a la '+COL[dst.zone].n;
      commit(pn(pid)+' '+where,x=>movePerson(x,pid,dst.zone,dst.idx,fromT),opt);return true;
    }
  }
  if(k==='t'&&dst.kind==='list'){
    opt.key='t:'+id; opt.skip=opt.key;
    if(dst.idx==null&&placeOfTruck(S,id)===dst.zone)return false;
    const wasLibre=placeOfTruck(S,id)==='libres';
    commit(dst.zone==='libres'?'El '+TR[id].corto+' queda libre':'El '+TR[id].corto+' va con la '+COL[dst.zone].n,x=>{
      moveTruck(x,id,dst.zone,dst.idx);
      UI.picker=(dst.zone!=='libres'&&wasLibre)?id:(UI.picker===id&&dst.zone==='libres'?null:UI.picker);
    },opt);return true;
  }
  if(k==='q'&&dst.kind==='driver'){
    return setBy(id,dst.truck);
  }
  if(k==='k'&&(dst.kind==='col'||dst.kind==='list')&&CREWS.includes(dst.zone)){
    commit('+1 de '+ctName(id)+' a la '+COL[dst.zone].n,x=>addCt(x,dst.zone,id,1),{key:'k:'+dst.zone+':'+id});return true;
  }
  return false;
}

  const el=D.src, r=el.getBoundingClientRect();
  D.active=true; D.rect=r; D.offX=D.x0-r.left; D.offY=D.y0-r.top;

  const cl=el.cloneNode(true); cl.removeAttribute('data-k'); cl.querySelectorAll('[data-k]').forEach(n=>n.removeAttribute('data-k'));

  g.style.transform='translate3d('+r.left+'px,'+r.top+'px,0)';

  else{

  }

  if(UI.rep){const d0=D, loop=()=>{ /* repaso: cerca del borde de la tarjeta, se desplaza sola */

function flipAround(fn){
  if(RM.matches){fn();return}
  const els=[...document.querySelectorAll('.list>.chip:not(.origin),.list>.ph,.list .drv')];
  const r0=els.map(el=>el.getBoundingClientRect());
  fn();
  els.forEach((el,i)=>{const r1=el.getBoundingClientRect();const dx=r0[i].left-r1.left,dy=r0[i].top-r1.top;
    if((Math.abs(dx)>1||Math.abs(dy)>1)&&r1.width)el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'})});
}
function resolveAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el)return null;
  const k=D.kind;
  if(D.fromStrip&&el.closest('.rp-strip'))return null;
  if(k==='p'||k==='d'){
    const tEl=el.closest('[data-truck]');
    if(tEl&&k==='d'&&tEl.dataset.truck===D.key.slice(2))return null;
    if(tEl&&!(k==='d'&&tEl.dataset.truck===D.key.slice(2)))return {kind:'driver',truck:tEl.dataset.truck,el:tEl};
    let z=el.closest('[data-zone^="p:"]');
    if(!z){const c=el.closest('[data-col]');if(c&&c.dataset.col!=='libres')z=c.querySelector('[data-zone^="p:"]')}
    if(z)return {kind:'list',zone:z.dataset.zone.slice(2),zoneEl:z};
    return null;
  }
  if(k==='t'){
    let z=el.closest('[data-zone^="t:"]');
    if(!z){const c=el.closest('[data-col]');if(c){z=c.querySelector('[data-zone^="t:"]');if(!z&&c.dataset.col==='dep')z=document.querySelector('[data-zone="t:libres"]')}}
    if(z)return {kind:'list',zone:z.dataset.zone.slice(2),zoneEl:z};
    return null;
  }
  if(k==='q'){const tEl=el.closest('[data-truck]');if(tEl)return {kind:'driver',truck:tEl.dataset.truck,el:tEl};return null}
  if(k==='k'){const c=el.closest('[data-col]');if(c&&CREWS.includes(c.dataset.col))return {kind:'col',zone:c.dataset.col,el:c};return null}
  return null;
}
function idxIn(z,x,y){
  const kids=[...z.children].filter(c=>c.classList.contains('chip')&&!c.classList.contains('origin'));
  const w=z.dataset.dir==='w';
  for(let i=0;i<kids.length;i++){const r=kids[i].getBoundingClientRect();
    if(w){if(y<r.top||(y<=r.bottom&&x<r.left+r.width/2))return i}
    else if(y<r.top+r.height/2)return i}
  return kids.length;
}
function moveDrag(){
  D.ghost.style.transform='translate3d('+(D.x-D.offX)+'px,'+(D.y-D.offY)+'px,0)';
  const res=resolveAt(D.x,D.y);
  document.querySelectorAll('.drop-on').forEach(el=>{if(!res||res.el!==el)el.classList.remove('drop-on')});
  document.querySelectorAll('.zone-hot').forEach(el=>el.classList.remove('zone-hot'));
  D.res=res;
  if(res&&res.kind==='col'){res.el.classList.add('zone-hot');return}
  if(res&&res.kind==='driver'){
    res.el.classList.add('drop-on');
    if(D.ph&&D.ph.parentElement){flipAround(()=>{const pz=D.ph.parentElement;D.ph.remove();pz.classList.remove('has-ph')});D.phZone='__none';D.phIdx=null}
    return;
  }
  if(res&&res.kind==='list'&&D.ph){
    const col=res.zoneEl.closest('.col,.box'); if(col)col.classList.add('zone-hot');
    const idx=idxIn(res.zoneEl,D.x,D.y);
    if(D.phZone!==res.zone||D.phIdx!==idx){
      D.phZone=res.zone;D.phIdx=idx;
      flipAround(()=>{
        const old=D.ph.parentElement; if(old)old.classList.remove('has-ph');
        const kids=[...res.zoneEl.children].filter(c=>c.classList.contains('chip')&&!c.classList.contains('origin'));
        const w=res.zoneEl.dataset.dir==='w';
        D.ph.style.width=w?D.rect.width+'px':'auto';
        if(kids[idx])res.zoneEl.insertBefore(D.ph,kids[idx]);
        else{const emp=res.zoneEl.querySelector('.empty');res.zoneEl.insertBefore(D.ph,emp||null)}
        res.zoneEl.classList.add('has-ph');
      });
    }
  }
  else if(res&&res.kind==='list'){(res.zoneEl.closest('.rc-s,.rp-strip')||res.zoneEl).classList.add('zone-hot')}
}
function endDrag(ok){
  const d=D; D=null;
  document.body.classList.remove('dragging');
  const gr=d.ghost.getBoundingClientRect();
  const from={left:gr.left,top:gr.top};
  let done=false;
  if(ok&&d.res){
    const dst=d.res.kind==='list'?{kind:'list',zone:d.res.zone,idx:d.phIdx}:d.res.kind==='col'?{kind:'col',zone:d.res.zone}:{kind:'driver',truck:d.res.truck};
    done=applyDrop(d.key,dst,from);
  }
  window.__justDragged=Date.now();
  if(done){d.ghost.remove();return}
  // vuelve a su lugar
  const back=()=>{d.ghost.remove();render({})};
  if(RM.matches){back();return}
  const r=d.rect;
  const a=d.ghost.animate([{transform:d.ghost.style.transform},{transform:'translate3d('+r.left+'px,'+r.top+'px,0)'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});
  d.ghost.classList.remove('up');
  a.onfinish=back;
}

/* ===== pedidos en el recorrido: un pedido con camión es una parada más (parada.ped = id del pedido) ===== */
function pedStop(p){
  const q=norm(p.que), nota=p.que;
  const acc=/ (retirar|retira|traer|trae|buscar|busca) /.test(q)?'carga':/ (compra|comprar) /.test(q)?'compra':'deja_material';
  let s;
  if(q.includes(' sanz '))s=stp('lug','sanz','compra',null,nota);
  else if(p.dest==='dir')s=stp('dir',null,acc,null,nota,p.dir,p.ll);
  else if(p.dest==='dep')s=stp('dep',null,'descarga',null,nota);
  else s=stp('obra',p.dest+':0',acc,null,nota);
  s.ped=p.id; s.ok=!!p.ok; return s;
}
/* distancia en línea recta (km) entre dos [lat,lng]; el desvío se cuenta a 3 min por km extra, redondeado a 5 */
function km(a,b){const dy=(a[0]-b[0])*111.2, dx=(a[1]-b[1])*111.2*Math.cos(a[0]*Math.PI/180);return Math.hypot(dx,dy)}
function desvMin(k){return Math.round(k*3/5)*5}
function desvTxt(m){return m?'+'+m+' min':'sin desvío'}
function distTxt(k){if(k<1){const c=Math.max(1,Math.round(k*10));return c+(c===1?' cuadra':' cuadras')}return (k<10?k.toFixed(1):String(Math.round(k))).replace('.',',')+' km'}
function stopLL(s,f){return stopPlace(s,f).ll||COL.dep.ll}
/* mejor hueco para sumar un lugar: el que menos alarga el recorrido. Hoy, nunca antes de la parada en curso
   (la última con hora ya pasada o hecha). No va después de la vuelta al depósito salvo que ya haya vuelto. */
function bestSlot(arr,ll,f,anyPos){
  const n=arr.length, D0=COL.dep.ll;
  let lo=n&&arr[0].tipo==='dep'?1:0, hi=n>1&&arr[n-1].tipo==='dep'?n-1:n;
  if(f===HOY&&!anyPos){let cur=-1;arr.forEach((s,i)=>{const h=t2m(s.hora);if(s.ok||(h!=null&&h<=nowMin()))cur=i});lo=Math.max(lo,cur+1)}
  if(lo>hi)hi=n; lo=Math.min(lo,n);
  let best=null;
  for(let j=lo;j<=hi;j++){const a=j>0?stopLL(arr[j-1],f):D0, b=j<n?stopLL(arr[j],f):D0, add=km(a,ll)+km(ll,b)-km(a,b);
    if(!best||add<best.add-1e-9)best={j:j,add:Math.max(0,add)}}
  return best;
}
/* recorrido del camión con el pedido sumado (no toca el estado). Si no tenía recorrido propio, parte del atajo */
function planPed(x,t,p,f,anyPos){
  let arr=getStops(x,t,f).map(s=>Object.assign({},s));
  if(!arr.length)arr=[stp('dep',null,'carga',null,null),stp('dep',null,'descarga',null,'vuelve')];
  const s=pedStop(p), ll=stopLL(s,f), b=bestSlot(arr,ll,f,anyPos), A=arr[b.j-1]||null, B=arr[b.j]||null;
  if(A&&B&&A.hora&&B.hora)s.hora=m2t(Math.round((t2m(A.hora)+t2m(B.hora))/10)*5);
  arr.splice(b.j,0,s);
  let via=null, d=Infinity; /* por dónde pasa: la vecina más cerca, mejor una obra o lugar que el depósito */
  [A,B].filter(z=>z&&z.tipo!=='dep').concat([A,B].filter(z=>z&&z.tipo==='dep')).forEach(z=>{if(via&&via.tipo!=='dep'&&z.tipo==='dep')return;const k=km(stopLL(z,f),ll);if(k<d){d=k;via=z}});
  return {arr:arr,n:b.j+1,add:b.add,min:desvMin(b.add),A:A,B:B,via:via,d:d};
}
/* deja todo coherente después de cada cambio: saca paradas de pedidos que ya no lleva ese camión, copia el "hecho"
   y suma la parada de cada pedido con camión que todavía no la tenga */
function tidyRec(x,t,f){
  const arr=x.rec[t]; if(!arr||arr.some(s=>s.ped))return;
  const libre=placeOfTruck(x,t)==='libres';
  if(libre?arr.every(s=>s.tipo==='dep'):JSON.stringify(arr)===JSON.stringify(autoStops(x,t,f)))delete x.rec[t];
}
function syncPeds(x,f){
  x.rec=x.rec||{};
  Object.keys(x.rec).forEach(t=>{const arr=x.rec[t]; let cut=false;
    for(let i=arr.length-1;i>=0;i--){const s=arr[i]; if(!s.ped)continue;
      const p=x.ped.find(q=>q.id===s.ped);
      if(!p||p.by!==t){arr.splice(i,1);cut=true}else s.ok=!!p.ok}
    if(cut)tidyRec(x,t,f);
  });
  x.ped.forEach(p=>{const t=p.by; if(!TR[t]||getStops(x,t,f).some(s=>s.ped===p.id))return;
    x.rec[t]=planPed(x,t,p,f,p.ok).arr});
}

function viaTxt(pl,f){
  const nm=s=>stopPlace(s,f).n, A=pl.A, B=pl.B;
  if(A&&B)return nm(A)===nm(B)?(A.tipo==='dep'?'sale del depósito y vuelve':'en '+nm(A)):'de paso entre '+nm(A)+' y '+nm(B);
  return A?'después de '+nm(A):B?'antes de '+nm(B):'';
}
/* asignar (o sacar) el camión de un pedido. Con camión: se suma como parada en el hueco de menor desvío */
function setBy(qid,v,opt){
  const p=S.ped.find(x=>x.id===qid); if(!p)return false;
  if((p.by||null)===v){if(TR[v])toast('“'+p.que+'” ya lo lleva el '+TR[v].corto,false);return false}
  if(TR[v]){const pl=planPed(S,v,p,CUR,p.ok);
    commit('“'+p.que+'” → parada '+pl.n+' del '+TR[v].corto+' · '+viaTxt(pl,CUR)+' ('+desvTxt(pl.min)+')',
      x=>{x.ped.find(y=>y.id===qid).by=v;x.rec=x.rec||{};x.rec[v]=pl.arr},Object.assign({key:'t:'+v},opt||{}));return true}
  const old=TR[p.by]?p.by:null;
  commit('“'+p.que+'” '+(v==='crew'?'lo lleva la cuadrilla':'sin camión')+(old?' · sale del recorrido del '+TR[old].corto:''),
    x=>{x.ped.find(y=>y.id===qid).by=v},{key:'q:'+qid});
  return true;
}
/* ¿quién pasa cerca? camiones del día por desvío; los que no tienen recorrido (libres) al final */
function nearList(p){
  const ll=stopLL(pedStop(p),CUR);

    if(!n){const k=2*km(COL.dep.ll,ll);return {t:t,free:true,add:k,min:desvMin(k)}}
    return Object.assign({t:t,free:false,n:n},planPed(S,t,p,CUR,p.ok));

}

/* reordenar paradas arrastrando (pointer events) */
let SD=null;
function sdStart(e,g){
  e.preventDefault(); closePop();
  const li=g.closest('.stop'), list=li.parentElement, r=li.getBoundingClientRect();
  SD={li:li,list:list,pid:e.pointerId,off:e.clientY-r.top,moved:false};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  li.classList.add('lift');
  if(!RM.matches)li.animate([{transform:'scale(1)'},{transform:'scale(1.02)'}],{duration:120,fill:'forwards'});
}
function sdMove(e){
  const li=SD.li, list=SD.list, lt=list.getBoundingClientRect().top;
  const others=[...list.children].filter(x=>x!==li);
  let idx=others.length;
  for(let k=0;k<others.length;k++){const x=others[k];if(e.clientY<lt+x.offsetTop+x.offsetHeight/2){idx=k;break}}
  if([...list.children].indexOf(li)!==idx){
    const r0=others.map(x=>x.offsetTop);
    list.insertBefore(li,others[idx]||null);
    SD.moved=true;
    if(!RM.matches)others.forEach((x,k)=>{const d=r0[k]-x.offsetTop;if(d)x.animate([{transform:'translateY('+d+'px)'},{transform:'none'}],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'})});
  }
  li.style.transform='translateY('+((e.clientY-SD.off)-(lt+li.offsetTop))+'px) scale(1.02)';
}
function sdEnd(ok){
  const d=SD; SD=null; if(!d)return;
  const li=d.li, from=li.getBoundingClientRect().top;
  li.getAnimations().forEach(a=>a.cancel());
  const order=[...d.list.children].map(x=>+x.dataset.i);
  const changed=ok&&order.some((v,k)=>v!==k);
  if(!changed){li.style.transform='';li.classList.remove('lift');drawRec();return}
  const newIdx=order.indexOf(+li.dataset.i);
  recEdit('Recorrido reordenado',a=>{const c=a.slice();a.length=0;order.forEach(i=>a.push(c[i]))});
  const nl=document.querySelector('#stops .stop[data-i="'+newIdx+'"]');
  if(nl&&!RM.matches){const dy=from-nl.getBoundingClientRect().top;
    nl.animate([{transform:'translateY('+dy+'px) scale(1.02)',boxShadow:'var(--lift)'},{transform:'scale(.99)',offset:.75},{transform:'none'}],{duration:260,easing:'cubic-bezier(.3,.7,.3,1)'})}
}
