<title>Modelador ABA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: herramienta de escritorio a pantalla completa. Barra superior, tres columnas
   (obra+plantillas | 3D sobre alzado | propiedades sobre lista en vivo) y barra de totales.
   Dark-first con los tokens de Andamios OS (coral ABA, DM Sans, JetBrains Mono). */
:root {
  color-scheme: dark;
  --bg: oklch(0.13 0 0);
  --panel: oklch(0.165 0 0);
  --card: oklch(0.2 0 0);
  --elev: oklch(0.24 0 0);
  --hover: oklch(0.27 0 0);
  --line: oklch(1 0 0 / 10%);
  --line-2: oklch(1 0 0 / 16%);
  --fg: oklch(0.93 0 0);
  --fg-2: oklch(0.72 0 0);
  --fg-3: oklch(0.64 0 0);
  --primary: oklch(0.62 0.16 42);
  --primary-strong: oklch(0.55 0.16 42);
  --primary-hi: oklch(0.7 0.15 42);
  --primary-fg: oklch(1 0 0);
  --primary-soft: oklch(0.62 0.16 42 / 18%);
  --ok: oklch(0.72 0.15 158);
  --ok-soft: oklch(0.72 0.15 158 / 16%);
  --warn: oklch(0.8 0.14 78);
  --warn-soft: oklch(0.8 0.14 78 / 16%);
  --err: oklch(0.7 0.19 22);
  --err-soft: oklch(0.7 0.19 22 / 16%);
  --info: oklch(0.72 0.1 245);
  --info-soft: oklch(0.72 0.1 245 / 16%);
  --mensula: #b383db;
  --viewport: #18191b;
  --scrim: oklch(0 0 0 / 55%);
  --shadow: 0 10px 30px oklch(0 0 0 / 45%);
  --font-sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
  --r-sm: 5px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: oklch(0.965 0 0);
    --panel: oklch(0.985 0 0);
    --card: oklch(1 0 0);
    --elev: oklch(0.955 0 0);
    --hover: oklch(0.93 0 0);
    --line: oklch(0 0 0 / 10%);
    --line-2: oklch(0 0 0 / 16%);
    --fg: oklch(0.18 0 0);
    --fg-2: oklch(0.42 0 0);
    --fg-3: oklch(0.5 0 0);
    --primary: oklch(0.6 0.17 40);
    --primary-strong: oklch(0.55 0.16 42);
    --primary-hi: oklch(0.54 0.17 40);
    --primary-soft: oklch(0.62 0.16 42 / 14%);
    --ok: oklch(0.55 0.14 158);
    --ok-soft: oklch(0.55 0.14 158 / 13%);
    --warn: oklch(0.5 0.12 70);
    --warn-soft: oklch(0.75 0.14 78 / 22%);
    --err: oklch(0.56 0.21 25);
    --err-soft: oklch(0.56 0.21 25 / 12%);
    --info: oklch(0.52 0.13 250);
    --info-soft: oklch(0.52 0.13 250 / 12%);
    --mensula: #8a4cc0;
    --viewport: #eceef1;
    --scrim: oklch(0.2 0 0 / 35%);
    --shadow: 0 10px 30px oklch(0 0 0 / 14%);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: oklch(0.965 0 0);
  --panel: oklch(0.985 0 0);
  --card: oklch(1 0 0);
  --elev: oklch(0.955 0 0);
  --hover: oklch(0.93 0 0);
  --line: oklch(0 0 0 / 10%);
  --line-2: oklch(0 0 0 / 16%);
  --fg: oklch(0.18 0 0);
  --fg-2: oklch(0.42 0 0);
  --fg-3: oklch(0.5 0 0);
  --primary: oklch(0.6 0.17 40);
  --primary-strong: oklch(0.55 0.16 42);
  --primary-hi: oklch(0.54 0.17 40);
  --primary-soft: oklch(0.62 0.16 42 / 14%);
  --ok: oklch(0.55 0.14 158);
  --ok-soft: oklch(0.55 0.14 158 / 13%);
  --warn: oklch(0.5 0.12 70);
  --warn-soft: oklch(0.75 0.14 78 / 22%);
  --err: oklch(0.56 0.21 25);
  --err-soft: oklch(0.56 0.21 25 / 12%);
  --info: oklch(0.52 0.13 250);
  --info-soft: oklch(0.52 0.13 250 / 12%);
  --mensula: #8a4cc0;
  --viewport: #eceef1;
  --scrim: oklch(0.2 0 0 / 35%);
  --shadow: 0 10px 30px oklch(0 0 0 / 14%);
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.4 var(--font-sans); -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.mono, kbd, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
kbd {
  font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2);
  background: var(--elev); color: var(--fg-2); white-space: nowrap;
}
.muted { color: var(--fg-2); }
.dim { color: var(--fg-3); }

#app { height: 100%; display: grid; grid-template-rows: 48px minmax(0, 1fr) 34px; }

/* ── barra superior ── */
.top {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.brand svg { color: var(--primary); }
.brand .tag { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); border: 1px solid var(--line-2); padding: 1px 6px; border-radius: 99px; }
.sep { width: 1px; height: 22px; background: var(--line); flex: none; }
.obra { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
.obra-txt { min-width: 0; }
.obra-nombre { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.obra-sub { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-est { font: 500 10.5px var(--font-mono); color: var(--warn); background: var(--warn-soft); padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.buscar {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; min-width: 220px;
  border: 1px solid var(--line-2); border-radius: var(--r); background: var(--card); color: var(--fg-3);
}
.buscar:hover { color: var(--fg-2); border-color: var(--fg-3); }
.btn {
  height: 30px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--card);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 500;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--primary-strong); border-color: transparent; color: var(--primary-fg); font-weight: 600; letter-spacing: .01em; }
.btn.pri:hover { background: var(--primary); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--hover); color: var(--fg); }
.btn.icono { width: 30px; padding: 0; justify-content: center; }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; border-radius: var(--r-sm); }
.btn.xs { height: 20px; padding: 0 6px; font-size: 11px; border-radius: 4px; }
.btn.err { color: var(--err); }
.undo { display: flex; gap: 2px; }

/* ── cuerpo ── */
.cuerpo { display: grid; grid-template-columns: 252px minmax(0, 1fr) 372px; min-height: 0; }
.izq, .der { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
.izq { border-right: 1px solid var(--line); }
.der { border-left: 1px solid var(--line); }
.sec-h {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px 6px; font: 600 10.5px var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3);
}
.scroll { overflow: auto; min-height: 0; }
.arbol-sec { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; }
.galeria-sec { flex: none; border-top: 1px solid var(--line); max-height: 52%; display: flex; flex-direction: column; }

.arbol { padding: 0 6px 8px; }
.nodo {
  display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: var(--r-sm);
  cursor: pointer; min-width: 0; border: 1px solid transparent;
}
.nodo:hover { background: var(--hover); }
.nodo.sel { background: var(--primary-soft); border-color: oklch(0.62 0.16 42 / 35%); }
.nodo .nom { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nodo .nom2 { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
.nodo .nom2 .meta { font-size: 10.5px; }
.nodo .meta { font: 11px var(--font-mono); color: var(--fg-3); white-space: nowrap; }
.nodo.hijo { padding-left: 26px; font-size: 12.5px; color: var(--fg-2); }
.nodo.hijo.sel { color: var(--fg); }
.caret { width: 12px; color: var(--fg-3); flex: none; text-align: center; font-size: 10px; }
.punto { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.punto.ov { background: var(--primary); }
.punto.err { background: var(--err); }
.punto.av { background: var(--warn); }
.tipo-ic { width: 18px; height: 18px; flex: none; color: var(--fg-2); }
.union {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; padding: 6px 8px; margin: 2px 0;
  border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line); font-size: 12px;
}
.union .et { min-width: 0; overflow-wrap: anywhere; }
.union .sub { grid-column: 1 / -1; color: var(--fg-3); font-size: 11px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.union.nueva { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.sub-h { padding: 10px 6px 4px; font: 600 10px var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); }

.galeria { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
.pl {
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left;
  padding: 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); min-width: 0;
}
.pl:hover { border-color: var(--primary); background: var(--elev); }
.pl.activa { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.pl svg { width: 44px; height: 28px; color: var(--fg-2); }
.pl:hover svg { color: var(--primary); }
.pl .n { font-weight: 600; font-size: 12px; line-height: 1.2; }
.pl .k { font-size: 10.5px; color: var(--fg-3); display: flex; gap: 4px; align-items: center; }
.pl .nuevo { color: var(--primary); font: 600 9.5px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; }

/* ── centro ── */
.centro { display: grid; grid-template-rows: minmax(0, 1fr) clamp(300px, 42vh, 460px); min-width: 0; min-height: 0; }
.centro.alzado-grande { grid-template-rows: 220px minmax(0, 1fr); }
.vista3d { position: relative; min-height: 0; background: var(--viewport); overflow: hidden; }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.ov-chip {
  position: absolute; transform: translate(-50%, -50%); pointer-events: auto; white-space: nowrap;
  font: 500 11px var(--font-sans); padding: 3px 8px; border-radius: 99px;
  background: var(--card); border: 1px solid var(--line-2); color: var(--fg); box-shadow: var(--shadow);
  display: flex; gap: 6px; align-items: center;
}
.ov-chip:hover { border-color: var(--primary); }
.ov-chip .sw { color: var(--primary); font-weight: 700; }
.ov-label {
  position: absolute; transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap;
  font: 600 12px var(--font-mono); padding: 5px 9px; border-radius: 6px;
  background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow);
}
.ov-label.menos { background: var(--err); }
.ov-label small { display: block; font: 500 10.5px var(--font-sans); opacity: .9; }
.ov-label .cursor { display: inline-block; width: 1px; height: 12px; background: currentColor; margin-left: 2px; vertical-align: -1px; animation: parpadeo 1s steps(1) infinite; }
@keyframes parpadeo { 50% { opacity: 0; } }
.vistas {
  position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
.cubo { display: flex; background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.cubo button { border: 0; background: transparent; padding: 5px 9px; font-size: 12px; color: var(--fg-2); display: flex; gap: 5px; align-items: center; }
.cubo button + button { border-left: 1px solid var(--line); }
.cubo button:hover { background: var(--hover); color: var(--fg); }
.cubo button.on { color: var(--primary); background: var(--primary-soft); }
.cubo kbd { font-size: 9.5px; padding: 0 4px; }
.leyenda {
  position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 20px);
  font-size: 11px; color: var(--fg-2); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 9px;
}
.leyenda span { display: inline-flex; align-items: center; gap: 5px; }
.leyenda i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(680px, calc(100% - 24px));
  background: var(--card); border: 1px solid var(--primary); color: var(--fg); padding: 6px 12px; border-radius: 12px;
  font-size: 12px; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; justify-content: center; text-align: center;
}
.vista3d.colocando .leyenda { display: none; }
.hint b { color: var(--primary); }
.titulo3d { position: absolute; top: 10px; left: 12px; font-size: 11px; color: var(--fg-3); display: flex; gap: 8px; align-items: center; }
.titulo3d b { color: var(--fg-2); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; }
.ficha {
  position: fixed; z-index: 30; pointer-events: none; min-width: 190px; max-width: 280px;
  background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px;
}
.ficha .c { font: 600 12.5px var(--font-mono); }
.ficha .d { color: var(--fg-2); font-size: 11.5px; margin-bottom: 6px; }
.ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.ficha dt { color: var(--fg-3); }
.ficha dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

/* alzado */
.alzado-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr); border-top: 1px solid var(--line); background: var(--panel); min-height: 0; }
.alzado-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-width: 0; }
.alzado-bar .t { font: 600 10.5px var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 3px 8px; font-size: 12px; color: var(--fg-2); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--hover); color: var(--fg); }
.seg button:disabled { opacity: .45; cursor: default; background: transparent; color: var(--fg-3); }
.seg button.on { background: var(--primary-soft); color: var(--fg); box-shadow: inset 0 -2px 0 var(--primary); }
.seg kbd { font-size: 9.5px; padding: 0 4px; }
.alzado-bar .info { margin-left: auto; color: var(--fg-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.alzado { position: relative; min-height: 0; overflow: hidden; }
.alzado svg { width: 100%; height: 100%; display: block; user-select: none; }
.alzado .vacio { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); padding: 20px; text-align: center; }
.cel { cursor: cell; }
.alzado .cel.hov { stroke: var(--fg-2); stroke-width: 2px; }
#pinceles { flex-wrap: wrap; }
.cubo button[aria-pressed="false"] { color: var(--fg-3); text-decoration: line-through; }
.pincel .cel { cursor: crosshair; }
.rot { cursor: pointer; }
.rot:hover text { fill: var(--primary); }

/* ── derecha ── */
.props { flex: 1 1 58%; min-height: 0; overflow: auto; border-bottom: 1px solid var(--line); }
.lista-sec { flex: 1 1 42%; min-height: 160px; display: flex; flex-direction: column; }
.p-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.p-head input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); padding: 3px 6px; font-weight: 600; font-size: 14px; }
.p-head input:hover { border-color: var(--line-2); }
.p-head input:focus { border-color: var(--primary); outline: none; background: var(--card); }
.badge { font: 500 10.5px var(--font-mono); padding: 1px 6px; border-radius: 99px; background: var(--elev); color: var(--fg-2); white-space: nowrap; }
.grupo { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.grupo > h4 { margin: 0; font: 600 10.5px var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fila { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; align-items: center; }
.fila > label, .fila > .lab { color: var(--fg-2); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--line-2); background: var(--card); border-radius: 99px; padding: 2px 9px; font-size: 12px;
  color: var(--fg-2); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip:hover { color: var(--fg); border-color: var(--fg-3); }
.chip.on { background: var(--primary-strong); border-color: transparent; color: var(--primary-fg); font-weight: 600; }
.chip.alt { border-style: dashed; }
.chip.alt b { color: var(--fg); font-weight: 600; }
.campo {
  width: 100%; height: 26px; border: 1px solid var(--line-2); background: var(--card); border-radius: var(--r-sm);
  padding: 0 7px; font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.campo:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.campo.err { border-color: var(--err); }
.campo.sm { width: 64px; }
.unidad { display: flex; align-items: center; gap: 6px; }
.unidad span { color: var(--fg-3); font-size: 11.5px; white-space: nowrap; }
.frente {
  display: grid; gap: 6px; padding: 8px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line);
}
.frente.sel { border-color: oklch(0.62 0.16 42 / 55%); }
.frente-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.frente-top .letra { font: 700 12px var(--font-mono); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; background: var(--elev); }
.relleno { font: 500 12.5px var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.relleno .ok { color: var(--ok); font: 500 11px var(--font-sans); margin-left: 6px; }
.relleno .warn { color: var(--warn); font: 500 11px var(--font-sans); margin-left: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--primary); width: 14px; height: 14px; margin: 0; }
.aviso {
  display: grid; gap: 6px; padding: 7px 9px; border-radius: var(--r-sm); font-size: 12px; border: 1px solid transparent;
  border-left-width: 3px;
}
.aviso.error { background: var(--err-soft); border-left-color: var(--err); }
.aviso.aviso { background: var(--warn-soft); border-left-color: var(--warn); }
.aviso.info { background: var(--info-soft); border-left-color: var(--info); }
.aviso .acc { display: flex; gap: 6px; flex-wrap: wrap; }
.aviso .acc .btn { background: var(--card); }
