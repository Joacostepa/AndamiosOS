<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partes de obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   1. TOKENS — espejo de src/app/globals.css (claro = :root, oscuro = .dark)
   ════════════════════════════════════════════════════════════════════════════ */
:root {
  --bg: oklch(0.985 0 0); --escenario: oklch(0.945 0.004 90);
  --card: oklch(1 0 0); --card2: oklch(0.975 0 0); --hover: oklch(0.965 0 0);
  --fg: oklch(0.145 0 0); --muted: oklch(0.5 0 0); --muted2: oklch(0.6 0 0);
  --border: oklch(0.9 0 0); --border-strong: oklch(0.82 0 0);
  --coral: #d85a30; --coral-btn: oklch(0.55 0.16 42); --coral-btn-hover: oklch(0.5 0.16 42);
  --coral-bg: #faece7; --coral-text: #993c1d;
  --azul-bg: #e6f1fb; --azul-borde: #378add; --azul-text: #0c447c;
  --ambar-bg: #faeeda; --ambar-borde: #ef9f27; --ambar-text: #633806;
  --verde-bg: #eaf3de; --verde-text: #27500a;
  --violeta-bg: #edeafb; --violeta-text: #332a72;
  --teal-bg: #def2f1; --teal-text: #0b4f4a;
  --neutro-bg: #f1efe8; --neutro-text: #5f5e5a;
  --ok: oklch(0.45 0.12 140); --ok-solido: oklch(0.52 0.13 140); --ok-bg: #eaf3de;
  --peligro: #b42318; --peligro-solido: #d92d20; --peligro-bg: #fdecea;
  --aviso-bg: #fef6e7; --aviso-borde: #f5d9a0; --aviso-text: #7a4405; --aviso-icono: #b54708;
  --riel: #e8e6df; --banda: #e1ecd4;
  --ins-bg: #dff0d0; --del-bg: #fbe1dc;
  --sombra-1: 0 1px 2px oklch(0 0 0 / 6%);
  --sombra-2: 0 6px 24px -8px oklch(0 0 0 / 18%), 0 1px 3px oklch(0 0 0 / 6%);
  --marco: #18181a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.13 0 0); --escenario: oklch(0.1 0 0); --card: oklch(0.2 0 0); --card2: oklch(0.17 0 0); --hover: oklch(0.235 0 0);
    --fg: oklch(0.93 0 0); --muted: oklch(0.68 0 0); --muted2: oklch(0.56 0 0); --border: oklch(1 0 0 / 10%); --border-strong: oklch(1 0 0 / 18%);
    --coral-bg: oklch(0.28 0.05 42); --coral-text: oklch(0.87 0.07 42);
    --azul-bg: oklch(0.27 0.045 254); --azul-borde: oklch(0.7 0.14 254); --azul-text: oklch(0.86 0.06 254);
    --ambar-bg: oklch(0.27 0.04 70); --ambar-borde: oklch(0.78 0.14 66); --ambar-text: oklch(0.87 0.08 75);
    --verde-bg: oklch(0.27 0.04 140); --verde-text: oklch(0.87 0.09 140);
    --violeta-bg: oklch(0.28 0.05 288); --violeta-text: oklch(0.86 0.07 288);
    --teal-bg: oklch(0.27 0.035 185); --teal-text: oklch(0.87 0.07 185);
    --neutro-bg: oklch(0.26 0.006 90); --neutro-text: oklch(0.85 0.008 90);
    --ok: oklch(0.75 0.15 140); --ok-solido: oklch(0.55 0.14 140); --ok-bg: oklch(0.27 0.04 140);
    --peligro: oklch(0.72 0.17 28); --peligro-bg: oklch(0.27 0.06 28);
    --aviso-bg: oklch(0.25 0.035 70); --aviso-borde: oklch(0.35 0.05 70); --aviso-text: oklch(0.87 0.07 75); --aviso-icono: oklch(0.8 0.13 65);
    --riel: oklch(0.28 0 0); --banda: oklch(0.32 0.05 140); --ins-bg: oklch(0.32 0.06 140); --del-bg: oklch(0.32 0.07 28);
    --sombra-1: 0 1px 2px oklch(0 0 0 / 40%); --sombra-2: 0 10px 30px -10px oklch(0 0 0 / 70%); --marco: #000;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.13 0 0); --escenario: oklch(0.1 0 0); --card: oklch(0.2 0 0); --card2: oklch(0.17 0 0); --hover: oklch(0.235 0 0);
  --fg: oklch(0.93 0 0); --muted: oklch(0.68 0 0); --muted2: oklch(0.56 0 0); --border: oklch(1 0 0 / 10%); --border-strong: oklch(1 0 0 / 18%);
  --coral-bg: oklch(0.28 0.05 42); --coral-text: oklch(0.87 0.07 42);
  --azul-bg: oklch(0.27 0.045 254); --azul-borde: oklch(0.7 0.14 254); --azul-text: oklch(0.86 0.06 254);
  --ambar-bg: oklch(0.27 0.04 70); --ambar-borde: oklch(0.78 0.14 66); --ambar-text: oklch(0.87 0.08 75);
  --verde-bg: oklch(0.27 0.04 140); --verde-text: oklch(0.87 0.09 140);
  --violeta-bg: oklch(0.28 0.05 288); --violeta-text: oklch(0.86 0.07 288);
  --teal-bg: oklch(0.27 0.035 185); --teal-text: oklch(0.87 0.07 185);
  --neutro-bg: oklch(0.26 0.006 90); --neutro-text: oklch(0.85 0.008 90);
  --ok: oklch(0.75 0.15 140); --ok-solido: oklch(0.55 0.14 140); --ok-bg: oklch(0.27 0.04 140);
  --peligro: oklch(0.72 0.17 28); --peligro-bg: oklch(0.27 0.06 28);
  --aviso-bg: oklch(0.25 0.035 70); --aviso-borde: oklch(0.35 0.05 70); --aviso-text: oklch(0.87 0.07 75); --aviso-icono: oklch(0.8 0.13 65);
  --riel: oklch(0.28 0 0); --banda: oklch(0.32 0.05 140); --ins-bg: oklch(0.32 0.06 140); --del-bg: oklch(0.32 0.07 28);
  --sombra-1: 0 1px 2px oklch(0 0 0 / 40%); --sombra-2: 0 10px 30px -10px oklch(0 0 0 / 70%); --marco: #000;
}

/* ════════════════════════════════════════════════════════════════════════════
   2. BASE, barra de la maqueta, escenario
   ════════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--escenario); color: var(--fg); font: 400 13px/1.45 "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .92em; }
.mut { color: var(--muted); }
.ico { display: inline-block; vertical-align: -0.2em; flex-shrink: 0; }
.spin { animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font: 500 10px/1 "JetBrains Mono", monospace; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--border-strong); border-bottom-width: 2px; color: var(--muted); background: var(--card); }
.btn.prim kbd { background: transparent; color: #fff; border-color: rgb(255 255 255 / 45%); }

#barra { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--escenario); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
#barra .marca { font-weight: 600; color: var(--fg); margin-right: auto; display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#barra .marca i { width: 8px; height: 8px; border-radius: 2px; background: var(--coral); display: inline-block; flex-shrink: 0; }
.badge-side { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 7px; background: var(--card); border: 1px solid var(--border); color: var(--fg); font-weight: 500; }
.badge-side b { background: var(--coral-btn); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; line-height: 17px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; background: var(--card); flex-shrink: 0; }
.seg button { padding: 4px 9px; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); font-size: 12px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 760px) { #barra .solo-ancho { display: none; } }

#escenario { padding: 20px 16px 48px; }
#escenario.movil { display: flex; justify-content: center; padding-top: 24px; }
#marco { max-width: 1140px; margin: 0 auto; }
#escenario.movil #marco { width: 390px; height: min(820px, calc(100vh - 100px)); min-height: 560px; margin: 0; border: 11px solid var(--marco); border-radius: 46px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 30px 60px -20px oklch(0 0 0 / 35%); }
#escenario.movil #marco::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 20px; background: var(--marco); z-index: 30; }
#escenario.movil #app { height: 100%; overflow-y: auto; overflow-x: hidden; padding-top: 38px; border: 0; border-radius: 0; }
@media (max-width: 640px) {
  #escenario, #escenario.movil { padding: 0; display: block; }
  #escenario.movil #marco, #marco { width: auto; height: auto; min-height: 0; border: 0; border-radius: 0; box-shadow: none; overflow: visible; }
  #escenario.movil #marco::before { display: none; }
  #escenario.movil #app { height: auto; overflow: visible; padding-top: 0; }
  #app { border: 0 !important; border-radius: 0 !important; }
}

/* ════════════════════════════════════════════════════════════════════════════
   3. APP — encabezado, pestañas, tira semanal, layout
   ════════════════════════════════════════════════════════════════════════════ */
#app { background: var(--bg); border-radius: 14px; border: 1px solid var(--border); min-height: 70vh; }
.app { padding: 18px 24px 28px; }
.app.movil { padding: 12px 16px 24px; }
.cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cab h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.cab .acciones { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.app.movil .cab h1 { font-size: 17px; }
.tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { padding: 8px 12px 9px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--coral); }
.tabs .cnt { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--neutro-bg); color: var(--neutro-text); line-height: 17px; }
.tabs .cnt.coral { background: var(--coral-bg); color: var(--coral-text); }
.app.movil .tabs { margin: 10px -16px 0; padding: 0 16px; }
.tab-desc { margin: 10px 0 0; display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.tab-desc .ico { margin-top: 2px; } .tab-desc b { color: var(--fg); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--card); font-weight: 500; font-size: 12.5px; white-space: nowrap; transition: background .12s, border-color .12s, transform .08s; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.prim { background: var(--coral-btn); border-color: var(--coral-btn); color: #fff; }
.btn.prim:hover:not(:disabled) { background: var(--coral-btn-hover); }
.btn.fant { border-color: transparent; background: transparent; }
.btn.fant:hover:not(:disabled) { background: var(--hover); }
.btn.chico { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn.icono { width: 32px; padding: 0; }
.btn.opt[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.link { color: var(--coral-text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }
.link:hover { color: var(--coral); }

.deuda-linea { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.deuda-linea b { color: var(--coral-text); font-weight: 600; }
.semana { margin-top: 8px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.dia-chip { text-align: left; padding: 7px 9px 8px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: border-color .12s, box-shadow .12s; }
.dia-chip:hover:not(:disabled) { border-color: var(--border-strong); box-shadow: var(--sombra-1); }
.dia-chip .d { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; }
.dia-chip .d b { font-weight: 600; color: var(--fg); font-size: 13px; }
.dia-chip .e { font-size: 11.5px; font-weight: 500; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted2); }
.dia-chip .e2 { font-size: 10.5px; color: var(--aviso-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dia-chip.ok .e { color: var(--ok); }
.dia-chip.deuda { border-color: color-mix(in srgb, var(--coral) 40%, var(--border)); }
.dia-chip.deuda .e { color: var(--coral-text); }
.dia-chip[aria-current="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.dia-chip .punto { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }
.app.movil .semana { display: flex; overflow-x: auto; scrollbar-width: none; margin: 8px -16px 0; padding: 0 16px 2px; }
.app.movil .semana::-webkit-scrollbar { display: none; }
.app.movil .dia-chip { flex: 0 0 84px; }
@media (max-width: 900px) { .app:not(.movil) .semana { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.aviso-apertura { margin-top: 12px; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 9px; background: var(--card2); border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
.aviso-apertura b { color: var(--fg); }
.aviso-apertura .x { margin-left: auto; }

.dia-titulo { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.dia-titulo h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dia-titulo h2::first-letter { text-transform: uppercase; }
.dia-titulo .sub { font-size: 12.5px; color: var(--muted); }

.cuerpo { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
@media (max-width: 1020px) { .cuerpo { grid-template-columns: minmax(0, 1fr); } .aside { order: -1; } }
.app.movil .cuerpo { display: block; }

/* ── Aside ── */
.aside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 60px; }
@media (max-width: 1020px) { .aside { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.panel h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.panel h3 .der { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.cifra { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.cifra b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.prog-barra { margin-top: 8px; display: flex; gap: 3px; height: 8px; }
.prog-barra i { flex: 1; border-radius: 3px; background: var(--riel); transition: background .3s; }
.prog-barra i.confirmada { background: var(--ok-solido); }
.prog-barra i.ventana, .prog-barra i.escribiendo { background: color-mix(in srgb, var(--ok-solido) 45%, var(--riel)); }
.prog-barra i.falta { background: var(--ambar-borde); }
.prog-barra i.fallo { background: var(--peligro-solido); }
.hh-riel { position: relative; height: 26px; margin-top: 10px; }
.hh-riel .r { position: absolute; left: 0; right: 0; top: 9px; height: 8px; border-radius: 4px; background: var(--riel); }
.hh-riel .banda { position: absolute; top: 9px; height: 8px; background: var(--banda); border-left: 1px solid var(--ok-solido); border-right: 1px solid var(--ok-solido); }
.hh-riel .conf { position: absolute; top: 9px; left: 0; height: 8px; border-radius: 4px 0 0 4px; background: var(--fg); transition: width .4s cubic-bezier(.2,.8,.2,1); }
.hh-riel .proy { position: absolute; top: 4px; width: 2px; height: 18px; background: var(--fg); transition: left .4s cubic-bezier(.2,.8,.2,1); }
.hh-riel .proy::after { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--fg); background: var(--card); }
.hh-escala { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted2); }
.alerta { margin-top: 8px; display: flex; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; align-items: flex-start; }
.alerta.aviso { background: var(--aviso-bg); color: var(--aviso-text); border: 1px solid var(--aviso-borde); }
.alerta.peligro { background: var(--peligro-bg); color: var(--peligro); border: 1px solid color-mix(in srgb, var(--peligro) 30%, transparent); }
.cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
.cifras div { font-size: 11px; color: var(--muted); }
.cifras b { display: block; font-size: 15px; color: var(--fg); font-weight: 600; }
.nota { padding: 7px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
.nota:first-of-type { border-top: 0; padding-top: 0; }
.nota .quien { font-size: 11px; color: var(--muted); }
.fila-form { display: flex; gap: 6px; margin-top: 8px; }
.input { height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--card); min-width: 0; width: 100%; transition: border-color .12s, box-shadow .12s; }
.input:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 18%, transparent); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.leyenda-ev { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.leyenda-ev div { display: flex; gap: 8px; align-items: center; }
.atajos-hint { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

/* ════════════════════════════════════════════════════════════════════════════
   4. EVIDENCIA — 4 niveles + corregido. Ícono y texto, nunca sólo color.
   ════════════════════════════════════════════════════════════════════════════ */
.ev { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; vertical-align: middle; }
.ev.declarado { background: var(--violeta-bg); color: var(--violeta-text); }
.ev.registrado { background: var(--teal-bg); color: var(--teal-text); }
.ev.hoja { background: var(--azul-bg); color: var(--azul-text); }
.ev.plan { background: transparent; color: var(--muted); border: 1px dashed var(--border-strong); }
.ev.corregido { background: var(--neutro-bg); color: var(--neutro-text); }
.ev .det { font-weight: 500; opacity: .85; }

/* ════════════════════════════════════════════════════════════════════════════
   5. GRUPOS Y TARJETAS (cuadrilla-día)
   ════════════════════════════════════════════════════════════════════════════ */
.grupo { margin-top: 18px; }
.grupo:first-child { margin-top: 0; }
.grupo-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-height: 26px; flex-wrap: wrap; }
.grupo-cab .t { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.grupo-cab .t .n { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--neutro-bg); color: var(--neutro-text); letter-spacing: 0; }

.tarjeta { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 11px; transition: border-color .15s, box-shadow .15s; }

.tarjeta.foco { border-color: var(--border-strong); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 16%, transparent); }

.tarjeta.e-ventana, .tarjeta.e-escribiendo { background: color-mix(in srgb, var(--ok-bg) 45%, var(--card)); border-color: color-mix(in srgb, var(--ok-solido) 35%, var(--border)); }

.t-cab { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 14px; cursor: pointer; border-radius: 11px; }

.est-ico { width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; border: 1.5px dashed var(--border-strong); color: var(--muted2); }

.t-tit { flex: 1; min-width: 0; }

.t-tit .oracion s { color: var(--muted2); }

.tipo { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px 0 4px; border-radius: 5px; font-size: 11px; font-weight: 600; flex-shrink: 0; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 500; white-space: nowrap; position: relative; overflow: hidden; }

.pill.confirmada { color: var(--ok); }

/* Cuerpo */

.app.movil kbd { display: none; }
.app.movil .t-pie .solo-desk { display: none; }
@keyframes abrir { from { opacity: 0; transform: translateY(-4px); } }
.app.movil .t-cuerpo { padding: 0 14px 14px; animation: none; }
.bloque { margin-top: 14px; }
.bloque-t { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bloque-t .der { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }

.dif { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 9px; background: var(--coral-bg); color: var(--coral-text); border: 1px solid color-mix(in srgb, var(--coral) 30%, transparent); font-size: 13px; }
.dif + .dif { margin-top: 8px; }

.gente { display: flex; flex-wrap: wrap; gap: 6px; }
.persona { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 4px; border-radius: 16px; border: 1px solid var(--border-strong); background: var(--card); font-weight: 500; transition: all .12s; }
.persona:hover { border-color: var(--fg); }
.persona .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--violeta-bg); color: var(--violeta-text); }
.persona.acargo .av { background: var(--coral-btn); color: #fff; }
.persona .m { font-size: 10.5px; color: var(--muted); font-weight: 400; }
.persona.no { border-style: dashed; color: var(--muted2); background: transparent; }
.persona.no .nom { text-decoration: line-through; }
.persona.no .av { background: var(--riel); color: var(--muted2); }
.persona.sugerida { border-style: dashed; }
.persona.agregar { color: var(--muted); border-style: dashed; padding: 0 10px; }
.persona.contr { background: var(--card2); }
.gente-pie { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.obra { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
.obra + .obra { margin-top: 8px; }
.obra .o1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.obra .o1 strong { font-size: 13.5px; font-weight: 600; }
.obra .o1 .der { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.obra .ref { font-size: 12px; color: var(--muted); margin-top: 1px; }
.obra .datos { margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; }
.obra .dato .k { font-size: 11px; color: var(--muted); }
.obra .dato .v { font-size: 14px; font-weight: 600; margin: 1px 0 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.obra .dato .v .alto { color: var(--coral-text); background: var(--coral-bg); padding: 0 6px; border-radius: 5px; }
.obra .dato .evs { display: flex; flex-wrap: wrap; gap: 4px; }
.obra.nose { background: color-mix(in srgb, var(--peligro-bg) 50%, var(--card)); border-color: color-mix(in srgb, var(--peligro) 25%, var(--border)); }
.obra .editar-h { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; font-weight: 500; border: 1px solid var(--border-strong); background: var(--card); white-space: nowrap; transition: all .12s; }
.chip:hover { background: var(--hover); }
.chip.chico { height: 24px; padding: 0 8px; font-size: 11.5px; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip.peligro[aria-pressed="true"] { background: var(--peligro-solido); border-color: var(--peligro-solido); color: #fff; }
.chip .sug-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--aviso-icono); }
.hora { width: 70px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; user-select: none; }
.check input { width: 15px; height: 15px; accent-color: var(--coral-btn); margin: 0; }
.evid-linea { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }

.minimo { padding: 10px 12px; border-radius: 9px; border: 1px dashed var(--border-strong); background: var(--card2); }
.minimo .preg { font-weight: 600; font-size: 13px; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }

.combo { width: 100%; max-width: 340px; }
.combo-lista { margin-top: 4px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--card); box-shadow: var(--sombra-2); overflow: hidden; }
.combo-lista button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 10px; text-align: left; font-size: 12.5px; }
.combo-lista button:hover { background: var(--hover); }
.combo-lista .esc { margin-left: auto; font-size: 11px; color: var(--muted); }
.combo-vacio { padding: 10px; font-size: 12px; color: var(--muted); }

.panel-falta { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--aviso-bg); border: 1px solid var(--aviso-borde); color: var(--aviso-text); }
.panel-falta h4 { margin: 0 0 8px; font-size: 13.5px; color: var(--fg); }
.panel-falta .sub { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 6px; }
.panel-falta .msj { margin-top: 10px; padding: 9px 11px; border-radius: 12px 12px 12px 3px; background: var(--card); color: var(--fg); border: 1px solid var(--border); font-size: 12.5px; max-width: 420px; }
.panel-falta .msj .bots { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.panel-falta .msj .bots span { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--azul-bg); color: var(--azul-text); }
.panel-falta .acc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.esperando { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 9px; background: var(--aviso-bg); color: var(--aviso-text); border: 1px solid var(--aviso-borde); font-size: 12.5px; }
.esperando .t { flex: 1; min-width: 200px; }
.respuesta { margin-top: 12px; display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 9px; background: var(--violeta-bg); color: var(--violeta-text); font-size: 12.5px; }

.mas { margin-top: 14px; padding-top: 4px; border-top: 1px dashed var(--border); }
.fotos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.foto { flex: 0 0 104px; display: flex; flex-direction: column; gap: 4px; }
.foto .img { width: 104px; height: 78px; border-radius: 7px; overflow: hidden; background: var(--riel); border: 1px solid var(--border); position: relative; }
.foto .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto .origen { position: absolute; left: 4px; top: 4px; font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: oklch(0 0 0 / 55%); color: #fff; }
.foto select { height: 26px; font-size: 11.5px; padding: 0 4px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--card); width: 100%; }
.foto-agregar { flex: 0 0 104px; height: 78px; border-radius: 7px; border: 1.5px dashed var(--border-strong); display: grid; place-items: center; color: var(--muted); font-size: 11.5px; cursor: pointer; text-align: center; }
.foto-agregar:hover { border-color: var(--coral); color: var(--coral-text); background: var(--coral-bg); }
.foto-agregar input { display: none; }

.t-pie { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.t-pie .bloqueos { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.t-pie .bloq { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--aviso-text); background: var(--aviso-bg); padding: 3px 8px; border-radius: 6px; }
.t-pie .der { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn-conf { min-width: 150px; }

.reprog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.reprog button { text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--card); display: flex; flex-direction: column; gap: 1px; }
.reprog button:hover { background: var(--hover); }
.reprog button b { font-size: 13px; }
.reprog button span { font-size: 11px; color: var(--muted); }
.reprog button[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }

.confirmadas-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.conf-linea { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); font-size: 12.5px; }

.conf-linea .txt { flex: 1; min-width: 0; }
.conf-linea .txt .mut { display: block; font-size: 11.5px; }

.vacio { text-align: center; padding: 44px 20px; border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--muted); }
.vacio .ilu { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; background: var(--card2); color: var(--muted2); }
.vacio h4 { margin: 0 0 4px; color: var(--fg); font-size: 15px; font-weight: 600; }
.vacio p { margin: 0 auto 12px; max-width: 360px; font-size: 12.5px; }
.cerrado { border-radius: 14px; padding: 20px; margin-bottom: 14px; background: linear-gradient(135deg, var(--ok-bg), var(--card) 75%); border: 1px solid color-mix(in srgb, var(--ok-solido) 35%, var(--border)); display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.cerrado .sello { width: 46px; height: 46px; border-radius: 50%; background: var(--ok-solido); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.cerrado.anim .sello { animation: sello .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes sello { from { transform: scale(.3); opacity: 0; } }
.cerrado h4 { margin: 0; font-size: 18px; font-weight: 600; }
.cerrado .txt { flex: 1; min-width: 200px; }
.cerrado .txt p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
.cerrado .stats { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; }
.cerrado .stats div { font-size: 11px; color: var(--muted); }
.cerrado .stats b { display: block; font-size: 17px; color: var(--fg); font-weight: 600; }
.cerrado .sig { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.pie-dia { margin-top: 16px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; }
.pie-dia .der { margin-left: auto; }

/* ── Móvil oficina: una tarjeta a la vez ── */
.app.movil .tarjeta { border-radius: 14px; box-shadow: var(--sombra-2); touch-action: pan-y; }
.app.movil .t-cab { cursor: default; padding: 14px; }
.app.movil .t-cab:hover { background: none; }
.app.movil .t-der { max-width: none; }
.tarjeta-wrap .tarjeta { transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s; }
.tarjeta-wrap .tarjeta.arrastrando { transition: none; }
.tarjeta-wrap.entra-der .tarjeta { animation: entraDer .24s cubic-bezier(.2,.8,.2,1); }
.tarjeta-wrap.entra-izq .tarjeta { animation: entraIzq .24s cubic-bezier(.2,.8,.2,1); }
@keyframes entraDer { from { transform: translateX(40px); opacity: 0; } }
@keyframes entraIzq { from { transform: translateX(-40px); opacity: 0; } }
.nav-movil-top { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.nav-movil-top .pos { flex: 1; text-align: center; font-size: 12.5px; color: var(--muted); }
.puntos { display: flex; justify-content: center; gap: 6px; margin: 8px 0 10px; }
.puntos button { width: 8px; height: 8px; border-radius: 4px; background: var(--riel); transition: all .2s; }
.puntos button.confirmada, .puntos button.ventana, .puntos button.escribiendo { background: var(--ok-solido); }
.puntos button.falta, .puntos button.fallo { background: var(--ambar-borde); }
.puntos button.actual { width: 22px; background: var(--fg); }
.acciones-movil { position: sticky; bottom: 0; margin: 14px -16px -24px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border); z-index: 5; }
.acciones-movil .fila2 { display: flex; gap: 8px; margin-bottom: 8px; }
.acciones-movil .fila2 .btn { flex: 1; height: 44px; font-size: 13.5px; border-radius: 10px; }
.acciones-movil .btn-conf { width: 100%; height: 56px; font-size: 16px; border-radius: 12px; }
.swipe-hint { text-align: center; font-size: 11px; color: var(--muted2); margin-top: 8px; }

/* ════════════════════════════════════════════════════════════════════════════
   6. OTs POR CERRAR
   ════════════════════════════════════════════════════════════════════════════ */
.cierres { margin-top: 16px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .cierres { grid-template-columns: minmax(0, 1fr); } }
.app.movil .cierres { grid-template-columns: minmax(0, 1fr); }
.cola button.item { width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; gap: 3px; }

.cola button.item[aria-current="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }

.cola button.item .s { font-size: 11.5px; color: var(--muted); }

.cierre-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.cierre-panel .marca { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--coral-text); }
.cierre-panel h3 { margin: 6px 0 4px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.cierre-panel .ev-lista { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: 12.5px; }
.cierre-panel .ev-lista div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.asb { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .asb { grid-template-columns: 1fr; } }
.app.movil .asb { grid-template-columns: 1fr; }
.asb .col .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }

}

function fotoSVG(semilla, momento) {
  const r = (n) => { const x = Math.sin(semilla * 97.13 + n * 13.7) * 10000; return x - Math.floor(x); };

  const pisos = 4 + Math.floor(r(2) * 3), an = 70 + r(3) * 30, x0 = 120 - an / 2 - 20;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 156"><defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cielo[0]}"/><stop offset="1" stop-color="${cielo[1]}"/></linearGradient></defs><rect width="208" height="156" fill="url(#c)"/><rect x="${x0}" y="${150 - pisos * 22}" width="${an}" height="${pisos * 22}" fill="#d6cdc1"/>`;
  for (let p = 0; p < pisos; p++) for (let v = 0; v < 3; v++) s += `<rect x="${x0 + 10 + v * (an - 20) / 3}" y="${154 - (p + 1) * 22}" width="${(an - 20) / 3 - 8}" height="12" fill="#8a96a3" opacity=".7"/>`;
  const niv = momento === 'antes' ? 0 : momento === 'durante' ? Math.ceil(pisos / 2) : pisos;
  for (let n = 0; n <= niv; n++) {
    const y = 150 - n * 22;
    s += `<line x1="${x0 - 8}" y1="${y}" x2="${x0 + an + 8}" y2="${y}" stroke="#d85a30" stroke-width="2.2"/>`;
    if (n < niv) for (let c = 0; c <= 4; c++) { const x = x0 - 8 + c * (an + 16) / 4; s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - 22}" stroke="#596573" stroke-width="1.8"/>`; if (c < 4) s += `<line x1="${x}" y1="${y}" x2="${x + (an + 16) / 4}" y2="${y - 22}" stroke="#596573" stroke-width="1" opacity=".7"/>`; }

/** Diff de palabras (LCS) para el as-built contra el detalle técnico. */
function diffPalabras(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = '', cambios = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { if (A[i].trim()) { out += `<del>${esc(A[i])}</del>`; cambios++; } else out += esc(A[i]); i++; }
    else { if (B[j].trim()) { out += `<ins>${esc(B[j])}</ins>`; cambios++; } else out += esc(B[j]); j++; }
  }
  while (i < n) { out += A[i].trim() ? (cambios++, `<del>${esc(A[i])}</del>`) : esc(A[i]); i++; }
  while (j < m) { out += B[j].trim() ? (cambios++, `<ins>${esc(B[j])}</ins>`) : esc(B[j]); j++; }
  return { html: out, cambios };
}

/** Nivel de evidencia de las personas: el más fuerte que respalda la lista actual. */
function nivelPersonas(t) {

  if (t.declaracion && t.declaracion.tipo !== 'nose') return 'declarado';
  if (t.gente.length && t.gente.every((g) => g.ev === 'registrado' || g.ev === 'declarado' || g.ausente)) return 'registrado';

  if (t.declaracion && t.declaracion.viaOficina) return 'corregido'; // cargado por la oficina: no es segunda firma

  if (t.obras.some((o) => /hecho|No pude/.test(o.desde.det + o.hasta.det + o.fletes.det))) return 'registrado';

/** Regla del toque único: ¿se hizo?, personas y hasta con nivel Registrado o Declarado. */
function tieneEvidencia(t) {

function anomaliasDe(t) {
  const out = [], n = nPersonas(t);
  if (obrasHechas(t).length) {

    if (n > UMBRAL.personasMax) out.push(`${n} personas: más de ${UMBRAL.personasMax}, y la cuadrilla mediana es de ${UMBRAL.cuadrillaMediana}. ¿Se contó dos veces a alguien?`);
  }
  for (const o of obrasHechas(t)) {
    const d = parseHora(o.desde.v), h = parseHora(o.hasta.v);
    if (o.tipo === 'desarme' && o.armadoPrevio && n === o.armadoPrevio.personas && minutosEntre(o.desde.v, o.armadoPrevio.desde) < 1 && minutosEntre(o.hasta.v, o.armadoPrevio.hasta) < 1) {
      const respaldo = FUERTE.has(o.hasta.nivel) ? ' Acá hay registro del chofer, así que probablemente esté bien.' : '';
      out.push(`${o.direccion}: mismas personas y horario que el armado de esta obra (${o.armadoPrevio.fecha}). ¿Se copió?${respaldo}`);
    }
    if (Number(o.fletes.v) >= UMBRAL.fletesAlto) out.push(`${o.direccion}: ${o.fletes.v} fletes en una jornada. 3 de cada 4 jornadas llevan 1.`);
    if (o.personalPrevisto && hhObra(t, o) > o.fraccion * 8 * o.personalPrevisto * UMBRAL.hhFactor) out.push(`${o.direccion}: ${fmtNum(hhObra(t, o))} hh, más de lo habitual para ${FRACCION_LABEL[o.fraccion]} jornada con ${o.personalPrevisto} personas (≈ ${Math.round(o.fraccion * 8 * o.personalPrevisto * UMBRAL.hhFactor)} máx.).`);

  }

}

function fechaCorta(iso) { const [, m, d] = iso.split('-'); const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb']; return `${dias[new Date(iso + 'T12:00').getDay()]} ${Number(d)}/${Number(m)}`; }

/* ═══ 5. ESTADO ═══ */
const state = {
  fecha: null, vista: 'desktop', tema: 'auto', tab: 'confirmar',
  tarjetas: {}, notas: clon(NOTAS), cierres: clon(OTS_CERRAR),
  ui: {
    abierta: null, foco: null, idxMovil: 0, ayuda: false, dialogo: null, entrada: '', confirmadasAbiertas: false,
    busca: {}, mas: {}, falta: {}, nose: {}, horario: {}, ack: {}, flash: {}, recienCerrado: {}, deshacerPila: [],
    nuevaNota: '', nueva: { otId: '', cuadrilla: '', fraccion: '1' }, avisoApertura: true, cierreSel: 1164, cierreTexto: {}, llamado: {},
    cap: null, capOfi: null, ackCierre: {},
  },
};
const TIMERS = {};

function initTarjetas() {
  state.tarjetas = {};
  for (const ts of Object.values(DATOS)) for (const base of ts) {
    const t = clon(base);
    t.gente.forEach((g) => { g.fue = !g.ausente; });
    if (t.declaracion && t.declaracion.ausentes) t.gente.forEach((g) => { if (t.declaracion.ausentes.includes(g.id)) g.fue = true; }); // la hoja todavía los tiene: la diferencia lo resuelve
    t.diffs.forEach((d) => { d.elegido = null; });
    t.obras.forEach((o, i) => { o.fotos = (o.fotosLink || []).map(([m, h], k) => ({ id: `${o.id}-f${k}`, momento: m, hora: h, src: fotoSVG(i * 10 + k + o.ot, m), incluida: true })); });
    t.estado = t.previa ? 'confirmada' : 'pendiente';
    t.confirmadaAt = t.previa ? t.previa.hora : null;
    t.obs = ''; t.incidencia = { tipo: '', desc: '' }; t.tercerizado = false; t.costoFlete = ''; t.camionEnObra = false;
    t.horarioConfirmado = false; t.borradorAt = null; t.intentos = 0; t.respondida = false;
    if (t.esperando && !t.esperando.nombre) t.esperando.nombre = pila(t.esperando.a);
    t.novedades = (t.novedades || []).map(novedadInit);
    t.grupo = grupoInicial(t);
    state.tarjetas[t.id] = t;

}
const tarjetasDe = (f) => (DATOS[f] || []).map((b) => state.tarjetas[b.id]).filter(Boolean);
const tarjeta = (id) => state.tarjetas[id];
const pendientesDe = (f) => tarjetasDe(f).filter((t) => t.estado !== 'confirmada');
/** La deuda se cuenta en JORNADAS, igual que el badge del sidebar. Una sola función para los dos. */
const deudaDe = (f) => pendientesDe(f).reduce((s, t) => s + t.obras.length, 0);
const deudaTotal = () => SEMANA.reduce((s, d) => s + deudaDe(d.iso), 0);
const diaMasViejoConDeuda = () => (SEMANA.find((d) => deudaDe(d.iso) > 0) || null);
/** Orden de trabajo del día: lo que hay que pensar primero. */
const GRUPOS = [
  { id: 'revisar', t: 'Para revisar', desc: 'las fuentes no coinciden o hay algo raro' },
  { id: 'sinDatos', t: 'Sin datos de la obra', desc: 'sólo está el plan: completá lo mínimo' },
  { id: 'falta', t: 'Falta un dato', desc: 'guardadas, esperando respuesta' },
  { id: 'lista', t: 'Listas para confirmar', desc: 'con evidencia declarada o registrada' },

function ordenDelDia(f) {
  const ts = tarjetasDe(f), out = [];
  for (const g of GRUPOS) out.push(...ts.filter((t) => t.grupo === g.id && t.estado !== 'confirmada'));
  out.push(...ts.filter((t) => t.estado === 'confirmada'));
  return out;
}

/* ── Outbox: Confirmar → 10 s para deshacer → escribir en Odoo (con clave) → confirmada | fallo ── */
function confirmar(id, { lote = false } = {}) {
  const t = tarjeta(id);
  if (!t || ['ventana', 'escribiendo', 'confirmada'].includes(t.estado)) return false;
  if (bloqueosDe(t).length) { enfocarBloqueo(id); return false; }
  const snap = clon(t);
  t.snapshot = snap; t.estado = 'ventana'; t.ventanaHasta = Date.now() + VENTANA_DESHACER * 1000;
  state.ui.deshacerPila.push(id);
  clearTimeout(TIMERS[id]);
  TIMERS[id] = setTimeout(() => escribir(id), VENTANA_DESHACER * 1000);
  if (!lote) {
    const k = novAlParte(t);
    if (k || esMovil()) toast(`Cuadrilla ${t.cuadrilla} confirmada${k ? ` · ${plural(k, 'novedad', 'novedades')} al parte` : ''}`, `Se escribe en Odoo en ${VENTANA_DESHACER} s.`, { texto: 'Deshacer', fn: () => deshacer(id) });
    avanzarFoco(id);
  }
  return true;
}
function escribir(id) {
  const t = tarjeta(id); clearTimeout(TIMERS[id]);
  t.estado = 'escribiendo'; render();
  setTimeout(() => {
    t.intentos++;
    if (t.fallaPrimero && t.intentos === 1) {
      t.estado = 'fallo'; t.error = 'Odoo no respondió (429). La confirmación quedó guardada; reintentar no crea otro parte.';
      toast(`No se pudo escribir Cuadrilla ${t.cuadrilla}`, 'Odoo no respondió. Nada se perdió.', { texto: 'Reintentar', fn: () => escribir(id) });
    } else {
      t.estado = 'confirmada'; t.confirmadaAt = ahora(); state.ui.flash[id] = Date.now();
      state.ui.deshacerPila = state.ui.deshacerPila.filter((x) => x !== id);
      for (const o of t.obras) {
        if (o.nose && o.nose.reprogramarA) toast(`Jornada nueva el ${fechaCorta(o.nose.reprogramarA)}`, `${o.direccion}. La del ${DIA_SEMANA[t.fecha]} queda como perdida, con su motivo.`);
        const c = state.cierres.find((x) => x.ot === o.ot && !x.cerrada);
        if (c) { c.parteConfirmado = true; toast(`${o.direccion} pasó a «Cierres de obra»`, 'Confirmaste su última jornada: falta el as-built.', { texto: 'Ver', fn: () => { state.tab = 'cerrar'; state.ui.cierreSel = c.ot; render(); } }); }
      }
      if (deudaDe(t.fecha) === 0 && tarjetasDe(t.fecha).length) state.ui.recienCerrado[t.fecha] = true;
    }
    render();
  }, 700 + Math.random() * 500);
}
function deshacer(id) {
  const t = tarjeta(id); if (!t || t.estado !== 'ventana') return;

  const s = t.snapshot; Object.assign(t, s); t.estado = 'pendiente';
  state.ui.deshacerPila = state.ui.deshacerPila.filter((x) => x !== id);
  state.ui.foco = id; render(); toast('Deshecho', `Cuadrilla ${t.cuadrilla} vuelve a quedar sin confirmar.`);
}
function corregir(id) {
  const t = tarjeta(id);
  t.estado = 'pendiente'; t.grupo = t.grupo === 'confirmadas' ? 'revisar' : t.grupo; t.corrigiendo = true;
  state.ui.abierta = id; state.ui.foco = id; render();
}
/** Cada edición se guarda como borrador en el servidor (simulado): sobrevive a cerrar la pestaña. */
function editado(id) { const t = tarjeta(id); t.borradorAt = ahora(); state.ui.ack[id] = false; }
function avanzarFoco(id) {
  const orden = ordenDelDia(state.fecha).filter((x) => x.estado === 'pendiente' && x.id !== id);
  if (esMovil()) {
    setTimeout(() => {
      const lista = ordenDelDia(state.fecha);
      const cur = lista[state.ui.idxMovil];
      if (cur && cur.id !== id) return;
      const sig = lista.findIndex((x) => x.estado === 'pendiente' && x.id !== id);
      state.ui.entrada = 'entra-der'; state.ui.idxMovil = sig >= 0 ? sig : lista.length; render();
    }, 700);
    return;
  }
  if (state.ui.abierta === id) state.ui.abierta = orden[0] && orden[0].grupo !== 'lista' ? orden[0].id : null;
  state.ui.foco = orden[0] ? orden[0].id : id;
}
function enfocarBloqueo(id) {
  const b = bloqueosDe(tarjeta(id))[0]; if (!b) return;
  if (!esMovil()) state.ui.abierta = id;
  render();
  requestAnimationFrame(() => { const el = document.querySelector(`[data-id="${id}"] [data-foco="${b.foco}"]`); if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); if (el.focus) el.focus({ preventScroll: true }); } });
}
/** "Falta un dato": se guarda igual, con a quién preguntarle. La respuesta llega por Telegram (simulada). */
function preguntar(id) {
  const t = tarjeta(id), f = state.ui.falta[id];
  const a = f.a;
  t.esperando = { a: a.id || null, nombre: a.nombre, rol: a.rol, que: f.que, hora: ahora(), respuesta: a.respuesta };
  t.grupo = 'falta'; t.borradorAt = ahora(); delete state.ui.falta[id];
  toast(`Pregunta enviada a ${a.nombre}`, 'La tarjeta queda guardada en «Falta un dato».');

}
function simularRespuesta(id, ms) {
  clearTimeout(TIMERS['r' + id]);
  TIMERS['r' + id] = setTimeout(() => {
    const t = tarjeta(id); if (!t || !t.esperando) return;
    const e = t.esperando;
    if (/a cargo/i.test(e.que)) {
      const quien = e.respuesta || e.a || (t.sugeridos[0] ?? 13);
      t.aCargo = { id: quien, nivel: 'declarado', det: `Respondió ${e.nombre} por Telegram ${ahora()}` };
      t.respondida = `${e.nombre} respondió: «${quien === e.a ? 'Yo' : pila(quien)}» estuvo a cargo.`;
    } else if (/terminaron/i.test(e.que)) {

// Cuenta regresiva: se actualiza el número sin re-render (no interrumpe lo que se tipea).

/* ═══ 6. RENDER ═══ */

function render() {

}

function metricas(f) {

  const cv = document.querySelector('canvas[data-firma]'); if (!cv) return;
  const c = capDe(cv), ctx2 = cv.getContext('2d');
  ctx2.lineWidth = 3.2; ctx2.lineCap = 'round'; ctx2.lineJoin = 'round'; ctx2.strokeStyle = '#1a1a1a';
  if (c.firma) { const img = new Image(); img.onload = () => ctx2.drawImage(img, 0, 0); img.src = c.firma; }
  let dibujando = false;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = (e) => { dibujando = true; cv.setPointerCapture(e.pointerId); const [px, py] = pos(e); ctx2.beginPath(); ctx2.moveTo(px, py); };
  cv.onpointermove = (e) => { if (!dibujando) return; const [px, py] = pos(e); ctx2.lineTo(px, py); ctx2.stroke(); };
  cv.onpointerup = () => { if (!dibujando) return; dibujando = false; c.firma = cv.toDataURL(); actualizarBotonFirma(c); };
}

  'cap-aus': (el) => { const c = state.ui.cap, v = Number(el.dataset.v); c.ausentes = c.ausentes.includes(v) ? c.ausentes.filter((x) => x !== v) : [...c.ausentes, v]; render(); },
  'cap-hora': (el) => { state.ui.cap.termino = el.dataset.v; render(); },
  'cap-motivo': (el) => { const c = state.ui.cap; c.resultado = { tipo: 'nose', motivo: el.dataset.v }; c.paso = 'hecho'; render(); },
  'cap-foto': () => toast('Abre la cámara del teléfono', 'Las fotos suben atadas a la OT y la fecha.'),
};
Object.assign(ACCIONES, ACCIONES_OFI);
function agregarNoPlanificada() {
  const nv = state.ui.nueva, ot = OTS_DISPONIBLES.find((o) => String(o.id) === nv.otId);
  const [dir, barrio] = ot.titulo.replace(/^OT \d+ · /, '').split(', '), id = 'n' + Date.now(), fr = Number(nv.fraccion);
  const base = T({ id, fecha: state.fecha, cuadrilla: Number(nv.cuadrilla), agregada: true, sugeridos: [13, 16, 21, 22],
    obras: [O({ id: id + 'a', ot: ot.id, direccion: dir, barrio, tipo: ot.tipo, fraccion: fr, noPlanificada: true,
      desde: { v: '08:00', ...ev('plan', 'Sin plan') }, hasta: { v: { 0.25: '10:00', 0.5: '12:00', 0.75: '15:00', 1: '17:00' }[fr], ...ev('plan', 'Por la fracción') }, fletes: { v: 1, ...ev('plan', 'Regla vigente: 1') } })], diffs: [] });
  DATOS[state.fecha].push(base);
  const t = clon(base); t.estado = 'pendiente'; t.obs = ''; t.incidencia = { tipo: '', desc: '' }; t.obras[0].fotos = []; t.grupo = 'sinDatos'; t.intentos = 0;
  state.tarjetas[id] = t; state.ui.dialogo = null; state.ui.abierta = id; state.ui.foco = id;
  if (esMovil()) state.ui.idxMovil = ordenDelDia(state.fecha).findIndex((x) => x.id === id);
  render(); toast('Jornada agregada', 'Completá lo mínimo: a cargo, quiénes fueron y horario.');
}

document.addEventListener('click', (ev) => { const el = ev.target.closest('[data-accion]'); if (!el || el.disabled) return; const fn = ACCIONES[el.dataset.accion]; if (fn) { ev.preventDefault(); fn(el, ev); } });
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-form]'); if (!f) return; ev.preventDefault();
  if (f.dataset.form === 'nota' && state.ui.nuevaNota.trim()) { (state.notas[state.fecha] = state.notas[state.fecha] || []).push({ texto: state.ui.nuevaNota.trim(), quien: 'Vos', hora: 'recién' }); state.ui.nuevaNota = ''; render(); toast('Nota anotada', 'También se ve en el tablero.'); }
  if (f.dataset.form === 'nueva' && state.ui.nueva.otId && state.ui.nueva.cuadrilla) agregarNoPlanificada();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.capDni) { const c = capDe(el); c.dni = el.value.replace(/\D/g, '').slice(0, 8); el.value = c.dni; actualizarBotonFirma(c); return; }
  if (el.dataset.capTexto) { const c = capDe(el); c.voz[el.dataset.capTexto] = el.value; render(); return; }
  if (el.dataset.ui) { state.ui[el.dataset.ui] = el.value; render(); return; }
  if (el.dataset.busca !== undefined) { state.ui.busca[el.dataset.busca] = el.value; render(); return; }
  if (el.dataset.nueva) { state.ui.nueva[el.dataset.nueva] = el.value; render(); return; }
  if (el.dataset.asbuilt) { state.ui.cierreTexto[Number(el.dataset.asbuilt)] = el.value; render(); return; }
  if (el.dataset.campo && el.dataset.t && el.type !== 'checkbox') {
    const t = tarjeta(el.dataset.t), ks = el.dataset.campo.split('.');
    let v = el.value; if (el.dataset.campo === 'costoFlete') v = v.replace(/[^\d.]/g, '');
    if (ks.length === 2) t[ks[0]][ks[1]] = v; else t[ks[0]] = v;
    editado(t.id); render();
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.capSenal) { state.ui.cap.sinSenal = el.checked; render(); return; }
  if (el.dataset.capMed) { const c = capDe(el), n = parseFloat(el.value.replace(',', '.')); if (Number.isFinite(n) && n >= 0) { c.medidas[el.dataset.capMed] = Math.round(n * 10) / 10; c.medidasCambio = true; c.rangoOk = false; } render(); return; }
  if (el.type === 'checkbox' && el.dataset.campo) { const t = tarjeta(el.dataset.t); t[el.dataset.campo] = el.checked; editado(t.id); render(); return; }
  if (el.dataset.hora) { const t = tarjeta(el.dataset.t), o = obraDe(t, el.dataset.o), d = parseHora(el.value); if (d != null) { o[el.dataset.hora] = { v: fmtHora(d), nivel: 'corregido', det: 'Cargado a mano' }; if (t.grupo === 'sinDatos') t.horarioConfirmado = true; editado(t.id); } render(); return; }
  if (el.dataset.foto) { const t = tarjeta(el.dataset.t); obraDe(t, el.dataset.o).fotos.find((f) => f.id === el.dataset.foto).momento = el.value; editado(t.id); render(); return; }
  if (el.dataset.fotos) { const t = tarjeta(el.dataset.t), o = obraDe(t, el.dataset.o); for (const file of Array.from(el.files || [])) o.fotos.push({ id: `${o.id}-u${Date.now()}${Math.random()}`, momento: 'final', hora: 'subida', src: URL.createObjectURL(file), incluida: true }); editado(t.id); render(); }
});

/* ═══ 8. TECLADO Y SWIPE ═══ */
document.addEventListener('keydown', (ev) => {
  const tgt = ev.target, enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(tgt.tagName);
  if (ev.key === 'Escape') {
    if (state.ui.ayuda || state.ui.dialogo || state.ui.capOfi) { state.ui.ayuda = false; state.ui.dialogo = null; state.ui.capOfi = null; render(); return; }
    if (enCampo) { tgt.blur(); return; }
    if (state.ui.abierta) { state.ui.abierta = null; render(); }
    return;
  }
  if (enCampo || ev.metaKey || ev.ctrlKey || ev.altKey || state.ui.dialogo || state.ui.capOfi) return;
  if ((ev.key === 'Enter' || ev.key === ' ') && tgt.tagName === 'BUTTON') return; // el botón con foco hace lo suyo
  if (ev.key === '?') { state.ui.ayuda = !state.ui.ayuda; render(); return; }
  if (state.ui.ayuda || state.tab !== 'confirmar') return;
  const orden = ordenDelDia(state.fecha);
  const diaConDeuda = (dir) => { const ds = SEMANA.filter((d) => d.iso !== 'viejas'); let i = ds.findIndex((d) => d.iso === state.fecha) + dir; while (ds[i] && !deudaDe(ds[i].iso)) i += dir; if (ds[i]) irADia(ds[i].iso); };
  if (ev.key === '[') return diaConDeuda(-1);
  if (ev.key === ']') return diaConDeuda(1);
  if (esMovil()) {
    const t = orden[state.ui.idxMovil];
    if (ev.key === 'ArrowRight' || ev.key === 'j') irTarjeta(state.ui.idxMovil + 1);
    if (ev.key === 'ArrowLeft' || ev.key === 'k') irTarjeta(state.ui.idxMovil - 1);
    if (t && ev.key === 'Enter') { if (confirmar(t.id)) render(); }
    return;
  }
  const i = orden.findIndex((t) => t.id === state.ui.foco), foco = tarjeta(state.ui.foco);
  const mover = (d) => { const n = orden[Math.max(0, Math.min(orden.length - 1, (i < 0 ? -d : i) + d))]; if (!n) return; state.ui.foco = n.id; if (state.ui.abierta) state.ui.abierta = n.id; render(); const el = document.querySelector(`[data-id="${n.id}"]`); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  switch (ev.key) {
    case 'j': case 'ArrowDown': ev.preventDefault(); mover(1); break;
    case 'k': case 'ArrowUp': ev.preventDefault(); mover(-1); break;
    case 'Enter':
      ev.preventDefault();
      if (ev.shiftKey) { confirmarLote(); break; }
      if (!foco) break;
      // Con anomalía, el primer Enter avisa y el segundo confirma ("Confirmar igual").
      if (anomaliasDe(foco).length && !state.ui.ack[foco.id] && foco.estado === 'pendiente') { state.ui.ack[foco.id] = true; state.ui.abierta = foco.id; render(); toast('Tiene una anomalía', 'Enter de nuevo para confirmar igual.'); break; }
      if (confirmar(foco.id)) render();
      break;
    case 'e': case ' ': if (foco) { ev.preventDefault(); state.ui.abierta = state.ui.abierta === foco.id ? null : foco.id; render(); } break;
    case 'n': if (foco && foco.estado === 'pendiente') noSeHizo(foco.id); break;
    case 'd': if (foco && foco.estado === 'pendiente') abrirFalta(foco.id); break;
    case 'f': if (foco) { state.ui.mas[foco.id] = true; state.ui.abierta = foco.id; render(); } break;
    case '1': case '2': if (foco) { const di = foco.diffs.findIndex((d) => d.elegido == null); const d = foco.diffs[di >= 0 ? di : 0]; if (d) { d.elegido = Number(ev.key) - 1; aplicarDiff(foco, d.opciones[d.elegido]); editado(foco.id); state.ui.abierta = foco.id; render(); } } break;
    case 'z': { const id = state.ui.deshacerPila[state.ui.deshacerPila.length - 1]; if (id) deshacer(id); break; }
    default: break;
  }
});
let arrastre = null;
document.addEventListener('pointerdown', (ev) => { const w = ev.target.closest('[data-swipe]'); if (!w || ev.target.closest('input, textarea, select, button, label, .fotos')) return; arrastre = { x: ev.clientX, y: ev.clientY, el: w.querySelector('.tarjeta'), dx: 0, activo: false }; });
document.addEventListener('pointermove', (ev) => {
  if (!arrastre) return; const dx = ev.clientX - arrastre.x, dy = ev.clientY - arrastre.y;
  if (!arrastre.activo && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.4) { arrastre.activo = true; arrastre.el.classList.add('arrastrando'); }
  if (arrastre.activo) { arrastre.dx = dx; arrastre.el.style.transform = `translateX(${dx}px) rotate(${dx / 60}deg)`; arrastre.el.style.opacity = String(1 - Math.min(.5, Math.abs(dx) / 500)); }
});
document.addEventListener('pointerup', () => {
  if (!arrastre) return; const { dx, el, activo } = arrastre; arrastre = null; if (!activo) return;
  el.classList.remove('arrastrando'); el.style.transform = ''; el.style.opacity = '';
  // Deslizar sólo navega: nunca confirma (un gesto accidental no puede escribir costo).
  if (dx < -70) irTarjeta(state.ui.idxMovil + 1, 'entra-der'); else if (dx > 70) irTarjeta(state.ui.idxMovil - 1, 'entra-izq');
});
document.addEventListener('pointercancel', () => { if (arrastre && arrastre.el) { arrastre.el.style.transform = ''; arrastre.el.style.opacity = ''; } arrastre = null; });
mqAngosto.addEventListener('change', render);

/* ── Arranque: abre en el día más viejo con deuda (no en "ayer": hoy es lunes y ayer fue domingo) ── */
function arrancar() {
  state.ui.cap = capNuevo(ctxEscenario('normal'));
  const viejo = diaMasViejoConDeuda();
  diaApertura = viejo ? viejo.iso : '2026-10-17';
  irADia(diaApertura);
}
initTarjetas();
arrancar();
</script>
