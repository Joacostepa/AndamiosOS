<title>Módulo Sistemas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de maqueta arriba + la app de AndamiosOS enmarcada (riel oscuro de íconos, header de 56 px, contenido).
   Los tokens copian los de src/app/globals.css: neutros sin tinte y el coral ABA como primario. */
:root{
  --bg: oklch(0.985 0 0);
  --fg: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --muted: oklch(0.96 0 0);
  --muted-fg: oklch(0.5 0 0);
  --border: oklch(0.9 0 0);
  --accent: oklch(0.96 0.02 42);
  --primary: oklch(0.62 0.16 42);
  --primary-btn: oklch(0.55 0.16 42);
  --on-primary: #fff;
  --sb: oklch(0.17 0 0);
  --sb-fg: oklch(0.9 0 0);
  --sb-muted: oklch(0.62 0 0);
  --sb-accent: oklch(0.24 0 0);
  --sb-border: oklch(0.26 0 0);
  --err: oklch(0.55 0.2 27);
  --err-bg: oklch(0.95 0.035 27);
  --cor: oklch(0.55 0.13 70);
  --cor-bg: oklch(0.95 0.05 85);
  --mej: oklch(0.5 0.12 150);
  --mej-bg: oklch(0.95 0.04 150);
  --info: oklch(0.5 0.12 250);
  --info-bg: oklch(0.95 0.03 250);
  --page: oklch(0.93 0.008 42);
  --bezel: oklch(0.2 0 0);
  --map1: oklch(0.93 0.01 140);
  --map2: oklch(0.89 0.01 230);
  --dim: rgb(0 0 0 / 0.58);
  --shadow: 0 12px 32px -10px rgb(0 0 0 / 0.25), 0 2px 6px rgb(0 0 0 / 0.06);
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 0.5rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: oklch(0.13 0 0); --fg: oklch(0.93 0 0); --card: oklch(0.2 0 0); --muted: oklch(0.25 0 0);
    --muted-fg: oklch(0.68 0 0); --border: oklch(1 0 0 / 0.1); --accent: oklch(0.26 0.03 42);
    --sb: oklch(0.15 0 0); --sb-accent: oklch(0.21 0 0); --sb-border: oklch(1 0 0 / 0.1);
    --err: oklch(0.72 0.17 25); --err-bg: oklch(0.3 0.07 25); --cor: oklch(0.82 0.13 85); --cor-bg: oklch(0.31 0.06 85);
    --mej: oklch(0.77 0.14 150); --mej-bg: oklch(0.29 0.06 150); --info: oklch(0.77 0.1 250); --info-bg: oklch(0.3 0.05 250);
    --page: oklch(0.09 0 0); --bezel: oklch(0.32 0 0); --map1: oklch(0.3 0.01 140); --map2: oklch(0.27 0.015 230);
    --shadow: 0 14px 36px -10px rgb(0 0 0 / 0.7), 0 2px 6px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg: oklch(0.13 0 0); --fg: oklch(0.93 0 0); --card: oklch(0.2 0 0); --muted: oklch(0.25 0 0);
  --muted-fg: oklch(0.68 0 0); --border: oklch(1 0 0 / 0.1); --accent: oklch(0.26 0.03 42);
  --sb: oklch(0.15 0 0); --sb-accent: oklch(0.21 0 0); --sb-border: oklch(1 0 0 / 0.1);
  --err: oklch(0.72 0.17 25); --err-bg: oklch(0.3 0.07 25); --cor: oklch(0.82 0.13 85); --cor-bg: oklch(0.31 0.06 85);
  --mej: oklch(0.77 0.14 150); --mej-bg: oklch(0.29 0.06 150); --info: oklch(0.77 0.1 250); --info-bg: oklch(0.3 0.05 250);
  --page: oklch(0.09 0 0); --bezel: oklch(0.32 0 0); --map1: oklch(0.3 0.01 140); --map2: oklch(0.27 0.015 230);
  --shadow: 0 14px 36px -10px rgb(0 0 0 / 0.7), 0 2px 6px rgb(0 0 0 / 0.4);
  color-scheme: dark;
}

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.lucide{width:16px;height:16px;flex-shrink:0;stroke-width:2}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.flex1{flex:1}

/* ── Barra de la maqueta (fuera de la app) ── */
.bar{display:flex;align-items:center;gap:10px;padding-bottom:10px;overflow-x:auto;scrollbar-width:thin}
.bar-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);white-space:nowrap;padding-right:4px}
.bar-tag b{color:var(--fg);font-weight:500}
.scn{display:flex;gap:4px;flex-shrink:0}
.scn button,.seg-mini button{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.scn button:hover{border-color:var(--primary)}
.scn button .n{font-family:var(--mono);font-size:10.5px;color:var(--muted-fg)}
.seg-mini{display:flex;flex-shrink:0;border-radius:999px}
.seg-mini button{border-radius:0}
.seg-mini button:first-child{border-radius:999px 0 0 999px}
.seg-mini button:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.seg-mini button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar .sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.tg-phone.on{background:var(--fg)!important;color:var(--bg);border-color:var(--fg)!important}
@media (max-width:620px){.tg-phone{display:none!important}}

/* ── Escenario y app ── */
.stage{flex:1;min-height:560px;display:flex;justify-content:center}
.app{container:app / inline-size;position:relative;width:100%;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;isolation:isolate}
.stage.phone .app{width:390px;max-width:100%;height:min(820px,100%);border:10px solid var(--bezel);border-radius:38px}
.app.flash::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:flash .45s ease-out;pointer-events:none;z-index:200}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.app.flash::after{animation:none}}

.shell{position:absolute;inset:0;display:flex}
.sidebar{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--sb);color:var(--sb-fg);z-index:20;overflow:hidden;transition:width .15s ease;display:flex;flex-direction:column;border-right:1px solid var(--sb-border)}
.sidebar:hover{width:248px;box-shadow:var(--shadow)}
.sb-logo{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px;flex-shrink:0;white-space:nowrap}
.sb-a{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.sb-name{font-weight:700;font-size:15px}
.sb-name b{color:var(--primary)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px 16px;scrollbar-width:none}
.sb-gl{font-size:11px;color:var(--sb-muted);padding:12px 8px 4px;white-space:nowrap;opacity:0;height:0;padding-block:0;transition:opacity .1s}
.sidebar:hover .sb-gl{opacity:1;height:auto;padding:12px 8px 4px}
.sb-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--sb-fg);padding:7px 8px;border-radius:6px;font-size:13px;white-space:nowrap;text-align:left;position:relative}
.sb-it:hover{background:var(--sb-accent)}
.sb-it.on{background:var(--sb-accent);color:var(--primary)}
.sb-it.sub{display:none;padding-left:34px;font-size:12.5px}
.sidebar:hover .sb-it.sub{display:flex}
.sb-l{overflow:hidden;text-overflow:ellipsis}
.sb-bdg{margin-left:auto;background:var(--primary);color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.sidebar:not(:hover) .sb-bdg{position:absolute;top:2px;left:22px;min-width:14px;height:14px;font-size:9px;padding:0 3px}
.sb-new{margin-left:6px;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);border:1px solid currentColor;border-radius:4px;padding:0 4px}

.inset{flex:1;min-width:0;margin-left:52px;display:flex;flex-direction:column}
.hd{height:56px;flex-shrink:0;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding:0 14px;background:var(--bg)}
.hd-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.hd-search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);border-radius:var(--r);height:34px;padding:0 10px;color:var(--muted-fg);font-size:13px;min-width:220px}
.hd-search kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:0 4px}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border:0;background:none;border-radius:var(--r);position:relative;flex-shrink:0}
.ib:hover{background:var(--muted)}
.bell .bdg{position:absolute;top:3px;right:3px;background:oklch(0.64 0.21 25);color:#fff;font-size:9.5px;font-weight:700;border-radius:999px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px}
.avatar{width:32px;height:32px;border-radius:999px;border:0;background:var(--muted);font-size:12px;font-weight:600;margin-left:2px;flex-shrink:0}
.hd-rep{gap:7px}
.hd-rep .lucide{color:var(--primary)}
.main{flex:1;overflow:auto;padding:22px 24px 40px}

/* ── Componentes ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);border:1px solid transparent;font-size:13px;font-weight:500;white-space:nowrap;background:none}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.primary{background:var(--primary-btn);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.outline{border-color:var(--border);background:var(--card)}
.btn.outline:hover,.btn.ghost:hover{background:var(--muted)}
.btn.danger{color:var(--err)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip .lucide{width:13px;height:13px}
.t-error{background:var(--err-bg);color:var(--err)}
.t-correccion{background:var(--cor-bg);color:var(--cor)}
.t-mejora{background:var(--mej-bg);color:var(--mej)}
.t-info{background:var(--info-bg);color:var(--info)}
.t-neutral{background:var(--muted);color:var(--muted-fg)}
.t-prim{background:var(--accent);color:var(--primary)}
.card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--r) + 2px)}
.lab{font-size:12px;font-weight:600;color:var(--muted-fg);margin-bottom:6px;display:block}
.hint{font-size:12px;color:var(--muted-fg);margin:6px 0 0}
input.in,textarea.in,select.in{width:100%;border:1px solid var(--border);background:var(--card);border-radius:var(--r);padding:8px 10px;font-size:13.5px}
textarea.in{resize:vertical;min-height:92px;line-height:1.45}
select.in{height:32px;padding:0 8px;font-size:12.5px;width:auto}

/* Encabezado de página */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted-fg);font-size:13.5px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}

/* Tablas */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:calc(var(--r) + 2px);background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted-fg);padding:9px 12px;white-space:nowrap;background:var(--muted)}
.tbl td{padding:9px 12px;border-top:1px solid var(--border);white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--err);font-weight:700}

/* Páginas de ejemplo */
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.obra{padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.obra h4{margin:0;font-size:14.5px}
.obra .cli{font-size:12.5px;color:var(--muted-fg)}
.obra .ln{display:flex;gap:7px;align-items:center;font-size:12.5px}
.obra .ln .lucide{width:14px;height:14px;color:var(--muted-fg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;background:var(--bg)}
.kv span{display:block;font-size:11.5px;color:var(--muted-fg)}
.kv b{font-weight:600}
.spin{width:14px;height:14px;border:2px solid rgb(255 255 255 / .35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.map{position:relative;height:440px;border-radius:calc(var(--r) + 2px);overflow:hidden;border:1px solid var(--border);
  background:linear-gradient(115deg,transparent 46%,var(--map2) 46% 49%,transparent 49%),linear-gradient(25deg,transparent 60%,var(--card) 60% 61.5%,transparent 61.5%),linear-gradient(160deg,transparent 30%,var(--card) 30% 31%,transparent 31%),var(--map1)}
.map.gris{background:var(--muted);display:grid;place-items:center;color:var(--muted-fg)}
.pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--primary);border:2px solid #fff;box-shadow:0 2px 6px rgb(0 0 0 / .3)}
.skel{height:14px;border-radius:6px;background:var(--muted)}
.chatlist{display:flex;flex-direction:column}
.chatlist div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--border)}
.chatlist div:first-child{border-top:0}
.chatlist i.av{width:34px;height:34px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;flex-shrink:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

/* ── Capas: panel, popovers, modales ── */
.layer{position:absolute;inset:0;pointer-events:none;z-index:40}
.layer > *{pointer-events:auto}
.panel{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slin .2s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.pn-hd{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.pn-hd h2{margin:0;font-size:17px;letter-spacing:-.01em}
.pn-hd p{margin:2px 0 0;font-size:12.5px;color:var(--muted-fg)}
.pn-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.pn-mis{align-self:flex-start;font-size:12.5px;color:var(--primary);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.pn-cap{display:flex;flex-direction:column;gap:8px}
.pn-cap .row{display:flex;gap:6px;flex-wrap:wrap}
.pn-empty{border:1.5px dashed var(--border);border-radius:var(--r);padding:16px;font-size:13px;color:var(--muted-fg);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.extras{display:flex;gap:6px;flex-wrap:wrap}
.extras img{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tipo{border:1.5px solid var(--border);background:var(--bg);border-radius:var(--r);padding:10px 9px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.tipo b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.tipo small{font-size:11.5px;color:var(--muted-fg);line-height:1.35}
.tipo:hover{border-color:var(--muted-fg)}
.tipo.on.error{border-color:var(--err);background:var(--err-bg)}
.tipo.on.correccion{border-color:var(--cor);background:var(--cor-bg)}
.tipo.on.mejora{border-color:var(--mej);background:var(--mej-bg)}
.tipo.error b .lucide{color:var(--err)} .tipo.correccion b .lucide{color:var(--cor)} .tipo.mejora b .lucide{color:var(--mej)}
.ta-wrap{position:relative}
.dictar{display:none;position:absolute;right:8px;bottom:8px;gap:5px;align-items:center;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:3px 9px;font-size:12px}
.dup{border:1px solid var(--info);background:var(--info-bg);border-radius:var(--r);padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.dup .it{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.frena{display:flex;flex-direction:column;gap:6px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios button{border:1.5px solid var(--border);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:12.5px}
.radios button.on{border-color:var(--fg);background:var(--fg);color:var(--bg)}
details.ctx{font-size:12.5px;color:var(--muted-fg);border-top:1px solid var(--border);padding-top:10px}
details.ctx summary{cursor:pointer;line-height:1.4}
details.ctx dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0}
details.ctx dt{color:var(--muted-fg)}
details.ctx dd{margin:0;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.pn-ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}

.pop{position:absolute;top:52px;right:12px;width:min(370px,calc(100% - 24px));background:var(--card);border:1px solid var(--border);border-radius:calc(var(--r) + 2px);box-shadow:var(--shadow);overflow:hidden}
.pop-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13.5px}
.pop-hd button{border:0;background:none;color:var(--muted-fg);font-size:12px}
.al{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;font-size:13px}
.al:hover{background:var(--muted)}
.al .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.al small{display:block;color:var(--muted-fg);font-size:11.5px;margin-top:2px}
.al.unread{background:var(--accent)}
.pop-ft{display:block;text-align:center;padding:9px;font-size:12.5px;color:var(--muted-fg)}
.menu{padding:6px}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.menu .who b{display:block}
.menu .who small{color:var(--muted-fg)}
.mi{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:13px;text-align:left}
.mi:hover{background:var(--muted)}
.mi .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-left:auto}

.modal-bg{position:absolute;inset:0;background:var(--dim);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(980px,100%)}
.md-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.md-hd h3{margin:0;font-size:15.5px}
.md-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.md-ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}

function shotOf(r) {
  if (r.shot) return r.shot;
  const p = r.persona ? PERSONAS[r.persona] : otra(r.quien, r.rol);
  const cel = r.device === "celular";
  r.shot = { html: `<div class="shell">${shellInner(p, r.page, r.po || {})}</div>`, w: cel ? 390 : 1280, h: cel ? 760 : 800, scroll: 0, page: r.page };
  return r.shot;
}
function shapeSVG(s) {
  if (s.t === "rect") return `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="6" fill="none" stroke="#e5484d" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
  if (s.t === "tapar") return `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" fill="#111"/>`;
  if (s.t === "pen") return `<polyline points="${s.p.map(q => q.join(",")).join(" ")}" fill="none" stroke="#e5484d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  return "";
}
function shotHTML(sh, shapes = [], cls = "", attrs = "") {
  return `<div class="shot ${cls}" data-w="${sh.w}" data-h="${sh.h}" data-scroll="${sh.scroll || 0}" style="aspect-ratio:${sh.w}/${sh.h}" ${attrs}>
    <div class="shot-inner app" style="width:${sh.w}px;height:${sh.h}px">${sh.html}</div>
    <svg class="marks" viewBox="0 0 ${sh.w} ${sh.h}" preserveAspectRatio="none">${shapes.map(shapeSVG).join("")}</svg></div>`;
}
function fitShots() {
  $$(".shot").forEach(s => {
    const inner = s.firstElementChild, w = +s.dataset.w;
    if (!s.clientWidth) return;
    inner.style.transform = `scale(${s.clientWidth / w})`;
    const m = inner.querySelector(".main");
    if (m && +s.dataset.scroll) m.scrollTop = +s.dataset.scroll;
  });
}

function setupEditor() {
  const E = S.editor, shot = $(".ed-shot"), stage = $("#ed-stage");
  if (!shot) return;
  const P = S.panel, appH = $("#app").clientHeight;
  const maxW = Math.min(stage.clientWidth - 28, Math.max(220, (appH - 190) * P.shot.w / P.shot.h));
  shot.style.width = maxW + "px";
  fitShots();
  const svg = shot.querySelector(".marks");
  const pt = e => { const r = svg.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * P.shot.w), Math.round((e.clientY - r.top) / r.height * P.shot.h)]; };
  const draw = () => { svg.innerHTML = E.shapes.concat(E.cur ? [E.cur] : []).map(shapeSVG).join(""); };
  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId);
    const [x, y] = pt(e);
    E.start = [x, y];
    E.cur = E.tool === "pen" ? { t: "pen", p: [[x, y]] } : { t: E.tool, x, y, w: 0, h: 0 };
    draw();
  });
  svg.addEventListener("pointermove", e => {
    if (!E.cur) return;
    const [x, y] = pt(e);
    if (E.cur.t === "pen") E.cur.p.push([x, y]);
    else { E.cur.x = Math.min(x, E.start[0]); E.cur.y = Math.min(y, E.start[1]); E.cur.w = Math.abs(x - E.start[0]); E.cur.h = Math.abs(y - E.start[1]); }
    draw();
  });
  const fin = () => { if (!E.cur) return; if (E.cur.t === "pen" ? E.cur.p.length > 1 : E.cur.w > 4 && E.cur.h > 4) E.shapes.push(E.cur); E.cur = null; draw(); };
  svg.addEventListener("pointerup", fin);
  svg.addEventListener("pointercancel", fin);
}

function posTour() {
  if (!S.tour || !S.tour.paso) return;
  const L = $("#tour"), app = $("#app"), A = app.getBoundingClientRect(), W = A.width, H = A.height;
  const el = $$(`[data-tour="${PASOS[S.tour.paso].t}"]`, app).find(e => !e.closest(".shot"));
  const tp = $(".tp", L); if (!tp) return;
  let x = 0, y = 0, w = 0, h = 0;
  if (el) { const r = el.getBoundingClientRect(), pad = 6; x = r.left - A.left - pad; y = r.top - A.top - pad; w = r.width + pad * 2; h = r.height + pad * 2; }
  else { x = W / 2; y = H / 2; }
  const set = (d, l, t, ww, hh) => { const e = $(`[data-d="${d}"]`, L); Object.assign(e.style, { left: l + "px", top: t + "px", width: Math.max(0, ww) + "px", height: Math.max(0, hh) + "px" }); };
  set("t", 0, 0, W, y); set("b", 0, y + h, W, H - y - h); set("l", 0, y, x, h); set("r", x + w, y, W - x - w, h);
  Object.assign($(".ring", L).style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", display: el ? "block" : "none" });
  const pw = tp.offsetWidth, phh = tp.offsetHeight;
  let top = y + h + 12 + phh < H ? y + h + 12 : y - phh - 12 > 0 ? y - phh - 12 : Math.max(12, H - phh - 12);
  let left = Math.min(Math.max(12, x + w / 2 - pw / 2), W - pw - 12);
  if (w > W * 0.6 && top === Math.max(12, H - phh - 12)) left = Math.min(Math.max(12, x - pw - 12), W - pw - 12);

}

  },
  ok(el) { const r = rep(+el.dataset.id); r.cerradoOk = true; r.chat.push({ de: "u", txt: "Ya está, gracias." }); render(); toast("¡Gracias por confirmar!"); },
  sigue(el) { const r = rep(+el.dataset.id); r.estado = "visto"; r.nuevaResp = true; r.chat.push({ de: "u", txt: "Sigue pasando." }); render(); toast(`Lo reabrimos y le avisamos a ${REVISOR}.`); },
  "mr-resp"(el) { const r = rep(+el.dataset.id), t = $("#mr-" + r.id), v = t.value.trim(); if (!v) return t.focus(); r.chat.push({ de: "u", txt: v }); r.nuevaResp = true; r.esperando = false; render(); toast("Enviado.", `${REVISOR} lo ve en la bandeja.`); },
  "cerrar-modal"() { S.modal = null; render(); },
  "tour-next"() {
    const k = S.tour.paso;
    if (k === 5) return terminarTour();
    S.tour.paso++; guardarTour();
    if (k === 1) return abrirPanel();
    if (k === 4) { S.panel = null; return render(); }
    renderTour();
  },
  "tour-reiniciar"() { empezarTour(0); },
  persona(el) { if (S.tour) S.tour = null; S.persona = el.dataset.p; S.panel = null; S.pop = null; S.modal = null; if (S.page === "sistemas" && !per().admin) S.page = "hoja"; render(); },
  phone() { S.phone = !S.phone; render(); setTimeout(() => { fitShots(); if (S.editor) setupEditor(); }, 50); },
  scn(el) {
    const s = el.dataset.s;
    if (s === "tour") return empezarTour(0);
    S.tour = null; renderTour(); S.panel = null; S.modal = null; S.pop = null; S.editor = null;
    if (s === "rep") { S.persona = "marcos"; ir("stock"); setTimeout(() => ACT.reportar(), 60); }
    if (s === "mis") { S.persona = "marcos"; ir("mis"); }
    if (s === "band") { S.persona = "js"; S.bandeja.tab = "nuevo"; S.bandeja.sel = 142; ir("sistemas"); }
    if (s === "nov") ir("novedades");
  },
};
function avisar(r, txt, i = "message-circle", c = "t-prim") {
  if (r.persona && S.alerts[r.persona]) S.alerts[r.persona].unshift({ id: "a" + Date.now() + Math.random(), ic: i, c, txt, hace: "recién", ir: "mis" });
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || (el.closest(".shot") && el.dataset.act !== "marcar")) {
    if (S.pop && !e.target.closest(".pop")) { S.pop = null; render(); }
    return;
  }
  if (el.tagName === "A") e.preventDefault();
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener("input", e => {
  if (e.target.id === "pn-txt" && S.panel) { S.panel.texto = e.target.value; updatePanelBits(); }
  if (e.target.id === "bd-q") { S.bandeja.q = e.target.value; S.bandeja.sel = null; render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "pn-file" && S.panel) {
    [...t.files].slice(0, 4).forEach(f => { const rd = new FileReader(); rd.onload = () => { S.panel.extras.push(rd.result); render(); }; rd.readAsDataURL(f); });
  }
  if (t.id === "sel-prio") { rep(+t.dataset.id).prio = t.value; render(); }
  if (t.id === "sel-asig") { const r = rep(+t.dataset.id); r.asig = t.value; render(); if (t.value !== "Joaquín") toast(`#${r.id} pasó a ${t.value}.`, "Le llega a su campanita."); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || S.tour) return;
  if (S.editor) S.editor = null; else if (S.modal) S.modal = null; else if (S.pop) S.pop = null; else if (S.panel) S.panel = null; else return;
  render();
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { fitShots(); if (S.editor) setupEditor(); }, 80); });

/* Arranque: como en la app real, el recorrido aparece al entrar hasta que se completa, y retoma donde quedó si se recarga. */
const guardado = store.get("sis-recorrido-v2");
render();
if (!guardado || !guardado.hecho) empezarTour(guardado && guardado.paso ? Math.min(guardado.paso, 4) : 0);
requestAnimationFrame(tourLoop);
</script>
