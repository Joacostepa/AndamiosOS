<title>Bandeja de clientes ABA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════
   Maqueta del CRM con asistente virtual de WhatsApp (docs/sofia/crm-propuesta.md §14).
   Tokens espejo de src/app/globals.css: coral ABA hue 42, grises neutros, sidebar oscuro,
   semánticos de la hoja del día (verde / ámbar / rojo). Todo color pasa por un token.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  --bg: oklch(0.945 0.004 90);
  --app: oklch(0.985 0 0);
  --card: oklch(1 0 0);
  --card2: oklch(0.975 0 0);
  --hover: oklch(0.965 0 0);
  --fg: oklch(0.145 0 0);
  --muted: oklch(0.5 0 0);
  --border: oklch(0.9 0 0);
  --border-strong: oklch(0.82 0 0);
  --coral: oklch(0.62 0.16 42);
  --coral-btn: oklch(0.55 0.16 42);
  --coral-btn-hover: oklch(0.5 0.16 42);
  --on-coral: oklch(1 0 0);
  --on-fuerte: oklch(1 0 0);
  --coral-bg: oklch(0.95 0.03 42);
  --coral-text: oklch(0.45 0.13 38);
  --neutro-bg: oklch(0.95 0.005 90);
  --neutro-text: oklch(0.42 0.005 90);
  --bien: oklch(0.45 0.12 140);
  --bien-bg: oklch(0.95 0.04 140);
  --aten: oklch(0.47 0.1 60);
  --aten-bg: oklch(0.95 0.05 80);
  --aten-borde: oklch(0.75 0.14 70);
  --mal: oklch(0.52 0.2 28);
  --mal-bg: oklch(0.96 0.03 28);
  --sb: oklch(0.17 0 0);
  --sb-fg: oklch(0.9 0 0);
  --sb-mut: oklch(0.62 0 0);
  --sb-acc: oklch(0.24 0 0);
  --marco: oklch(0.2 0 0);
  --wa-bg: oklch(0.94 0.012 85);
  --wa-in: oklch(1 0 0);
  --wa-out: oklch(0.93 0.07 145);
  --wa-head: oklch(0.98 0 0);
  --wa-verde: oklch(0.5 0.12 155);
  --wa-link: oklch(0.5 0.1 230);
  --tg: oklch(0.55 0.12 235);
  --tg-bg: oklch(0.95 0.03 235);
  --sombra-1: 0 1px 2px oklch(0 0 0 / 6%);
  --sombra-2: 0 8px 28px -10px oklch(0 0 0 / 22%), 0 1px 3px oklch(0 0 0 / 6%);
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.11 0 0); --app: oklch(0.145 0 0); --card: oklch(0.2 0 0); --card2: oklch(0.17 0 0); --hover: oklch(0.235 0 0);
    --fg: oklch(0.93 0 0); --muted: oklch(0.68 0 0); --border: oklch(1 0 0 / 10%); --border-strong: oklch(1 0 0 / 18%);
    --coral: oklch(0.68 0.15 45); --coral-btn: oklch(0.6 0.15 42); --coral-btn-hover: oklch(0.65 0.15 42); --on-coral: oklch(0.99 0 0); --on-fuerte: oklch(0.16 0 0);
    --coral-bg: oklch(0.28 0.05 42); --coral-text: oklch(0.85 0.08 42);
    --neutro-bg: oklch(0.26 0.006 90); --neutro-text: oklch(0.85 0.008 90);
    --bien: oklch(0.75 0.15 140); --bien-bg: oklch(0.27 0.04 140);
    --aten: oklch(0.82 0.13 75); --aten-bg: oklch(0.28 0.05 75); --aten-borde: oklch(0.6 0.1 70);
    --mal: oklch(0.72 0.17 28); --mal-bg: oklch(0.27 0.06 28);
    --sb: oklch(0.13 0 0); --sb-acc: oklch(0.21 0 0);
    --marco: oklch(0.05 0 0);
    --wa-bg: oklch(0.19 0.01 200); --wa-in: oklch(0.26 0.01 200); --wa-out: oklch(0.36 0.06 165); --wa-head: oklch(0.22 0.01 200);
    --wa-verde: oklch(0.72 0.14 155); --wa-link: oklch(0.75 0.1 230);
    --tg: oklch(0.75 0.1 235); --tg-bg: oklch(0.27 0.04 235);
    --sombra-1: 0 1px 2px oklch(0 0 0 / 40%); --sombra-2: 0 10px 30px -10px oklch(0 0 0 / 70%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.11 0 0); --app: oklch(0.145 0 0); --card: oklch(0.2 0 0); --card2: oklch(0.17 0 0); --hover: oklch(0.235 0 0);
  --fg: oklch(0.93 0 0); --muted: oklch(0.68 0 0); --border: oklch(1 0 0 / 10%); --border-strong: oklch(1 0 0 / 18%);
  --coral: oklch(0.68 0.15 45); --coral-btn: oklch(0.6 0.15 42); --coral-btn-hover: oklch(0.65 0.15 42); --on-coral: oklch(0.99 0 0); --on-fuerte: oklch(0.16 0 0);
  --coral-bg: oklch(0.28 0.05 42); --coral-text: oklch(0.85 0.08 42);
  --neutro-bg: oklch(0.26 0.006 90); --neutro-text: oklch(0.85 0.008 90);
  --bien: oklch(0.75 0.15 140); --bien-bg: oklch(0.27 0.04 140);
  --aten: oklch(0.82 0.13 75); --aten-bg: oklch(0.28 0.05 75); --aten-borde: oklch(0.6 0.1 70);
  --mal: oklch(0.72 0.17 28); --mal-bg: oklch(0.27 0.06 28);
  --sb: oklch(0.13 0 0); --sb-acc: oklch(0.21 0 0);
  --marco: oklch(0.05 0 0);
  --wa-bg: oklch(0.19 0.01 200); --wa-in: oklch(0.26 0.01 200); --wa-out: oklch(0.36 0.06 165); --wa-head: oklch(0.22 0.01 200);
  --wa-verde: oklch(0.72 0.14 155); --wa-link: oklch(0.75 0.1 230);
  --tg: oklch(0.75 0.1 235); --tg-bg: oklch(0.27 0.04 235);
  --sombra-1: 0 1px 2px oklch(0 0 0 / 40%); --sombra-2: 0 10px 30px -10px oklch(0 0 0 / 70%);
  color-scheme: dark;
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg);
  font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 max(12px, env(safe-area-inset-bottom, 0px));
  overflow-x: hidden; overflow-y: auto;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: .9em; font-variant-numeric: tabular-nums; }
.num, td, .cifra, .pill, .chip { font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
.ico { display: inline-block; vertical-align: -0.2em; flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Botones y piezas comunes ─────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--card); font-weight: 500; font-size: 13px; white-space: nowrap; transition: background .12s, transform .08s; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.prim { background: var(--coral-btn); border-color: var(--coral-btn); color: var(--on-coral); font-weight: 600; }
.btn.prim:hover:not(:disabled) { background: var(--coral-btn-hover); }
.btn.fant { border-color: transparent; background: transparent; }
.btn.fant:hover:not(:disabled) { background: var(--hover); }
.btn.chico { min-height: 28px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.btn.icono { width: 36px; padding: 0; }
.btn.peligro { color: var(--mal); }
.pulso { animation: pulso 1.4s ease-out 2; }
@keyframes pulso { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--coral) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--neutro-bg); color: var(--neutro-text); font-weight: 500; white-space: nowrap; }
.chip.coral { background: var(--coral-bg); color: var(--coral-text); }
.chip.aten { background: var(--aten-bg); color: var(--aten); }
.chip.bien { background: var(--bien-bg); color: var(--bien); }
.chip.mal { background: var(--mal-bg); color: var(--mal); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill i { font-style: normal; width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; background: var(--coral-btn); color: var(--on-coral); flex-shrink: 0; }
.pill.gris { background: var(--neutro-bg); color: var(--neutro-text); }
.pill.ambar { background: var(--aten-bg); color: var(--aten); }
.pill.coral { background: var(--coral-bg); color: var(--coral-text); }
.pill.rojo { background: var(--mal-bg); color: var(--mal); }
.pill.suave { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; background: var(--card); flex-shrink: 0; max-width: 100%; }
.seg button { padding: 5px 9px; color: var(--muted); font-size: 12px; white-space: nowrap; min-height: 30px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
select, .input { height: 32px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--card); min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.4; }
.input:focus, select:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 20%, transparent); }

/* ── Barra de la maqueta (sticky) ─────────────────────────────────────── */
#barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); padding: 8px 0 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.b1, .b2 { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; }
.marca { font-weight: 600; color: var(--fg); display: flex; gap: 7px; align-items: center; min-width: 0; font-size: 13px; }
.marca i { width: 9px; height: 9px; border-radius: 2px; background: var(--coral); display: inline-block; flex-shrink: 0; }
.chip-ej { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px dashed var(--border-strong); color: var(--muted); }
.b-der { margin-left: auto; display: flex; gap: 6px; }
.ctl { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.ctl > span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
#sel-esc { max-width: 100%; min-width: 0; flex: 1 1 auto; }
.ctl-esc { flex: 1 1 260px; }
.solo-angosto { display: none !important; }
@media (max-width: 999px) {
  .solo-angosto { display: inline-flex !important; } .solo-ancho { display: none !important; }
  .b1 { display: none; }
  .ctl-esc { flex-basis: 100%; }
}

/* ── Guion ───────────────────────────────────────────────────────────── */
#guion { margin: 10px 0; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--coral); border-radius: 8px; padding: 10px 12px; box-shadow: var(--sombra-1); }
.g-txt { flex: 1 1 320px; min-width: 0; }
.g-cab { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.g-cab b { font-size: 13.5px; }
.g-cab .mono { color: var(--muted); font-size: 11.5px; }
#g-sub { font-size: 12px; color: var(--muted); }
#g-narr { margin-top: 3px; font-size: 13.5px; text-wrap: pretty; }
.g-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.g-btns .btn { min-height: 38px; }

/* ── Escenario: cliente | app ────────────────────────────────────────── */
#stage { flex: 1 1 auto; min-height: 460px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { #stage { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); } }
#pane-cli, #pane-app { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.pane-lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.pane-lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-lbl i { width: 7px; height: 7px; border-radius: 50%; background: var(--wa-verde); flex-shrink: 0; }
.pane-lbl i.c { background: var(--coral); }

/* ── WhatsApp del cliente ────────────────────────────────────────────── */
.tel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--wa-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.tel.marco { border: 10px solid var(--marco); border-radius: 40px; box-shadow: var(--sombra-2); max-height: 820px; }
.tel-status { display: flex; justify-content: space-between; padding: 6px 20px 2px; font-size: 11.5px; background: var(--wa-head); color: var(--muted); }
.wa-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--wa-head); border-bottom: 1px solid var(--border); }
.wa-av { width: 34px; height: 34px; border-radius: 50%; background: var(--coral-btn); color: var(--on-coral); display: grid; place-items: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
.wa-t { display: flex; flex-direction: column; min-width: 0; }
.wa-t b { font-size: 14px; display: flex; gap: 5px; align-items: center; }
.wa-t small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-ok { color: var(--wa-verde); }
.wa-chat { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.wa-vacio { margin: auto; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
.wa-b { max-width: 86%; padding: 6px 9px 4px; border-radius: 9px; font-size: 13.5px; line-height: 1.4; box-shadow: 0 1px 1px oklch(0 0 0 / 8%); overflow-wrap: anywhere; animation: entra .18s ease-out; }
.wa-b.in { align-self: flex-start; background: var(--wa-in); border-top-left-radius: 2px; }
.wa-b.out { align-self: flex-end; background: var(--wa-out); border-top-right-radius: 2px; }
.wa-b .h { display: block; text-align: right; font-size: 10.5px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
.wa-b .ley { display: block; font-size: 11.5px; color: var(--muted); font-style: italic; margin-top: 4px; }
.wa-b .pie { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.wa-b .tpl { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.wa-btns { align-self: flex-start; display: flex; flex-direction: column; gap: 4px; width: min(86%, 300px); margin-top: -2px; }
.wa-btns button { background: var(--wa-in); color: var(--wa-link); border-radius: 9px; padding: 8px; font-weight: 600; font-size: 13.5px; box-shadow: 0 1px 1px oklch(0 0 0 / 8%); min-height: 38px; }
.wa-btns button[aria-pressed="true"] { color: var(--muted); }
.wa-btns button:disabled { opacity: .6; cursor: default; }
.wa-dia { align-self: center; font-size: 11px; color: var(--muted); background: var(--wa-in); padding: 2px 10px; border-radius: 6px; margin: 4px 0; }
.tipeo { display: inline-flex; gap: 3px; padding: 10px 12px; }
.tipeo span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: tipeo 1s infinite; }
.tipeo span:nth-child(2) { animation-delay: .15s; } .tipeo span:nth-child(3) { animation-delay: .3s; }
@keyframes tipeo { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
@keyframes entra { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.pdf { display: flex; gap: 8px; align-items: center; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 6px; padding: 7px 8px; margin: 2px 0 2px; min-width: 0; }
.pdf-ic { width: 30px; height: 36px; border-radius: 3px; background: var(--mal); color: var(--on-fuerte); font-size: 9px; font-weight: 700; display: grid; place-items: end center; padding-bottom: 4px; flex-shrink: 0; }
.pdf b { display: block; font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.pdf small { font-size: 11px; color: var(--muted); }
.wa-comp { display: flex; gap: 6px; padding: 8px; background: var(--wa-head); border-top: 1px solid var(--border); }
.wa-comp input { flex: 1; min-width: 0; height: 40px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); padding: 0 14px; font-size: 14px; }
.wa-comp input:focus { outline: none; border-color: var(--wa-verde); }
.wa-send { width: 40px; height: 40px; border-radius: 50%; background: var(--wa-verde); color: var(--on-fuerte); display: grid; place-items: center; flex-shrink: 0; }

/* ── App AndamiosOS ──────────────────────────────────────────────────── */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); background: var(--app); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.app.con-rail { grid-template-columns: 56px minmax(0, 1fr); }
.rail { background: var(--sb); color: var(--sb-fg); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
.rail .logo { width: 30px; height: 30px; border-radius: 7px; background: var(--coral-btn); color: var(--on-coral); display: grid; place-items: center; font-weight: 700; font-size: 12px; margin-bottom: 8px; }
.rail span { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--sb-mut); }
.rail span.act { background: var(--sb-acc); color: var(--sb-fg); box-shadow: inset 2px 0 0 var(--coral); }
.app-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.enc { flex: none; padding: 10px 14px 0; border-bottom: 1px solid var(--border); background: var(--app); }
.enc-f1 { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.miga { font-size: 11.5px; color: var(--muted); }
.enc h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.enc-der { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.yo { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; }
.yo i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: var(--coral-bg); color: var(--coral-text); display: grid; place-items: center; font-size: 11px; }
.tabs { display: flex; gap: 2px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { padding: 7px 10px 8px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; font-size: 13px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--coral); }
.tabs .n { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--coral-bg); color: var(--coral-text); font-weight: 600; }
.tabs .js { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.banda-pausa { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 14px; background: var(--aten-bg); color: var(--aten); border-bottom: 1px solid var(--aten-borde); font-size: 12.5px; font-weight: 600; }
.banda-pausa .btn { margin-left: auto; }
.cuerpo { flex: 1; min-height: 0; overflow-y: auto; }
.cuerpo.es-charlas { overflow: hidden; display: flex; }
.vacio { padding: 40px 20px; text-align: center; color: var(--muted); }

/* Charlas: lista + detalle */

function cotBandeja(ml, pml = T.ml) {
  const fact = Math.max(ml, T.minMl);

  return { ml, fact, pml, base, iva: Math.round(base * T.iva), total: Math.round(base * (1 + T.iva)), renov: Math.round(base * T.renov),

}

const carrilDe = (c, k = {}) => c.consent && !k.empresa ? 'rápido' : k.empresa ? 'a medida' : 'a medida (falta el sí)';
function noMandar(cid, actor = S.mira) {

async function aplicarCorreccion(cid) {
  const c = S.convs[cid];
  const k = c.tarjeta;
  if (!k || !k.ui.motivo) return;
  const mo = k.ui.motivo;
  if (mo === 'metros') {
    const ml = Number(String(k.ui.ml).replace(',', '.'));
    if (!(ml > 0 && ml <= 200)) { k.ui.error = 'Poné los metros lineales (por ejemplo 11).'; return; }
    k.corr = { motivo: 'metros', antes: k.corr && k.corr.motivo === 'metros' ? k.corr.antes : k.ml, baseAntes: k.corr && k.corr.baseAntes ? k.corr.baseAntes : cotBandeja(k.ml, k.pml).base };
    k.ml = ml; k.checks = checksFacil(ml); k.texto = null; /* el texto se rehace con los montos nuevos */
    c.trabajo = `Bandeja 3 m · ${coma(ml)} m.l.`;
  } else if (mo === 'precio') {
    const pml = Number(String(k.ui.pml || '').replace(/\./g, ''));
    if (!(pml > 0)) { k.ui.error = 'Poné el precio por metro lineal.'; return; }
    if (!(k.ui.motivoTxt || '').trim()) { k.ui.error = 'Con un precio distinto de la tarifa hace falta el motivo.'; return; }
    k.corr = { motivo: 'precio', antes: k.pml, baseAntes: k.corr && k.corr.baseAntes ? k.corr.baseAntes : cotBandeja(k.ml, k.pml).base };
    k.pml = pml; k.texto = null;
  } else if (mo === 'texto') {
    /* Si antes se corrigió importe o metros, eso sigue cortando la racha */
    if (!k.corr) k.corr = { motivo: 'texto', antes: null };
    k.texto = k.ui.texto || textoPresu(c, k);
  } else {
    if (!(k.ui.otro || '').trim()) { k.ui.error = 'Contá qué cambió.'; return; }
    k.corr = { motivo: mo, antes: k.ml, txt: k.ui.otro.trim() };
  }
  k.ui.error = null; k.ui.corr = false;
  sys(cid, `${nom(S.mira)} corrigió: ${mo}${mo === 'metros' ? ` (${mlCorto(k.corr.antes)} → ${mlCorto(k.ml)})` : ''} · el servidor recalculó el texto y el PDF`);
  await cumplir('corregir', cid);
}

function toast(tipo, txt, acc) {

}

/* ═══════════════════════════════════════════════════════════════════════
   Render general (conserva foco, borradores y scroll)
   ═══════════════════════════════════════════════════════════════════════ */
function render() {
  const ae = document.activeElement;
  const fid = ae && ae.id;
  let sel = null;
  try { if (ae && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; }
  document.querySelectorAll('[data-scroll]').forEach(el => {
    S.scroll[el.dataset.scroll] = { top: el.scrollTop, abajo: el.scrollHeight - el.scrollTop - el.clientHeight < 40 };
  });
  renderBarra();
  renderGuion();
  renderTel();
  renderApp();
  document.querySelectorAll('[data-scroll]').forEach(el => {
    const k = el.dataset.scroll;
    const prev = S.scroll[k];
    if (S.bajar[k] || (prev && prev.abajo && (k === 'tel'))) el.scrollTop = el.scrollHeight;
    else if (prev) el.scrollTop = prev.top;
  });
  if (S.irTarjeta) {
    const det = document.querySelector('[data-scroll="det"]');
    const t = document.getElementById('tarjeta');
    const cab = det && det.querySelector('.det-cab.fija');
    if (det && t) det.scrollTop += t.getBoundingClientRect().top - det.getBoundingClientRect().top - (cab ? cab.offsetHeight + 8 : 8);
    else if (det) det.scrollTop = det.scrollHeight;
    S.irTarjeta = false;
  } else if (S.bajar.det) {
    const det = document.querySelector('[data-scroll="det"]');
    if (det) det.scrollTop = det.scrollHeight;
  }
  S.bajar = {};
  if (fid) {
    const el = document.getElementById(fid);
    if (el && el !== document.activeElement && !el.disabled) {
      el.focus({ preventScroll: true });
      if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* inputs sin selección */ }
    }
  }
  if (S.resaltar) { const el = document.getElementById(S.resaltar); if (el) el.classList.add('pulso'); }
  /* En el celular las pestañas de JS quedan fuera de la vista: la elegida se trae al frente */
  const tabSel = document.querySelector('.tabs [aria-selected="true"]');
  if (tabSel) { const tb = tabSel.parentElement; if (tabSel.offsetLeft + tabSel.offsetWidth > tb.scrollLeft + tb.clientWidth || tabSel.offsetLeft < tb.scrollLeft) tb.scrollLeft = tabSel.offsetLeft - 8; }
}

async function abrir(id) {
  if (!S.convs[id]) return;
  S.tab = 'charlas'; S.sel = id; S.phone = id; S.convs[id].noLeidos = 0; S.bajar.det = true;
  if (S.convs[id].tarjeta) S.irTarjeta = true;
  S.ui.devolver = null;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  const c = S.sel && S.convs[S.sel];
  const k = c && c.tarjeta;
  switch (a) {
    case 'abrir': await abrir(id); break;
    case 'volver': S.sel = null; break;
    case 'tab': S.tab = v; if (v !== 'charlas') S.ui.resaltarRacha = S.ui.resaltarRacha && v === 'ia'; break;
    case 'filtro': S.filtro = v; break;
    case 'wa-boton': {
      if (S.busy) return;
      S.busy = true;
      try { S.min += 1; await elegirBoton(S.phone, v); await correrTras(); } finally { S.busy = false; }
      break;
    }
    case 'tomar': if (c) await tomar(c.id); break;
    case 'aprobar': if (c) { S.busy = true; try { await aprobar(c.id); } finally { S.busy = false; } } break;
    case 'aprobar-forzar': if (c) { S.busy = true; try { await aprobar(c.id, S.mira, true); } finally { S.busy = false; } } break;
    case 'aprobar-cancelar': if (k) k.ui.avisoVentana = false; break;
    case 'corregir': if (k) { k.ui.corr = !k.ui.corr; k.ui.error = null; } break;
    case 'corr-motivo': if (k) { k.ui.motivo = v; k.ui.error = null; } break;
    case 'corr-cancelar': if (k) { k.ui.corr = false; k.ui.motivo = null; } break;
    case 'corr-aplicar': if (c) await aplicarCorreccion(c.id); break;
    case 'no-mandar': if (c) noMandar(c.id); break;
    case 'asig-sel': if (k) k.sel = v; break;
    case 'asig-var': if (k) { k.variante = v; k.sel = v === 'nuevo' ? k.propuesta : v === 'cliente' ? 'jorge' : 'gabriel'; } break;
    case 'asignar': if (c) await asignar(c.id); break;
    case 'presupuestar': toast('info', `En la app abre el asistente comercial con el borrador precargado con lo que juntó la IA (${c ? c.dirCorta : ''}). En la maqueta no sale de acá.`); break;
    case 'enviar': if (c) await responder(c.id, S.draft['app-txt']); break;
    case 'pdf': if (c) await mandarPdf(c.id); break;
    case 'devolver-abrir': S.ui.devolver = c ? c.id : null; render(); { const el = $('#devolver-nota'); if (el) el.focus(); } return;
    case 'devolver-cancelar': S.ui.devolver = null; break;
    case 'devolver-ok': if (c) { S.busy = true; try { await devolver(c.id, S.draft['devolver-nota']); } finally { S.busy = false; } } break;
    case 'pago': { const cid = id || (c && c.id); if (cid) await datosPago(cid); break; }
    case 'seg-hecho': S.hoyHecho[id] = v; break;
    case 'pausa':
      if (S.pausa) { S.pausa = null; toast('info', 'La IA vuelve a atender las charlas nuevas.'); }
      else S.ui.confPausa = true;
      break;
    case 'pausa-ok': await pausarIA(S.mira); break;
    case 'pausa-no': S.ui.confPausa = false; break;
    case 'reanudar': S.pausa = null; break;
    case 'rev-ver': { const r = S.revisar.find(x => x.id === id); if (r) { r.abierta = !r.abierta; if (r.conv) S.phone = r.conv; } break; }
    case 'rev-ok': await auditar(id, true); break;
    case 'rev-mal': S.ui.revMal = id; { const r = S.revisar.find(x => x.id === id); if (r && r.conv) { r.abierta = true; S.phone = r.conv; } } render(); { const el = document.getElementById('rev-txt-' + id); if (el) el.focus(); } return;
    case 'rev-guardar': await auditar(id, false, S.draft['rev-txt-' + id]); S.ui.revMal = null; break;
    case 'rev-cancelar': S.ui.revMal = null; break;
    case 'toast-abrir': await abrir(id); S.vista = 'app'; break;
    case 'toast-ver': S.vista = 'cliente'; break;
    case 'toast-cerrar': S.toasts = S.toasts.filter(t => String(t.id) !== id); renderToasts(); return;
    default: return;
  }
  render();
});

  if (!t.id) return;
  if (['cli-txt', 'app-txt', 'devolver-nota'].includes(t.id) || t.id.startsWith('rev-txt-')) { S.draft[t.id] = t.value; return; }
  const c = S.sel && S.convs[S.sel];
  const k = c && c.tarjeta;
  if (!k) return;
  if (t.id === 'corr-ml') k.ui.ml = t.value;
  else if (t.id === 'corr-pml') k.ui.pml = t.value;
  else if (t.id === 'corr-motivo-txt') k.ui.motivoTxt = t.value;
  else if (t.id === 'corr-texto') k.ui.texto = t.value;
  else if (t.id === 'corr-otro') k.ui.otro = t.value;
  else if (t.id === 'simple-total') {
    const n = Number(t.value.replace(/\D/g, ''));
    if (n > 0) { k.total = n; render(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'hoy-noestoy') { S.noEsta[S.mira] = e.target.checked; render(); }
});
document.addEventListener('toggle', e => { if (e.target.id === 'ficha') S.ui.ficha = e.target.open; }, true);
document.addEventListener('submit', async e => {
  if (e.target.id === 'form-cli') { e.preventDefault(); await clienteEscribe(); }
});
document.addEventListener('keydown', async e => {
  if (e.target.id === 'app-txt' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const c = S.sel && S.convs[S.sel];
    if (c) { await responder(c.id, S.draft['app-txt']); render(); }
  }
  if (e.target.id === 'devolver-nota' && e.key === 'Enter') { e.preventDefault(); $('#btn-devolver-ok') && $('#btn-devolver-ok').click(); }
  if (e.target.id && e.target.id.startsWith('rev-txt-') && e.key === 'Enter') { e.preventDefault(); const b = document.getElementById('rev-guardar-' + e.target.id.slice(8)); if (b) b.click(); }
  if (e.target.id === 'corr-ml' && e.key === 'Enter') { e.preventDefault(); $('#btn-recalcular') && $('#btn-recalcular').click(); }
});

$('#btn-sig').addEventListener('click', () => siguiente());
$('#btn-auto').addEventListener('click', () => hacerPorMi());
$('#btn-reiniciar').addEventListener('click', () => reiniciar());
$('#sel-esc').addEventListener('change', e => { nuevoEstado(e.target.value); guardar('esc', e.target.value); render(); });
$('#sel-mira').addEventListener('change', e => { S.mira = e.target.value; S.ui.confPausa = false; S.ui.devolver = null; render(); });
document.querySelectorAll('[data-etapa]').forEach(b => b.addEventListener('click', () => {
  const et = b.dataset.etapa;
  S.etapa = et; nuevoEstado(S.esc); S.etapa = et; guardar('etapa', et); render();
}));
document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => { S.vista = b.dataset.vista; render(); }));

const TEMAS = ['auto', 'claro', 'oscuro'];
function aplicarTema(t) {
  if (t === 'claro') document.documentElement.dataset.theme = 'light';
  else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  $('#btn-tema').textContent = 'Tema: ' + t;
}
let temaActual = 'auto';
$('#btn-tema').addEventListener('click', () => {
  temaActual = TEMAS[(TEMAS.indexOf(temaActual) + 1) % 3];
  guardar('tema', temaActual); aplicarTema(temaActual);
});

/* ═══════════════════════════════════════════════════════════════════════
   Arranque
   ═══════════════════════════════════════════════════════════════════════ */
$('#sel-esc').innerHTML = Object.entries(ESC).map(([id, x]) => `<option value="${id}">${H(x.t)}</option>`).join('');
(function arrancar() {
  const esc = leer('esc');
  nuevoEstado(esc && ESC[esc] ? esc : 'e1');
  const et = leer('etapa');
  if (['1a', '1b', '2'].includes(et)) S.etapa = et;
  temaActual = TEMAS.includes(leer('tema')) ? leer('tema') : 'auto';
  aplicarTema(temaActual);
  const ro = new ResizeObserver(() => {
    const w = $('#pane-app').clientWidth;
    if (!w) return;
    const antes = S.anchoApp || 0;
    S.anchoApp = w;
    const corte = x => (x >= 760 ? 2 : 0) + (x >= 720 ? 1 : 0) + (x >= 800 ? 1 : 0);
    if (corte(antes) !== corte(w)) render();
  });
  ro.observe($('#pane-app'));
  MQ_ANCHO.addEventListener('change', () => render());
  render();
})();
</script>
